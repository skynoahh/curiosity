teaser:'Das Dosenpfand war ursprünglich gar nicht als Umweltmaßnahme geplant, sondern als Drohung.',
story:`<p>Mehrwegpfand auf Bierflaschen gibt es in Deutschland seit Langem – das ist ein alter Handelsbrauch, kein Gesetz.</p>
<h4>Die Zwangsabgabe, die eigentlich nie kommen sollte</h4>
<p>1991 erließ die Bundesregierung die Verpackungsverordnung. Darin stand: Wenn der Anteil von <strong>Mehrwegverpackungen bei Getränken unter 72 %</strong> fällt, tritt automatisch ein Zwangspfand auf Einwegverpackungen in Kraft.</p>
<p>Der Punkt war <strong>Abschreckung</strong>. Die Industrie sollte den Mehrweganteil freiwillig hochhalten, damit das Pfand nie nötig wird.</p>
<h4>Die Quote fiel trotzdem</h4>
<p>Dosen und Einwegflaschen wurden immer beliebter. Der Anteil rutschte unter die Marke, und 2003 trat das <strong>Dosenpfand</strong> in Kraft – gegen massiven Widerstand von Handel und Getränkeindustrie, begleitet von zahlreichen Klagen.</p>
<p>Anfangs war das System chaotisch: Jede Kette nahm nur ihre eigenen Behälter zurück, es gab Insellösungen mit unterschiedlichen Logos. Erst 2006 kam die einheitliche Rücknahme.</p>
<h4>Das Ergebnis</h4>
<p>Die Rücklaufquote bei Einweg-Pfandflaschen liegt heute bei rund 98 % – international ein Spitzenwert. Der eigentliche Zweck ist allerdings gescheitert: Der Mehrweganteil ist nicht gestiegen. Das Pfand hat <strong>Recycling</strong> ermöglicht, nicht Wiederbefüllung.</p>
<p>Nebenbei ist eine soziale Praxis entstanden: Pfandflaschen werden neben Mülleimer gestellt statt hinein. In vielen Städten gibt es inzwischen Pfandringe an Abfallbehältern.</p>`,

teaser:'Spanien liegt in der falschen Zeitzone. Seit 1940. Und niemand hat es je korrigiert.',
story:`<p>In Spanien isst man um 14 oder 15 Uhr zu Mittag und um 21 oder 22 Uhr zu Abend. Das gilt als kulturelle Eigenart. Es ist aber wohl vor allem <strong>ein Uhrenproblem</strong>.</p>
<h4>1940</h4>
<p>Geografisch liegt fast ganz Spanien westlich des Nullmeridians – auf derselben Länge wie Großbritannien und Portugal. Bis 1940 galt dort auch die entsprechende Zeit.</p>
<p>Dann stellte das Franco-Regime die Uhren um eine Stunde vor, auf mitteleuropäische Zeit. Als Grund gilt die Angleichung an das damalige Deutschland. Nach dem Krieg wurde die Änderung nie rückgängig gemacht.</p>
<h4>Die Folge</h4>
<p>In Madrid geht die Sonne im Sommer erst gegen 21:30 Uhr unter. Die Spanier essen also gar nicht „spät“ – sie essen zur normalen Sonnenzeit, nur mit einer Uhr, die eine Stunde vorgeht.</p>
<p>Dazu kommt ein zweiter Faktor: In der Nachkriegszeit arbeiteten viele Menschen zwei Jobs. Die lange Mittagspause war der Übergang zwischen beiden – und der Feierabend entsprechend spät.</p>
<h4>Die Debatte</h4>
<p>Eine spanische Parlamentskommission empfahl 2013 die Rückkehr zur westeuropäischen Zeit – unter anderem mit Verweis auf Schlafmangel und Produktivität. Passiert ist bislang nichts.</p>

id:'trinkgeld', t:'Warum Trinkgeld überall anders ist', emoji:'💵', cat:'kultur',
teaser:'In den USA gilt Trinkgeld als selbstverständlich – dabei war es dort mal fast verboten.',
story:`<p>Trinkgeld entstand vermutlich im europäischen Adel: Ein Gast gab den Bediensteten des Gastgebers eine Münze. Es war eine Geste von oben nach unten.</p>
<h4>Der Import nach Amerika</h4>
<p>Wohlhabende Amerikaner brachten die Sitte im 19. Jahrhundert von Europareisen mit. In den USA stieß sie zunächst auf <strong>heftige Ablehnung</strong> – sie galt als undemokratisch und als Import einer Dienerkultur.</p>
<p>Es gab eine organisierte Anti-Trinkgeld-Bewegung, und mehrere US-Bundesstaaten verboten Trinkgeld zwischen 1909 und 1915 sogar per Gesetz. Die Gesetze waren praktisch nicht durchsetzbar und wurden bis 1926 wieder aufgehoben.</p>
<h4>Warum es sich trotzdem durchsetzte</h4>
<p>Historikerinnen und Historiker – etwa Kerry Segrave – weisen auf einen unangenehmen Zusammenhang hin: Nach dem Bürgerkrieg beschäftigten Gastronomie und Eisenbahn viele befreite Sklaven, teils ganz ohne Lohn, mit Trinkgeld als einzigem Einkommen. Das System sparte Arbeitgebern Geld.</p>
<p>Diese Struktur wurde später gesetzlich verfestigt: Der US-Mindestlohn für Beschäftigte mit Trinkgeld liegt auf Bundesebene bis heute deutlich unter dem allgemeinen Mindestlohn.</p>
<h4>Und anderswo?</h4>
<p>In <strong>Japan</strong> gilt Trinkgeld vielerorts als unhöflich – guter Service ist selbstverständlich und kein Extra. Wer Geld liegen lässt, wird häufig damit hinterhergelaufen.</p>
<p>In Deutschland und den meisten europäischen Ländern ist Bedienung im Preis enthalten; Trinkgeld ist Anerkennung, keine Gehaltsergänzung.</p>`,

id:'kfc-weihnachten', t:'KFC an Weihnachten in Japan', emoji:'🍗', cat:'kultur',
teaser:'Millionen Japaner essen an Heiligabend Fried Chicken. Wegen einer Werbekampagne von 1974.',
story:`<p>Weihnachten ist in Japan kein religiöser Feiertag – nur ein bis zwei Prozent der Bevölkerung sind Christen. Der 24. Dezember ist ein normaler Arbeitstag und gilt eher als <strong>romantischer Anlass für Paare</strong>, ungefähr wie der Valentinstag.</p>
<h4>Die Kampagne</h4>
<p>Die verbreitete Firmenerzählung: Ein Filialleiter in Tokio, <strong>Takeshi Okawara</strong>, hörte mit, wie Ausländer sich beklagten, in Japan keinen Weihnachtstruthahn zu bekommen. Er bot daraufhin einen „Party-Eimer“ an.</p>
<p>1974 startete KFC daraus die landesweite Kampagne <strong>„Kentucky für Weihnachten“</strong> (<em>Kurisumasu ni wa Kentakkii</em>). Das Timing war perfekt: Es gab keine bestehende japanische Weihnachtsessen-Tradition, in die man hätte eindringen müssen. Man konnte eine schaffen.</p>
<h4>Das Ergebnis</h4>
<p>Heute gehört das KFC-Weihnachtsmenü für viele Familien fest dazu. Die Bestellungen laufen ab Anfang Dezember; wer nicht vorbestellt, steht an Heiligabend teils über eine Stunde an. Der 24. Dezember gehört zu den umsatzstärksten Tagen des Jahres für KFC Japan.</p>
<p>Und Colonel-Sanders-Statuen vor den Filialen bekommen zur Saison einen Weihnachtsmannmantel.</p>
<h4>Der Punkt</h4>
<p>Es ist eines der klarsten Beispiele für eine <strong>erfundene Tradition</strong>, deren Entstehungsdatum sich exakt benennen lässt – und die trotzdem für Millionen Menschen echte, emotional besetzte Familienerinnerung ist.</p>`,

id:'oktoberfest', t:'Warum das Oktoberfest im September ist', emoji:'🍻', cat:'kultur',
teaser:'Ein Pferderennen zu einer Hochzeit – und danach hat man das Wetter dazugelernt.',
story:`<p>Am <strong>12. Oktober 1810</strong> heiratete Kronprinz Ludwig von Bayern Prinzessin Therese von Sachsen-Hildburghausen. Zur Feier gab es fünf Tage später ein öffentliches <strong>Pferderennen</strong> auf einer Wiese vor der Stadt.</p>
<p>Die Wiese wurde nach der Braut benannt: <strong>Theresienwiese</strong>. Bis heute sagen Münchner „auf d'Wiesn“.</p>
<h4>Warum es sich wiederholte</h4>
<p>Das Rennen war so beliebt, dass man es im Folgejahr wiederholte – zunächst verbunden mit einem <strong>Landwirtschaftsfest</strong>, das die bayerische Agrarwirtschaft fördern sollte. Bierbuden kamen erst nach und nach dazu; die großen Bierzelte entstanden gegen Ende des 19. Jahrhunderts.</p>
<h4>Und die Verschiebung?</h4>
<p>Ganz banal: <strong>Wetter</strong>. Im September sind die Abende in München deutlich wärmer als Mitte Oktober. Also wanderte das Fest über die Jahrzehnte nach vorn.</p>
<p>Der Bezug zum Ursprungsdatum blieb aber: Das Fest endet traditionell am ersten Sonntag im Oktober. Fällt der auf den 1. oder 2. Oktober, wird bis zum 3. Oktober verlängert – seit der Wiedervereinigung praktischerweise ein Feiertag.</p>
<h4>Ein Detail</h4>
<p>Das Fest fiel in seiner Geschichte etwa zwei Dutzend Mal aus – wegen Kriegen, Cholera und zuletzt der Pandemie. Und das Pferderennen, mit dem alles begann, wurde 1938 zum letzten Mal regulär ausgetragen.</p>`,

teaser:'Vor 150 Jahren waren sie kleiner als Amerikaner. Heute sind sie die größten der Welt.',
story:`<p>Niederländische Männer sind im Durchschnitt rund 1,84 m groß – Weltspitze. Frauen ebenfalls. Aber das ist ein <strong>neues Phänomen</strong>.</p>
<h4>Der Umschwung</h4>
<p>Mitte des 19. Jahrhunderts lagen niederländische Wehrpflichtige bei etwa 1,65 m – deutlich unter dem US-Durchschnitt der Zeit. Innerhalb von rund 150 Jahren haben sie fast 20 Zentimeter zugelegt, während die USA nach dem Zweiten Weltkrieg weitgehend stagnierten.</p>
<h4>Die Erklärungen</h4>
<p><strong>Ernährung und Gesundheitssystem:</strong> Milchreiche Ernährung, ein sehr gutes und egalitäres Gesundheitssystem, geringe Einkommensunterschiede bei Grundversorgung. Körpergröße gilt Forschenden als guter Indikator für die Ernährungs- und Gesundheitslage einer Bevölkerung in der Kindheit.</p>
<p><strong>Und ein zweiter, ungewöhnlicher Faktor:</strong> Eine Untersuchung von Gert Stulp und Kollegen (2015) an Daten aus der nördlichen Provinz Friesland fand Hinweise darauf, dass größere niederländische Männer im Durchschnitt <strong>mehr Kinder</strong> hatten als kleinere – anders als in den USA, wo mittelgroße Männer vorne lagen.</p>
<p>Das wäre ein Fall messbarer natürlicher Selektion in einer modernen Bevölkerung. Die Studie ist viel zitiert und wird zugleich vorsichtig diskutiert – der Effekt allein erklärt die 20 Zentimeter nicht.</p>
<h4>Die praktische Folge</h4>
<p>Niederländische Bauvorschriften wurden angepasst: Mindesthöhen für Türrahmen und Treppen liegen höher als in vielen Nachbarländern. Krankenhausbetten sind länger.</p>`,

teaser:'In vielen ostasiatischen Hochhäusern gibt es keine 4. Etage. Das hat handfeste wirtschaftliche Folgen.',
story:`<p>Im Chinesischen klingt das Wort für „vier“ (<em>sì</em>) fast genauso wie das Wort für „Tod“ (<em>sǐ</em>). Ähnliches gilt im Japanischen (<em>shi</em>) und Koreanischen.</p>
<p>Das Ergebnis nennt sich <strong>Tetraphobie</strong>: In vielen Gebäuden fehlen Stockwerke mit einer 4 – teils auch die 14, 24 und der ganze Bereich 40 bis 49. In Krankenhäusern fehlen entsprechende Zimmernummern. Produkte werden nicht in Vierergruppen verkauft.</p>
<h4>Messbare Folgen</h4>
<p>Untersuchungen an Immobilienmärkten in Hongkong und Singapur zeigen: Wohnungen in Stockwerken mit einer 4 erzielen <strong>messbar niedrigere Preise</strong>. Umgekehrt bringen Nummern mit 8 – <em>bā</em>, klanglich nah an „Wohlstand“ – Aufschläge.</p>
<p>Autokennzeichen und Telefonnummern mit vielen Achten werden versteigert; in Hongkong wurden für einzelne Nummernschilder Millionenbeträge gezahlt.</p>
<p>Die Olympischen Spiele in Peking begannen am <strong>8.8.2008 um 8:08:08 Uhr</strong> Ortszeit. Kein Zufall.</p>
<h4>Und bei uns?</h4>
<p>Genau dasselbe Muster, andere Zahl: Viele Hotels und Hochhäuser in Europa und den USA haben keine <strong>13</strong>. Manche Fluggesellschaften überspringen die Sitzreihe 13. Der Fachbegriff dafür ist Triskaidekaphobie.</p>
<p>Das Interessante daran: Beide Gesellschaften halten die jeweils andere Zahlenscheu für putzigen Aberglauben – und behalten die eigene bei.</p>`,

id:'flughafen-gepaeck', t:'Der lange Weg zur Gepäckausgabe', emoji:'🧳', cat:'alltag',
teaser:'An manchen Flughäfen läuft man absichtlich länger. Und das macht die Leute zufriedener.',
story:`<p>Ein häufig zitierter Fall stammt vom Flughafen <strong>Houston</strong>: Passagiere beschwerten sich über lange Wartezeiten an der Gepäckausgabe. Der Flughafen stellte mehr Personal ein, die Wartezeit sank auf rund acht Minuten – die Beschwerden blieben.</p>
<h4>Die Analyse</h4>
<p>Man schaute genauer hin: Der Weg vom Gate zum Gepäckband dauerte etwa <strong>eine Minute</strong>. Danach standen die Leute rund <strong>sieben Minuten</strong> herum.</p>
<p>Die Lösung bestand nicht darin, die Gesamtzeit zu verkürzen. Ankunftsgates wurden weiter entfernt zugewiesen und das Gepäck an ein weiter entferntes Band geleitet. Die Gehzeit stieg auf etwa sechs Minuten, die Standzeit sank entsprechend.</p>
<p><strong>Die Gesamtzeit blieb praktisch gleich. Die Beschwerden gingen fast auf null.</strong></p>
<h4>Warum das funktioniert</h4>
<p>Es ist derselbe Mechanismus wie beim Spiegel im Aufzug: <strong>Beschäftigte Wartezeit fühlt sich deutlich kürzer an als unbeschäftigte.</strong> Wer geht, hat das Gefühl, Fortschritt zu machen.</p>
<p>Dazu kommt ein zweiter Effekt: Wartezeit ohne erkennbaren Grund fühlt sich am längsten an. Deshalb sagen gute Servicekräfte, warum es dauert.</p>
<h4>Wo man das noch findet</h4>
<p>Fortschrittsbalken, die nicht linear laufen, sondern am Ende beschleunigen. Ladeanimationen, die etwas anzeigen. Abfahrtszeiten an Haltestellen. Und die Schlangenführung in Freizeitparks, die um Ecken läuft, damit man nie die ganze Schlange sieht.</p>`,

id:'tulpenmanie', t:'Die Tulpenmanie', emoji:'🌷', cat:'business',
teaser:'Die berühmteste Spekulationsblase der Geschichte – und die Forschung sagt: fast alles daran ist übertrieben.',
story:`<p>Die Standardversion: Im Holland der 1630er kostete eine einzelne Tulpenzwiebel angeblich so viel wie ein Grachtenhaus. Handwerker verkauften ihre Werkstätten, um mitzuspekulieren. 1637 platzte die Blase, die Wirtschaft brach zusammen, Menschen ruinierten sich, es gab Selbstmorde.</p>
<h4>Was die Forschung sagt</h4>
<p>Die Historikerin <strong>Anne Goldgar</strong> hat für ihr Buch „Tulipmania“ die Archive systematisch durchgearbeitet. Ergebnis:</p>
<p>Sehr hohe Preise gab es tatsächlich – aber nur für einige seltene Sorten, gehandelt in einem <strong>kleinen Kreis</strong> wohlhabender Kaufleute und Kenner. Es war kein Volkswahn.</p>
<p>Goldgar fand <strong>keine Belege</strong> für Massenpleiten oder Selbstmorde. Die niederländische Wirtschaft, damals die reichste Europas, zeigt in den Folgejahren keine Krisenspuren.</p>
<h4>Woher kommt der Mythos?</h4>
<p>Vor allem aus zwei Quellen: zeitgenössischen <strong>Moralschriften</strong> und Flugblättern, die in den Nachwehen des Zusammenbruchs vor Gier warnten – also Propaganda, nicht Berichterstattung. Und aus dem Buch <em>„Extraordinary Popular Delusions and the Madness of Crowds“</em> von Charles Mackay (1841), der diese Flugblätter weitgehend ungeprüft übernahm.</p>
<p>Mackays Buch war extrem einflussreich. Praktisch alles, was heute über die Tulpenmanie erzählt wird, geht auf diese eine Nacherzählung zurück.</p>
<h4>Was echt war</h4>
<p>Der Preiseinbruch fand statt, und viele Verträge wurden nicht erfüllt. Der eigentliche Schaden war aber eher <strong>sozial</strong>: In einer Gesellschaft, die auf persönlichem Vertrauen basierte, wurden reihenweise Ehrenworte gebrochen.</p>`,

id:'preise-99', t:'Warum Preise auf ,99 enden', emoji:'🏷️', cat:'business',
teaser:'Die wahrscheinlichste Erklärung hat mit Diebstahl zu tun – nicht mit Psychologie.',
story:`<p>Zwei Erklärungen konkurrieren, und beide haben etwas für sich.</p>
<h4>1. Die Kasse</h4>
<p>Die historische Erklärung: Wenn ein Artikel <strong>1,00</strong> kostet und der Kunde einen Dollar hinlegt, kann der Verkäufer das Geld einstecken, ohne die Kasse zu öffnen. Kostet er <strong>0,99</strong>, muss er Wechselgeld herausgeben – also die Kasse öffnen, die den Verkauf registriert und (bei frühen Registrierkassen) ein Klingeln erzeugt, das der Chef hört.</p>
<p>Krummer Preis = erzwungene Buchung = weniger Diebstahl durch das eigene Personal. Diese Erklärung wird häufig mit der Verbreitung der Registrierkasse in den 1880ern in Verbindung gebracht.</p>
<h4>2. Der linke Ziffer-Effekt</h4>
<p>Der psychologische Teil ist gut untersucht: Wir lesen Zahlen von links und verankern uns an der <strong>ersten Ziffer</strong>. 9,99 wird als „neun und etwas“ wahrgenommen, 10,00 als „zehn“. Der objektive Unterschied ist ein Cent, der gefühlte deutlich größer.</p>
<p>In Feldexperimenten führte der Wechsel von einer runden auf eine .99-Endung teils zu spürbar höheren Absätzen – in einigen Studien sogar dann, wenn der .99-Preis <em>höher</em> war als der Vergleichspreis.</p>
<h4>Wo es nicht gemacht wird</h4>
<p>Luxusmarken benutzen bewusst <strong>runde Preise</strong>. Krumme Zahlen signalisieren Kalkulation und Schnäppchen; runde signalisieren Souveränität. Eine Uhr für 12.000 wirkt teurer als eine für 11.999 – und genau das ist erwünscht.</p>
<p>Auch in Restaurants höherer Preisklasse verschwinden Nachkommastellen und teils sogar die Währungszeichen.</p>`,

id:'diamanten', t:'Warum Diamanten teuer sind', emoji:'💍', cat:'business',
teaser:'Der berühmteste Werbeslogan der Geschichte hat eine ganze Tradition erfunden.',
story:`<p>Diamanten sind nicht besonders selten. Was sie teuer machte, war jahrzehntelang die <strong>kontrollierte Verknappung</strong> durch das Kartell von <strong>De Beers</strong>, das ab Ende des 19. Jahrhunderts große Teile der Weltproduktion und des Handels beherrschte.</p>
<h4>Das Problem 1938</h4>
<p>In der Weltwirtschaftskrise brachen die Preise ein. Diamantverlobungsringe waren in den USA keineswegs Standard. De Beers beauftragte die Werbeagentur N.W. Ayer.</p>
<h4>Der Satz</h4>
<p>1947 schrieb die Texterin <strong>Frances Gerety</strong> spätabends, unzufrieden mit ihren Entwürfen, vier Wörter auf: <em>„A Diamond Is Forever.“</em></p>
<p>Der Satz leistet zweierlei. Erstens verknüpft er einen Stein mit ewiger Liebe. Zweitens – und das war der geschäftliche Kern – vermittelt er, dass man einen Diamanten <strong>niemals weiterverkauft</strong>. Ein funktionierender Gebrauchtmarkt hätte die künstliche Knappheit zerstört.</p>
<p>Das Advertising Age wählte ihn zum Slogan des 20. Jahrhunderts. Gerety arbeitete 25 Jahre an der Kampagne und heiratete nie.</p>
<h4>Die erfundene Regel</h4>
<p>Auch die Faustregel, ein Ring solle ein bis drei Monatsgehälter kosten, stammt aus der De-Beers-Werbung. In den 1930ern war von einem Monatsgehalt die Rede, später von zwei, in Japan von drei.</p>
<p>In Japan lag der Anteil der Verlobungen mit Diamantring vor der Kampagne bei wenigen Prozent. Innerhalb von rund 15 Jahren stieg er auf ein Vielfaches. Eine Tradition, aus dem Nichts.</p>`,

teaser:'Die wichtigste Auszeichnung der Gastronomie wurde von einem Reifenhersteller erfunden. Aus offensichtlichem Eigeninteresse.',
story:`<p>1900 gab es in Frankreich rund 3.000 Autos. Für einen Reifenhersteller ist das ein Problem: Die Kunden müssen erst einmal existieren – und dann viel fahren.</p>
<h4>Die Idee</h4>
<p>Die Brüder <strong>André und Édouard Michelin</strong> gaben einen kostenlosen Reiseführer heraus: Werkstätten, Tankstellen, Hotels, Karten, Anleitungen zum Reifenwechsel. Ziel war, Autofahren attraktiver und einfacher zu machen. Mehr Fahren bedeutet mehr Reifenverschleiß.</p>
<p>1920 stellte André Michelin angeblich fest, dass ein Händler Exemplare des Führers als <strong>Unterlage für eine wackelige Werkbank</strong> benutzte. Daraus zog er den Schluss: Menschen schätzen nur, wofür sie zahlen. Ab da kostete der Führer Geld – und wurde ernster genommen.</p>
<h4>Die Sterne</h4>
<p>Ab 1926 gab es einen Stern für gute Restaurants, ab 1931 das dreistufige System. Die offizielle Bedeutung ist bis heute an das Reisen gekoppelt:</p>
<p><strong>Ein Stern:</strong> einen Stopp wert.<br>
<strong>Zwei Sterne:</strong> einen Umweg wert.<br>
<strong>Drei Sterne:</strong> eine eigene Reise wert.</p>
<p>Die Tester bleiben anonym, zahlen ihre Rechnungen selbst und geben sich nicht zu erkennen.</p>
<h4>Der Druck</h4>
<p>Die Auszeichnung ist so bedeutend geworden, dass Köche sie fürchten. Einige haben öffentlich um <strong>Rückgabe</strong> ihrer Sterne gebeten – wegen des Erwartungsdrucks und der Kosten, das Niveau zu halten. Der Fall des französischen Kochs Sébastien Bras, der 2017 darum bat, aus dem Führer gestrichen zu werden, hat international Aufmerksamkeit erregt.</p>`,

{
id:'dollar-buck', t:'Warum ein Dollar „Buck“ heißt', emoji:'🦌', cat:'business',
teaser:'Und warum die Währung fast der halben Welt nach einem böhmischen Tal benannt ist.',
story:`<h4>Buck</h4>
<p>Im nordamerikanischen Pelzhandel des 18. Jahrhunderts war das <strong>Hirschfell</strong> (<em>buckskin</em>) eine gängige Recheneinheit. Waren wurden in „bucks“ ausgezeichnet. Ein Eintrag von 1748 dokumentiert einen Tauschwert in Hirschfellen.</p>
<p>Als Geld die Fellwährung ablöste, blieb das Wort. Ähnlich wie „Kohle“ oder „Kies“ im Deutschen.</p>
<h4>Dollar</h4>
<p>Die Herkunft ist noch schöner. Im Tal <strong>Sankt Joachimsthal</strong> in Böhmen (heute Jáchymov, Tschechien) wurde ab 1520 aus lokalem Silber eine große Münze geprägt: der <strong>Joachimsthaler</strong>, kurz <strong>Thaler</strong>.</p>
<p>Diese Münze war so verbreitet und wertstabil, dass ihr Name zum Gattungsbegriff wurde. Im Niederländischen wurde daraus <em>daalder</em>, im Englischen <strong>dollar</strong>.</p>
<p>Die USA übernahmen den Namen 1792 – auch, weil der spanische Silber-Peso in den Kolonien verbreitet war und dort „Spanish dollar“ genannt wurde.</p>
<p>Der Name des Tals stammt übrigens vom heiligen Joachim. Und dieselbe Region wurde später berühmt, weil <strong>Marie Curie</strong> aus dem dortigen Uranerz Radium isolierte.</p>
<h4>Und das $-Zeichen?</h4>
<p>Es geht wahrscheinlich auf die Abkürzung für spanische Pesos zurück – ein „P“ mit übergelegtem „S“, das mit der Zeit zum durchgestrichenen S vereinfacht wurde. Die populäre Deutung als übereinanderliegendes „U“ und „S“ ist eine spätere Erfindung.</p>`,

story:`<p>Die gängige Erklärung: Am Freitag nach Thanksgiving schreiben Händler erstmals im Jahr <strong>schwarze Zahlen</strong>, also Gewinn statt Verlust.</p>
<h4>Das ist eine nachträgliche Erfindung</h4>
<p>Der Begriff entstand in den 1950er- und 60er-Jahren in <strong>Philadelphia</strong> – und war eindeutig negativ gemeint.</p>
<p>Am Tag nach Thanksgiving strömten Massen in die Innenstadt: Weihnachtseinkäufe, dazu am Samstag das große Football-Spiel Army gegen Navy. Ergebnis: Verkehrschaos, überfüllte Gehwege, Ladendiebstahl, Unfälle, keine Pause und keine freien Tage für die Einsatzkräfte.</p>

teaser:'Der Bär kommt vermutlich von Fellhändlern, die verkauften, was sie noch nicht hatten.',
story:`<p>Steigende Kurse heißen Bullenmarkt, fallende Bärenmarkt. Warum ausgerechnet diese Tiere?</p>
<h4>Die Bewegungserklärung</h4>
<p>Die verbreitete Version: Ein Bulle stößt mit den Hörnern <strong>nach oben</strong>, ein Bär schlägt mit der Tatze <strong>nach unten</strong>. Hübsch – aber vermutlich nachträglich hinzuerfunden.</p>
<h4>Die wahrscheinlichere Herkunft</h4>
<p>Es gibt ein englisches Sprichwort aus dem 18. Jahrhundert: <em>„to sell the bear's skin before one has caught the bear“</em> – das Fell des Bären verkaufen, bevor man ihn erlegt hat.</p>
<p>Genau das taten Zwischenhändler im Pelzhandel: Sie verkauften Felle, die sie noch nicht besaßen, in der Erwartung, sie später billiger einkaufen zu können. Diese Händler wurden <em>bearskin jobbers</em> genannt, kurz <strong>bears</strong>.</p>
<p>Das ist im Kern ein <strong>Leerverkauf</strong> – ein Geschäft, das nur funktioniert, wenn die Preise fallen. Der Begriff ist ab dem frühen 18. Jahrhundert an der Londoner Börse belegt, unter anderem im Umfeld der Südseeblase von 1720.</p>
<p>Der <strong>Bulle</strong> kam später als Gegenbegriff dazu. Eine Rolle spielten dabei vermutlich damals populäre Tierkämpfe zwischen Bullen und Bären, die die Paarung im Sprachgebrauch verfestigten.</p>
<h4>Die Statuen</h4>
<p>Der berühmte „Charging Bull“ an der Wall Street war kein Auftrag. Der Bildhauer <strong>Arturo Di Modica</strong> stellte ihn 1989 nach dem Börsencrash von 1987 heimlich in der Nacht vor der Börse ab – als Geschenk und Symbol für Widerstandskraft. Die Stadt ließ ihn abtransportieren; nach öffentlichem Protest wurde er wenige Straßen weiter wieder aufgestellt.</p>`,

teaser:'Die Geschichte mit den in Salz bezahlten Legionären ist vermutlich falsch. Die Sprachspur stimmt trotzdem.',
story:`<p>„Salary“ kommt von lateinisch <em>salarium</em>, und darin steckt <em>sal</em> – Salz. So weit ist alles unstrittig.</p>
<h4>Die populäre Version</h4>
<p>Römische Legionäre seien in Salz bezahlt worden, weil Salz so wertvoll war. Daher „Salär“ – und daher die Redewendung, jemand sei „sein Geld wert“ (<em>worth his salt</em>).</p>
<h4>Warum das wackelt</h4>
<p>Es gibt keinen belastbaren antiken Beleg dafür, dass Sold in Salz ausgezahlt wurde. Und Salz war im Römischen Reich mit seinen Salinen und dem gut ausgebauten Handel <strong>nicht besonders teuer</strong>.</p>
<p>Plinius der Ältere erwähnt das <em>salarium</em>, ohne es eindeutig zu erklären. Wahrscheinlicher ist eine <strong>Zulage zum Kauf</strong> von Salz oder allgemeiner eine Aufwandsentschädigung – vergleichbar mit einem heutigen Verpflegungszuschuss.</p>
<h4>Was sicher stimmt</h4>
<p>Salz war logistisch enorm wichtig: Es war jahrtausendelang die einzige zuverlässige Methode, Lebensmittel haltbar zu machen. Ganze Städte leben von diesem Erbe – <strong>Salzburg</strong>, <strong>Halle</strong>, <strong>Hallstatt</strong> (von keltisch <em>hal</em> für Salz), <strong>Lüneburg</strong>. Die „Alte Salzstraße“ von Lüneburg nach Lübeck war eine der wichtigsten Handelsrouten des Mittelalters.</p>
<p>Und noch eine Sprachspur: <strong>Salat</strong> kommt von italienisch <em>insalata</em> – „gesalzen“. Salat ist wörtlich das gesalzene Gemüse.</p>
<p><strong>Salami</strong> ebenfalls: „das Gesalzene“.</p>`,

teaser:'Für 12 Dollar. Und für eine Minute gehörte sie ihm wirklich.',
story:`<p>Am 29. September 2015 saß <strong>Sanmay Ved</strong>, ein ehemaliger Google-Mitarbeiter, abends am Rechner und probierte den Dienst <em>Google Domains</em> aus.</p>
<p>Aus Neugier tippte er <strong>google.com</strong> ein.</p>
<h4>Die Domain war zum Kauf verfügbar</h4>
<p>Er legte sie in den Warenkorb. Der Preis: <strong>12 US-Dollar</strong>. Er zahlte. Die Bestellung ging durch.</p>
<p>Kurz darauf trafen bei ihm Bestätigungs-E-Mails ein – darunter interne Benachrichtigungen zur Domainverwaltung, die eigentlich nur an den Eigentümer gehen. Ihm war klar, dass etwas ernsthaft schiefgelaufen war.</p>
<p>Nach etwa einer Minute stornierte Googles System den Kauf automatisch. Ved erhielt die 12 Dollar zurück.</p>
<h4>Die Belohnung</h4>
<p>Google zahlte ihm eine Prämie aus dem Sicherheitsprogramm. Die Summe war <strong>6.006,13 Dollar</strong> – Zahlenspielerei mit „google“ in Leetspeak.</p>
<p>Ved kündigte an, das Geld zu spenden. Daraufhin <strong>verdoppelte Google den Betrag</strong>.</p>
<h4>Warum das passieren konnte</h4>

<p>Ähnliches ist übrigens schon einmal passiert: 2003 lief <strong>microsoft.co.uk</strong> aus, weil eine Rechnung nicht bezahlt wurde. 1999 war die Hauptdomain von Microsofts Passport-Dienst kurzzeitig abgelaufen und wurde von einem Nutzer bezahlt.</p>`,

teaser:'Es ist gleichzeitig ein Trockenmittel, ein Säurebad und eine Desinfektionsanlage.',
story:`<p>Honig ist eines der wenigen Lebensmittel, die praktisch unbegrenzt haltbar sind. Drei Eigenschaften wirken zusammen.</p>
<h4>1. Kaum Wasser</h4>
<p>Honig enthält typischerweise nur etwa <strong>17 % Wasser</strong>. Er ist eine übersättigte Zuckerlösung und stark <strong>hygroskopisch</strong> – er zieht Wasser an. Für Bakterien und Pilze bedeutet das: Sie werden osmotisch ausgetrocknet. Wasser wird ihnen buchstäblich aus den Zellen gezogen.</p>
<h4>2. Sauer</h4>
<p>Der pH-Wert liegt typischerweise zwischen etwa 3,5 und 4,5 – ähnlich wie bei Orangensaft. Für die meisten Mikroorganismen ist das zu sauer.</p>
<h4>3. Selbstdesinfizierend</h4>
<p>Bienen fügen beim Herstellen das Enzym <strong>Glucose-Oxidase</strong> hinzu. Wenn Honig mit Wasser in Kontakt kommt, entsteht daraus in kleinen Mengen <strong>Wasserstoffperoxid</strong> – ein Desinfektionsmittel.</p>
<p>Deshalb wurde Honig jahrtausendelang zur Wundbehandlung eingesetzt, und medizinischer Honig wird bis heute in der Wundversorgung verwendet.</p>
<h4>Der Fund</h4>
<p>In ägyptischen Grabkammern wurden Gefäße mit Honig gefunden, der nach Angaben der Ausgräber noch nicht verdorben war. Diese Aussage wird oft zitiert und ist schwer streng zu überprüfen – plausibel ist sie aufgrund der Chemie durchaus.</p>
<h4>Die Bedingung</h4>
<p>Das gilt nur für <strong>verschlossenen</strong> Honig. Offen zieht er Feuchtigkeit aus der Luft, und ab einem bestimmten Wassergehalt kann er gären.</p>
<p>Und ein ernster Hinweis: Honig kann Sporen von <em>Clostridium botulinum</em> enthalten. Für Erwachsene harmlos, für Säuglinge unter zwölf Monaten gefährlich – deshalb die Warnung auf vielen Gläsern.</p>`,

teaser:'Die Kirchenfenster-Erklärung ist einer der hartnäckigsten Irrtümer der Physik.',
story:`<p>Die Behauptung: Glas sei eine extrem zähe Flüssigkeit, und deshalb seien mittelalterliche Kirchenfenster unten dicker als oben – das Glas sei über Jahrhunderte nach unten geflossen.</p>
<h4>Warum das falsch ist</h4>
<p>Rechnungen zur Viskosität von Glas bei Raumtemperatur ergeben Fließzeiten, die die Lebensdauer des Universums um viele Größenordnungen übersteigen. In menschlichen Zeiträumen fließt gar nichts.</p>
<p>Und ein einfacher Gegenbeweis: <strong>Römische Gläser</strong> aus Grabungen, teils 2.000 Jahre alt, zeigen keine solche Verformung.</p>
<h4>Warum die Fenster ungleich sind</h4>
<p>Mittelalterliches Fensterglas wurde meist im <strong>Mondglasverfahren</strong> hergestellt: Man blies eine Kugel, öffnete sie und schleuderte sie zu einer flachen Scheibe. Die entstehende Scheibe war zwangsläufig <strong>unterschiedlich dick</strong> – innen dicker, außen dünner.</p>
<p>Beim Einbau setzte man die dickere Kante logischerweise <strong>nach unten</strong>: stabiler und einfacher zu montieren. Es gibt tatsächlich auch alte Fenster mit der dicken Seite oben oder seitlich.</p>
<h4>Was Glas wirklich ist</h4>
<p>Glas ist ein <strong>amorpher Festkörper</strong>: fest, aber ohne die regelmäßige Kristallstruktur, die etwa Salz oder Metall haben. Die Atome sind angeordnet wie in einer Flüssigkeit – nur eingefroren.</p>
<p>Diese Zwischenstellung macht Glas physikalisch bis heute interessant. Die Frage, was beim Glasübergang genau passiert, gilt als eines der schwierigeren ungelösten Probleme der Festkörperphysik.</p>`,

story:`<p>Bananen enthalten viel <strong>Kalium</strong>. Und ein winziger Anteil des natürlich vorkommenden Kaliums – etwa 0,012 % – ist das radioaktive Isotop <strong>Kalium-40</strong>.</p>

<h4>Die Banana Equivalent Dose</h4>
<p>Weil sich abstrakte Strahlungsangaben schlecht vermitteln lassen, benutzen Physikerinnen und Physiker die <strong>„Bananen-Äquivalentdosis“</strong>: die zusätzliche Strahlendosis durch den Verzehr einer Banane, ungefähr 0,1 Mikrosievert.</p>
<p>Zum Vergleich: Ein Transatlantikflug entspricht grob mehreren hundert Bananen; eine Röntgenaufnahme des Brustkorbs liegt in ähnlicher Größenordnung.</p>
<h4>Der wichtige Haken</h4>
<p>Fachleute weisen darauf hin, dass der Vergleich <strong>irreführend</strong> ist. Der Kaliumgehalt des Körpers wird streng reguliert: Wer Kalium aufnimmt, scheidet entsprechend aus. Die Banane erhöht die Körperbelastung also nicht dauerhaft.</p>
<p>Als Größengefühl taugt der Vergleich trotzdem – und genau dafür wird er verwendet.</p>
<h4>Der praktische Nebeneffekt</h4>
<p>Es gibt dokumentierte Fälle, in denen Strahlungsdetektoren an Häfen und Grenzen bei <strong>Ladungen von Bananen oder Katzenstreu</strong> Alarm auslösten – beides kaliumreich. Moderne Detektoren sind so empfindlich, dass sie natürliche Radioaktivität in Lebensmitteln erkennen.</p>`,

story:`<p>Der Schulbuch-Klassiker: Sauerstoffreiches Blut sei rot, sauerstoffarmes blau – deshalb sehe man blaue Venen.</p>
<h4>Was stimmt</h4>
<p>Sauerstoffarmes Blut ist tatsächlich <strong>dunkler</strong> – ein tiefes Rotbraun statt hellem Kirschrot. Aber es ist nie blau. Bei einer Blutabnahme aus der Vene sieht man das direkt.</p>
<h4>Warum Venen blau aussehen</h4>
<p>Es liegt an der <strong>Haut</strong> und daran, wie Licht in Gewebe streut.</p>
<p>Rotes Licht dringt tiefer in die Haut ein und wird vom Blut absorbiert. Blaues Licht wird stärker <strong>gestreut</strong> und schon in oberen Hautschichten zurückgeworfen.</p>
<p>Über einer Vene wird also anteilig mehr blaues Licht zum Auge zurückgeworfen als rotes. Im Kontrast zur umgebenden Haut erscheint die Vene bläulich.</p>
<p>Dazu kommt ein Wahrnehmungseffekt: Farben werden immer relativ zur Umgebung beurteilt. Ein leicht grau-grünliches Gefäß in rosiger Haut wirkt kühler, als es ist.</p>
<h4>Wo Blut wirklich blau ist</h4>
<p>Bei einigen Tieren. <strong>Tintenfische, Kraken und Pfeilschwanzkrebse</strong> transportieren Sauerstoff nicht mit eisenhaltigem Hämoglobin, sondern mit kupferhaltigem <strong>Hämocyanin</strong>. Das ist tatsächlich blau.</p>
<p>Das Blut des Pfeilschwanzkrebses hat übrigens eine bemerkenswerte medizinische Bedeutung: Es reagiert extrem empfindlich auf bakterielle Verunreinigungen und wurde jahrzehntelang zur Sicherheitsprüfung von Impfstoffen und Medizinprodukten eingesetzt.</p>`,

teaser:'Die Stimme wird nicht höher. Das ist ein Missverständnis – und es lässt sich umkehren.',
story:`<p>Die verbreitete Erklärung lautet: Helium mache die Stimme höher. Physikalisch ist das nicht ganz richtig.</p>
<h4>Was tatsächlich passiert</h4>
<p>Die <strong>Grundfrequenz</strong> der Stimme entsteht in den Stimmlippen und hängt von deren Spannung und Masse ab. Helium ändert daran nichts – die Tonhöhe im eigentlichen Sinn bleibt gleich.</p>
<p>Was sich ändert, ist die <strong>Klangfarbe</strong>. Schall bewegt sich in Helium fast dreimal so schnell wie in Luft, weil Heliumatome viel leichter sind. Dadurch verschieben sich die <strong>Resonanzfrequenzen</strong> des Rachen- und Mundraums – die sogenannten Formanten – deutlich nach oben.</p>
<p>Formanten sind das, was einen Vokal zu einem „a“ oder „i“ macht und was eine Stimme wiedererkennbar macht. Wenn sie sich verschieben, klingt die Stimme quäkig und „klein“, obwohl der Grundton derselbe ist.</p>
<p>Ein guter Vergleich: Es ist, als hätte man denselben Ton auf einem anderen Instrument gespielt.</p>
<h4>Der Gegenversuch</h4>
<p>Mit <strong>Schwefelhexafluorid</strong> passiert das Gegenteil. Das Gas ist viel schwerer als Luft, Schall bewegt sich langsamer, die Formanten rutschen nach unten – die Stimme klingt tief und dröhnend.</p>
<h4>Der Warnhinweis</h4>
<p>Helium ist nicht giftig, aber es enthält keinen Sauerstoff. Wer mehrfach hintereinander tief einatmet, kann bewusstlos werden, ohne vorher Atemnot zu spüren – das Erstickungsgefühl entsteht durch CO₂-Anstieg, nicht durch Sauerstoffmangel. Direkt aus Druckflaschen zu atmen ist gefährlich.</p>`,

teaser:'Er sollte ein Zehnmillionstel der Strecke vom Nordpol zum Äquator sein. Die Messung war leicht falsch.',
story:`<p>Vor der Französischen Revolution war Frankreich ein Chaos aus Maßen. Schätzungen sprechen von <strong>hunderten regional unterschiedlichen Einheiten</strong> – oft konnten Grundbesitzer sie sogar selbst festlegen, was Betrug erleichterte.</p>
<h4>Die Idee</h4>
<p>Die neue Einheit sollte nicht von einem König abhängen, sondern von der <strong>Erde selbst</strong>: Ein Meter sollte der zehnmillionste Teil der Strecke vom Nordpol über Paris bis zum Äquator sein.</p>
<h4>Die Expedition</h4>
<p>Zwei Astronomen, <strong>Jean-Baptiste Delambre</strong> und <strong>Pierre Méchain</strong>, vermaßen ab 1792 sieben Jahre lang den Meridianbogen zwischen Dünkirchen und Barcelona – mitten in Revolutionswirren und Krieg. Sie wurden für Spione gehalten, verhaftet und aufgehalten.</p>
<p>Méchain entdeckte in seinen Daten eine Unstimmigkeit, die er nie auflösen konnte, und verschwieg sie. Er starb 1804 auf einer Nachmessung, offenbar zermürbt von dem Fehler.</p>
<h4>Das Ergebnis</h4>
<p>Der Meter fiel um etwa <strong>0,2 Millimeter zu kurz</strong> aus – unter anderem, weil die Abplattung der Erde nicht korrekt berücksichtigt wurde.</p>
<p>Statt zu korrigieren, behielt man die Länge bei und definierte sie neu: zunächst über einen Platin-Iridium-Stab in Sèvres, seit 1983 über die <strong>Lichtgeschwindigkeit</strong> – ein Meter ist die Strecke, die Licht in 1/299.792.458 Sekunde zurücklegt.</p>
<p>Deshalb ist die Lichtgeschwindigkeit heute keine Messgröße mehr, sondern per Definition festgelegt.</p>
<h4>Der Nachhall</h4>
<p>2019 wurde auch das Kilogramm umgestellt: Der letzte physische Prototyp wurde abgeschafft, weil er über Jahrzehnte messbar an Masse verlor. Seither hängt es an einer Naturkonstante.</p>`,

id:'zwiebel-weinen', t:'Warum Zwiebeln zum Weinen bringen', emoji:'🧅', cat:'science',
teaser:'Die Zwiebel verteidigt sich aktiv – mit einem chemischen Zweikomponentensystem.',
story:`<p>Eine ganze Zwiebel riecht kaum. Erst beim Schneiden passiert etwas – und das ist kein Zufall, sondern <strong>Verteidigung</strong>.</p>
<h4>Das Zweikomponentensystem</h4>
<p>Die Zwiebel lagert in getrennten Zellbereichen einerseits schwefelhaltige Aminosäurederivate, andererseits das Enzym <strong>Alliinase</strong>. Solange die Zellen intakt sind, passiert nichts.</p>
<p>Beim Schneiden platzen die Zellwände, beides trifft aufeinander, und über eine Reaktionskette entsteht <strong>syn-Propanthial-S-oxid</strong> – eine flüchtige Substanz, die aufsteigt.</p>
<p>An der Hornhaut des Auges reagiert sie mit Feuchtigkeit und bildet in kleinsten Mengen Schwefelsäure. Nervenenden melden Reizung, die Tränendrüsen spülen.</p>
<p>Das ist ein Abwehrsystem gegen Fressfeinde – und es funktioniert offenbar auch bei Menschen mit Küchenmesser.</p>
<h4>Was hilft (und was nicht)</h4>
<p><strong>Ein scharfes Messer:</strong> Es zerquetscht weniger Zellen, es wird weniger Enzym freigesetzt. Wirkt tatsächlich.</p>
<p><strong>Kälte:</strong> Eine gekühlte Zwiebel setzt weniger flüchtige Stoffe frei.</p>
<p><strong>Wasser:</strong> Unter fließendem Wasser oder in Wasser schneiden bindet einen Teil der Stoffe.</p>
<p><strong>Eine Schwimmbrille:</strong> Sieht albern aus, funktioniert perfekt.</p>
<p>Das Brot im Mund ist dagegen Folklore.</p>
<h4>Die tränenlose Zwiebel</h4>
<p>Es gibt sie wirklich. Japanische Forschende identifizierten das entscheidende Enzym, und daraus wurden durch klassische Züchtung Sorten entwickelt, die deutlich weniger Reizstoff bilden – vermarktet unter anderem als „Sunions“. Sie sind zudem milder im Geschmack, weil dieselben Schwefelverbindungen für die Schärfe sorgen.</p>`,

gold:'Zwiebeln bringen einen zum Weinen, weil beim Schneiden zwei getrennte Stoffe aufeinandertreffen – ein Abwehrsystem, das erst bei Verletzung auslöst.',

teaser:'Nicht wegen der Füße. Wegen der Physik von Spannungsdifferenzen.',
story:`<p>Strom „will“ nicht in den Vogel. Strom fließt dorthin, wo eine <strong>Spannungsdifferenz</strong> besteht – ein Unterschied im elektrischen Potenzial.</p>
<h4>Der entscheidende Punkt</h4>
<p>Ein Vogel, der mit beiden Füßen auf demselben Draht sitzt, berührt zwei Punkte, die <strong>fast dasselbe Potenzial</strong> haben. Der Abstand zwischen den Füßen beträgt wenige Zentimeter, und der Draht leitet sehr gut – die Spannungsdifferenz dazwischen ist winzig.</p>
<p>Dazu kommt: Selbst diese winzige Differenz würde einen Umweg durch den Vogel bedeuten, der einen viel höheren Widerstand hat als das Kupfer oder Aluminium daneben. Der Strom nimmt den bequemen Weg.</p>
<h4>Wann es tödlich wird</h4>
<p>Sobald der Vogel <strong>zwei unterschiedliche Potenziale</strong> gleichzeitig berührt: zwei verschiedene Leitungen, oder eine Leitung und einen geerdeten Mast.</p>
<p>Genau deshalb sind <strong>große Vögel</strong> gefährdet – Störche, Greifvögel, Eulen. Ihre Flügelspannweite reicht aus, um beim Landen oder Abflug zwei Leiter zu überbrücken. Stromschlag an Masten ist eine bedeutende Todesursache für Großvögel; in Deutschland gibt es deshalb gesetzliche Vorgaben zur Entschärfung gefährlicher Masten.</p>
<h4>Dieselbe Physik beim Menschen</h4>
<p>Deshalb arbeiten Techniker an Hochspannungsleitungen unter Spannung, indem sie sich per Hubschrauber oder Isolierstange auf <strong>dasselbe Potenzial</strong> bringen, bevor sie den Draht berühren. Sie tragen Anzüge aus leitfähigem Gewebe – einen faradayschen Käfig am Körper.</p>
<p>Das Prinzip ist dasselbe wie beim Auto im Gewitter: Nicht die Gummireifen schützen, sondern die leitfähige Karosserie, die den Strom außen herumführt.</p>`,
cool:'Es geht nie um „Strom berühren“, sondern immer um den Unterschied zwischen zwei Punkten – dieselbe Regel schützt Vögel und Hochspannungstechniker.',
gold:'Vögel überleben auf Stromleitungen, weil beide Füße dasselbe Potenzial berühren – gefährlich wird es erst, wenn sie zwei Leitungen gleichzeitig erreichen.',
perfect:'Small Talk / Spaziergang',

id:'mikrowelle', t:'Die Mikrowelle', emoji:'📡', cat:'erfindungen',

story:`<p><strong>Percy Spencer</strong> arbeitete bei Raytheon an <strong>Magnetrons</strong> – den Röhren, die für Radaranlagen Mikrowellen erzeugen. Radar war im Zweiten Weltkrieg kriegsentscheidende Technologie.</p>
<p>Spencer war Autodidakt: Als Waise aufgewachsen, ohne Schulabschluss über die Grundschule hinaus, brachte er sich Elektrotechnik selbst bei. Er hielt später rund 300 Patente.</p>
<h4>Der Moment</h4>
<p>1945 stand er nach eigener Schilderung nahe an einem laufenden Magnetron und bemerkte, dass ein <strong>Schokoriegel in seiner Tasche</strong> geschmolzen war. Ob es ein Erdnussriegel war, wird unterschiedlich erzählt.</p>
<p>Entscheidend war nicht der Zufall, sondern was er daraus machte: Er testete gezielt weiter. Als Nächstes legte er <strong>Maiskörner</strong> vor das Gerät – die erste absichtlich mit Mikrowellen hergestellte Portion Popcorn. Danach ein Ei, das explodierte.</p>
<h4>Das erste Gerät</h4>
<p>1947 kam der <strong>„Radarange“</strong> auf den Markt: rund 1,80 m hoch, über 300 Kilogramm, wassergekühlt, mehrere tausend Dollar teuer. Käufer waren Restaurants, Kantinen, Schiffe und Eisenbahnen.</p>
<p>Erst 1967 gab es ein bezahlbares Tischgerät für Haushalte.</p>
<h4>Wie es funktioniert</h4>
<p>Mikrowellen versetzen vor allem <strong>Wassermoleküle</strong> in Bewegung; die Reibung erzeugt Wärme. Deshalb wird das Essen heiß und der Teller nicht – und deshalb funktioniert die Mikrowelle bei sehr trockenen oder gefrorenen Stellen schlechter.</p>`,

story:`<p>1968 versuchte der Chemiker <strong>Spencer Silver</strong> bei 3M, einen besonders starken Klebstoff für die Luftfahrt zu entwickeln. Herausgekommen ist das Gegenteil: ein Klebstoff aus mikroskopisch kleinen Kügelchen, der <strong>schwach klebt, sich rückstandsfrei löst und wiederverwendbar bleibt</strong>.</p>
<p>Silver war überzeugt, dass das nützlich sein müsse – nur wusste er nicht wofür. Er hielt jahrelang firmeninterne Vorträge darüber und suchte nach einem Problem für seine Lösung. Er nannte es später selbst „eine Lösung ohne Problem“.</p>
<h4>Der Kirchenchor</h4>
<p>Sein Kollege <strong>Art Fry</strong> sang im Chor und markierte seine Gesangbuchseiten mit Papierschnipseln, die ständig herausfielen.</p>
<p>1974 fiel ihm Silvers Klebstoff wieder ein: ein Lesezeichen, das hält und sich rückstandsfrei ablösen lässt.</p>
<h4>Der schwierige Start</h4>
<p>Die interne Marktforschung war skeptisch, erste Testverkäufe liefen schlecht. Der Durchbruch kam 1977/78 mit einer ungewöhnlichen Aktion: In Boise, Idaho, verteilte 3M die Zettel <strong>massenhaft kostenlos</strong> an Büros. Man hatte erkannt, dass man das Produkt nicht erklären, sondern in die Hand geben muss.</p>
<p>Die Nachbestellrate lag bei über 90 %. 1980 kam der landesweite Verkauf.</p>
<h4>Und die Farbe?</h4>
<p>Kanariengelb war keine Designentscheidung. Das Labor nebenan hatte zufällig <strong>gelbes Papier</strong> übrig.</p>`,

teaser:'Ein Schweizer ging mit dem Hund spazieren – und fragte sich, warum die Kletten so gut halten.',
story:`<p>1941 kam der Schweizer Ingenieur <strong>George de Mestral</strong> von einem Jagdausflug in den Alpen zurück. Seine Hose und das Fell seines Hundes waren voller <strong>Kletten</strong> der Großen Klette.</p>
<p>Statt sie nur abzupfen, legte er eine unter das Mikroskop.</p>
<h4>Was er sah</h4>
<p>Die Kletten sind mit hunderten kleinen <strong>Häkchen</strong> besetzt, die sich in Schlaufen von Fell und Stoff verhaken. Ein mechanisches Prinzip: Haken und Schlaufe. Es hält fest, lässt sich aber lösen und wieder verbinden.</p>
<h4>Zehn Jahre Arbeit</h4>
<p>Die Umsetzung war ungleich schwerer als die Idee. Textilfachleute hielten ihn für einen Spinner. De Mestral experimentierte mit Baumwolle, die zu schnell verschliss, bis er bei <strong>Nylon</strong> landete – und einen Weg fand, die Schlaufen maschinell aufzuschneiden, sodass Haken entstehen.</p>
<p>1955 erhielt er das Patent. Der Name ist ein Kofferwort aus dem Französischen: <strong>VEL</strong>ours (Samt) und <strong>CRO</strong>chet (Haken) – <em>Velcro</em>. Im Deutschen setzte sich „Klettverschluss“ durch.</p>
<h4>Der Durchbruch</h4>
<p>Anfangs verkaufte es sich schlecht – es galt als billig aussehend. Populär wurde es durch die <strong>Raumfahrt</strong>: Die NASA nutzte es großflächig, um in der Schwerelosigkeit Gegenstände zu fixieren. Danach entdeckten es Skifahrer, Kinderschuhhersteller und Sportartikelfirmen.</p>
<p>De Mestrals Vorgehen gilt heute als Musterbeispiel für <strong>Bionik</strong> – Technik, die von der Natur abgeschaut ist.</p>`,

teaser:'Ein unordentliches Labor, ein Sommerurlaub – und danach passierte zwölf Jahre lang fast nichts.',
story:`<p>1928 fuhr <strong>Alexander Fleming</strong> in den Urlaub und ließ Bakterienkulturen auf seinem Labortisch stehen. Sein Arbeitsplatz galt als notorisch chaotisch.</p>
<p>Nach seiner Rückkehr fand er eine Platte, auf der sich ein <strong>Schimmelpilz</strong> angesiedelt hatte. Rings um den Pilz waren die Staphylokokken <strong>abgestorben</strong>.</p>
<p>Der Pilz war <em>Penicillium notatum</em>. Fleming nannte den Wirkstoff Penicillin, veröffentlichte 1929 – und die Fachwelt reagierte kaum.</p>
<h4>Warum es zwölf Jahre dauerte</h4>
<p>Fleming war Bakteriologe, kein Chemiker. Der Stoff ließ sich nur in winzigen Mengen gewinnen, war instabil und schwer zu reinigen. Er gab die Arbeit daran weitgehend auf.</p>
<p>Erst 1939 nahmen <strong>Howard Florey</strong> und <strong>Ernst Boris Chain</strong> in Oxford das Thema wieder auf und lösten die eigentlichen Probleme: Reinigung, Stabilisierung, Wirksamkeitsnachweis. 1941 wurde erstmals ein Patient behandelt – er besserte sich dramatisch, doch der Vorrat ging aus, und er starb.</p>
<h4>Die Melone</h4>
<p>Für die Massenproduktion brauchte man einen ertragreicheren Stamm. Man suchte weltweit. Fündig wurde man 1943 in Peoria, Illinois – auf einer <strong>schimmeligen Zuckermelone</strong> vom Markt. Dieser Stamm lieferte ein Vielfaches der bisherigen Ausbeute und wurde zur Grundlage der industriellen Produktion, die rechtzeitig zur Landung in der Normandie anlief.</p>
<p>1945 erhielten Fleming, Florey und Chain gemeinsam den Nobelpreis. Fleming warnte in seiner Nobelvorlesung bereits vor <strong>Resistenzen</strong> durch zu niedrige Dosierung – 80 Jahre bevor das Thema Schlagzeilen machte.</p>`,

teaser:'Ein gescheitertes Herzmedikament – und Testpersonen, die die Tabletten nicht zurückgeben wollten.',
story:`<p>Ende der 1980er entwickelte Pfizer in Sandwich, England, den Wirkstoff <strong>Sildenafil</strong>. Ziel war die Behandlung von <strong>Angina Pectoris</strong>: Der Stoff sollte Blutgefäße erweitern und das Herz entlasten.</p>
<h4>Die Studien</h4>
<p>Die Wirkung auf die Herzkranzgefäße war <strong>enttäuschend</strong> – deutlich schwächer als erhofft. Das Projekt stand vor dem Aus.</p>
<p>Bei der Auswertung fiel ein wiederkehrender Nebeneffekt auf, den männliche Teilnehmer berichteten: Erektionen. In der Rückschau erzählen Beteiligte, dass Probanden auffällig widerwillig waren, übrig gebliebene Tabletten zurückzugeben.</p>
<h4>Die Neuausrichtung</h4>
<p>Statt das Projekt zu beenden, änderte Pfizer die Indikation. Die Wirkung ergibt biochemisch Sinn: Sildenafil hemmt ein Enzym (PDE-5), das für den Abbau eines gefäßerweiternden Botenstoffs zuständig ist. Im Schwellkörper ist dieses Enzym besonders stark vertreten.</p>
<p>1998 wurde Viagra in den USA zugelassen. Es war eines der am schnellsten anlaufenden Medikamente der Geschichte.</p>
<h4>Der Nachklapp</h4>
<p>Der Wirkstoff ist unter dem Namen Revatio bis heute auch für seinen ursprünglichen Zweckbereich zugelassen – zur Behandlung von <strong>pulmonaler arterieller Hypertonie</strong>, einem lebensbedrohlichen Lungenhochdruck. Dort hilft er tatsächlich Herz und Kreislauf.</p>
<p>Und die blaue Rautenform? Reine Designentscheidung – gewählt, weil sie unverwechselbar ist. Sie wurde als Marke geschützt.</p>
<p>Der Fall gilt als Lehrbuchbeispiel für <em>Drug Repurposing</em>: Ein Medikament findet erst im zweiten Anlauf seinen Zweck.</p>`,

id:'luftpolsterfolie', t:'Luftpolsterfolie', emoji:'🫧', cat:'erfindungen',
teaser:'Sie war als Tapete gedacht. Dann als Gewächshausdämmung. Erst der dritte Versuch klappte.',
story:`<p>1957 verschweißten die Ingenieure <strong>Alfred Fielding</strong> und <strong>Marc Chavannes</strong> in New Jersey zwei Duschvorhänge miteinander. Es entstand eine Folie mit eingeschlossenen Luftblasen.</p>
<h4>Idee 1: Tapete</h4>
<p>Die Vorstellung: eine strukturierte, dreidimensionale Wandverkleidung für moderne Wohnungen. Der Markt reagierte nicht. Niemand wollte Blasen an der Wand.</p>
<h4>Idee 2: Gewächshausdämmung</h4>
<p>Die eingeschlossene Luft isoliert tatsächlich gut. Auch das verkaufte sich nur mäßig. (Als Fensterisolierung im Winter funktioniert Luftpolsterfolie übrigens bis heute erstaunlich gut.)</p>
<h4>Idee 3</h4>
<p>1959 kam der Durchbruch. <strong>IBM</strong> brachte den Computer 1401 auf den Markt – ein empfindliches, teures Gerät, das quer durch die USA transportiert werden musste. Bis dahin verpackte man mit Zeitungspapier, Holzwolle und Sägespänen.</p>
<p>Ein Verkäufer der Firma – inzwischen <strong>Sealed Air</strong> – erkannte die Chance und überzeugte IBM. Von da an lief das Geschäft.</p>
<h4>Das Rätsel</h4>
<p>Warum das Zerdrücken der Blasen so befriedigend ist, ist nicht abschließend erforscht. Diskutiert werden repetitive Handbewegungen, unmittelbares taktiles und akustisches Feedback und ein Spannungsabbau ähnlich wie bei Knetobjekten.</p>
<p>Sealed Air brachte 2015 eine Variante auf den Markt, deren Blasen miteinander verbunden sind und deshalb <strong>nicht mehr knallen</strong>. Sie ist platzsparender im Transport – und wurde von vielen Menschen ausgesprochen schlecht aufgenommen.</p>`,
cool:'Dasselbe Produkt scheiterte zweimal und wurde beim dritten Anlauf zum Weltstandard – ohne dass sich das Produkt selbst geändert hätte.',

id:'play-doh', t:'Play-Doh', emoji:'🎨', cat:'erfindungen',
teaser:'Es war ein Reinigungsmittel für Tapeten – und wurde gerettet, weil Wohnungen die Heizung wechselten.',
story:`<p>Die Firma Kutol in Cincinnati stellte eine weiche, knetbare Masse her, mit der man <strong>Tapeten reinigte</strong>. In der ersten Hälfte des 20. Jahrhunderts wurden viele Wohnungen mit <strong>Kohle</strong> geheizt, und Ruß setzte sich auf Tapeten ab, die man nicht abwaschen konnte. Man rollte die Knete über die Wand, der Ruß blieb daran haften.</p>
<h4>Das Geschäft brach weg</h4>
<p>Nach dem Zweiten Weltkrieg stellten Haushalte auf Öl und Gas um. Gleichzeitig kamen abwaschbare Vinyltapeten auf. Der Bedarf verschwand innerhalb weniger Jahre, und die Firma stand vor dem Aus.</p>
<h4>Die Rettung</h4>
<p><strong>Kay Zufall</strong> – eine Kindergärtnerin, deren Schwager im Unternehmen arbeitete – las einen Artikel über Bastelideen mit Tapetenreiniger. Sie probierte es mit ihren Kindern aus: Die Masse ließ sich hervorragend formen, war ungiftig und trocknete nicht sofort aus.</p>
<p>Sie schlug vor, das Produkt als Spielzeug zu vermarkten – und lieferte auch den Namen <strong>Play-Doh</strong>. Man entfernte das Reinigungsmittel aus der Rezeptur und fügte Farbe und Duft hinzu.</p>
<p>1956 kam es auf den Markt, zunächst nur in Off-White, dann in Rot, Gelb und Blau. Der Durchbruch kam über Auftritte in amerikanischen Kindersendungen.</p>
<h4>Der Geruch</h4>

/* ---------- Helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1900);
}
function hashStr(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); }
function todayKey(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dailyStory(){ return STORIES[ hashStr(todayKey()) % STORIES.length ]; }

function filtered(){
  const q = query.trim().toLowerCase();
  return STORIES.filter(s=>{
    if(filterCat!=='all' && s.cat!==filterCat) return false;
    if(!q) return true;
    return (s.t+' '+s.teaser+' '+s.gold+' '+s.cool+' '+s.story+' '+CATS[s.cat].n).toLowerCase().includes(q);

let currentStory = null, currentList = [];
function openStory(id, fromList){

  if(!currentList.includes(id)) currentList = STORIES.map(x=>x.id);

  recent = [id, ...recent.filter(x=>x!==id)].slice(0,12); LS.set('recent', recent);
  if(!seen.includes(id)){ seen.push(id); LS.set('seen', seen); }

  renderStory(false);

}

function step(dir){

function randomStory(){

  if(currentView==='favs') renderFavs();

function share(){

  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast('In die Zwischenablage kopiert')).catch(()=>toast('Kopieren nicht möglich')); }
  else toast('Teilen wird hier nicht unterstützt');

  const pool = STORIES.filter(s=>cardCat==='all' || s.cat===cardCat);
  cardDeck = pool.map(s=>s.id);
  for(let i=cardDeck.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [cardDeck[i],cardDeck[j]] = [cardDeck[j],cardDeck[i]]; }
  cardIdx = 0; cardRevealed = false;
  renderCards();
}
function setCardCat(k){ cardCat = k; newDeck(); }
function renderCards(){
  document.getElementById('cardChips').innerHTML =
    `<button class="chip ${cardCat==='all'?'on':''}" onclick="setCardCat('all')">Alle</button>` +
    Object.entries(CATS).map(([k,c])=>
      `<button class="chip ${cardCat===k?'on':''}" onclick="setCardCat('${k}')">${c.i} ${esc(c.n)}</button>`).join('');

  if(!cardDeck.length){ document.getElementById('cardArea').innerHTML = `<div class="empty"><span class="em">🃏</span><p>Keine Karten in dieser Kategorie.</p></div>`; return; }

  const s = byId[cardDeck[cardIdx]];
  const c = CATS[s.cat];
  const answer = `
    <div class="flash-answer">
      <div class="body-text">${s.story}</div>
      <div class="box box-gold">
        <div class="lbl">🗣️ Conversation Gold</div>
        <blockquote>„${esc(s.gold)}“</blockquote>
        <div class="perfect">Perfekt für: ${esc(s.perfect)}</div>
      </div>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn btn-ghost" style="flex:1" onclick="openStory('${s.id}')">Ganze Story ansehen</button>
        <button class="btn ${favs.includes(s.id)?'btn-accent':'btn-ghost'}" onclick="toggleFav('${s.id}');renderCards()">${favs.includes(s.id)?'★':'☆'}</button>
      </div>
    </div>`;

  document.getElementById('cardArea').innerHTML = `
    <div class="card flash" id="flashCard">
      <div class="cat-lbl">${c.i} ${esc(c.n)}</div>
      <span class="em">${s.emoji}</span>
      <h3>${esc(s.t)}</h3>
      <p class="teaser">${esc(s.teaser)}</p>
      ${cardRevealed ? answer : `<div><button class="btn btn-primary" onclick="cardRevealed=true;renderCards()">Antwort anzeigen</button></div>`}
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-ghost" style="flex:1" onclick="nextCard()">Nächste Karte →</button>
      <button class="btn btn-ghost" onclick="newDeck()">🔀</button>
    </div>
    <p class="flash-progress">Karte ${cardIdx+1} von ${cardDeck.length}</p>`;
}
function nextCard(){
  cardIdx = (cardIdx+1) % cardDeck.length;
  cardRevealed = false; renderCards();
  document.getElementById('view-cards').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------- Search input ---------- */
document.getElementById('q').addEventListener('input', e=>{ query = e.target.value; renderBrowse(); });

/* ---------- Swipe on story ---------- */
(function(){
  let x0=null, y0=null;
  const el = document.getElementById('view-story');
  el.addEventListener('touchstart', e=>{ x0 = e.changedTouches[0].clientX; y0 = e.changedTouches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*2) step(dx < 0 ? 1 : -1);
    x0 = null;
  }, {passive:true});
})();

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e=>{
  if(document.activeElement && document.activeElement.tagName==='INPUT') return;
  if(currentView==='story'){
    if(e.key==='ArrowRight') step(1);
    if(e.key==='ArrowLeft')  step(-1);
  }
  if(e.key==='r' || e.key==='R') randomStory();
});

/* ---------- Header shadow ---------- */
addEventListener('scroll', ()=>document.querySelector('header.top').classList.toggle('scrolled', scrollY > 4), {passive:true});

/* ---------- Boot ---------- */
renderHome();
renderBrowse();
renderFavs();

</script>
</body>
</html>
