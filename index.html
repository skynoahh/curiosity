<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF9F5">
<title>Curiosity Cards — Wissen, das man erzählen will</title>
<style>
:root{
  --bg:#FBF9F5; --bg2:#F3EFE7; --surface:#FFFFFF; --surface2:#FAF7F1;
  --text:#17140F; --muted:#6C645A; --faint:#9A9188;
  --line:#E7E0D4; --line2:#D8CFC0;
  --accent:#B8492A; --accent-soft:#F6E6DF;
  --shadow:0 1px 2px rgba(23,20,15,.05), 0 8px 24px -12px rgba(23,20,15,.16);
  --shadow-lg:0 2px 6px rgba(23,20,15,.06), 0 24px 48px -20px rgba(23,20,15,.28);
  --radius:20px;
  --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --max:700px;
}
html[data-theme="dark"]{
  --bg:#121110; --bg2:#191716; --surface:#1D1B19; --surface2:#232120;
  --text:#F2EDE5; --muted:#A79E93; --faint:#7E766C;
  --line:#2E2B27; --line2:#3B3733;
  --accent:#E8845F; --accent-soft:#33221C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 24px 48px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  transition:background .35s ease, color .35s ease;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
a{color:inherit}
::selection{background:var(--accent-soft);color:var(--text)}

/* ---------- Header ---------- */
header.top{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent;
  transition:border-color .2s;
  padding-top:env(safe-area-inset-top);
}
header.top.scrolled{border-bottom-color:var(--line)}
.top-inner{max-width:var(--max);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em;cursor:pointer}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-bottom:2px}
.top-actions{margin-left:auto;display:flex;gap:4px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-size:17px;color:var(--muted);transition:background .18s,color .18s,transform .12s;
}
.icon-btn:hover{background:var(--bg2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout ---------- */
main{max-width:var(--max);margin:0 auto;padding:0 20px}
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{
  font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 10px
}
.eyebrow.grey{color:var(--faint)}
h1.display{font-family:var(--serif);font-size:34px;line-height:1.15;letter-spacing:-.02em;font-weight:600;margin:0 0 10px}
h2.sec{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em;margin:38px 0 14px;display:flex;align-items:baseline;gap:10px}
h2.sec .count{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.04em}
.lede{color:var(--muted);font-size:16px;margin:0}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s, border-color .22s;
}
.card.tappable:active{transform:scale(.985)}

/* Hero / Daily */
.hero{padding:26px 24px 24px;position:relative;background:var(--surface);}
.hero:before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 100% 0%, var(--accent-soft) 0%, transparent 55%);
  opacity:.85;
}
.hero > *{position:relative}
.hero .emoji{font-size:38px;line-height:1;display:block;margin-bottom:14px}
.hero h3{font-family:var(--serif);font-size:27px;line-height:1.2;letter-spacing:-.02em;font-weight:600;margin:0 0 12px}
.hero p{color:var(--muted);margin:0 0 20px;font-size:16px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:14px;font-size:15.5px;font-weight:600;letter-spacing:-.01em;
  transition:transform .12s, opacity .18s, background .18s, border-color .18s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--text);color:var(--bg)}
html[data-theme="dark"] .btn-primary{background:var(--text);color:#121110}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{border:1px solid var(--line2);color:var(--text);background:var(--surface)}
.btn-ghost:hover{background:var(--bg2)}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* Story list item */
.list{display:flex;flex-direction:column;gap:10px}
.item{
  display:flex;gap:14px;align-items:flex-start;padding:16px 17px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  text-align:left;width:100%;transition:transform .16s, border-color .18s, background .18s;
}
.item:hover{border-color:var(--line2)}
.item:active{transform:scale(.99)}
.item .em{font-size:23px;line-height:1.2;flex-shrink:0;margin-top:1px}
.item .body{min-width:0;flex:1}
.item .t{font-family:var(--serif);font-size:17.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-bottom:3px}
.item .s{font-size:13.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .star{color:var(--accent);font-size:13px;flex-shrink:0}

/* Category grid */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{
  display:flex;flex-direction:column;gap:4px;padding:15px 15px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);text-align:left;
  transition:transform .16s, border-color .18s;
}
.cat:active{transform:scale(.97)}
.cat .ci{font-size:21px}
.cat .cn{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.cat .cc{font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.03em}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 14px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:background .18s,color .18s,border-color .18s,transform .12s;white-space:nowrap
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
html[data-theme="dark"] .chip.on{color:#121110}

/* Search */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:4px 0 16px}
.searchbar input{flex:1;border:none;outline:none;background:none;font:inherit;font-size:16px;color:var(--text);min-width:0}
.searchbar input::placeholder{color:var(--faint)}
.searchbar svg{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:1.9;stroke-linecap:round}

/* ---------- Story view ---------- */
.story-wrap{padding:8px 0 40px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);padding:10px 0;margin-bottom:2px}
.story-head .em{font-size:44px;line-height:1;display:block;margin-bottom:14px}
.story-head h1{font-family:var(--serif);font-size:33px;line-height:1.14;letter-spacing:-.025em;font-weight:600;margin:0 0 14px}
.q{
  font-family:var(--serif);font-size:19.5px;line-height:1.45;color:var(--text);
  border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:0 0 24px;font-style:italic
}
.meta-row{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 24px}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:8px;background:var(--bg2);color:var(--muted);border:1px solid var(--line)}
.tag.cert-belegt{color:#2E7D5B;background:color-mix(in srgb,#2E7D5B 10%,transparent);border-color:color-mix(in srgb,#2E7D5B 22%,transparent)}
.tag.cert-wahrscheinlich{color:#B07908;background:color-mix(in srgb,#B07908 10%,transparent);border-color:color-mix(in srgb,#B07908 22%,transparent)}
.tag.cert-legende{color:#9B5DE0;background:color-mix(in srgb,#9B5DE0 10%,transparent);border-color:color-mix(in srgb,#9B5DE0 24%,transparent)}
html[data-theme="dark"] .tag.cert-belegt{color:#6FD3A3}
html[data-theme="dark"] .tag.cert-wahrscheinlich{color:#EBC46A}
html[data-theme="dark"] .tag.cert-legende{color:#C9A0F5}

.reveal-box{text-align:center;padding:6px 0 10px}
.body-text{font-size:17.5px;line-height:1.72;animation:fade .4s ease}
.body-text p{margin:0 0 17px}
.body-text h4{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em;margin:28px 0 10px}
.body-text strong{font-weight:650}
.body-text em{font-style:italic}

.box{border-radius:16px;padding:18px 19px;margin:26px 0}
.box .lbl{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.box-cool{background:var(--bg2);border:1px solid var(--line)}
.box-cool .lbl{color:var(--faint)}
.box-cool p{margin:0;font-size:16px;line-height:1.6}
.box-gold{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.box-gold .lbl{color:var(--accent)}
.box-gold blockquote{margin:0;font-family:var(--serif);font-size:19px;line-height:1.5;letter-spacing:-.01em}
.box-gold .perfect{margin-top:12px;font-size:12.5px;color:var(--muted);font-weight:600}

.src{font-size:12.5px;color:var(--faint);line-height:1.55;border-top:1px solid var(--line);padding-top:14px;margin-top:26px}
.stars{letter-spacing:2px;color:var(--accent);font-size:13px}

.rabbit{margin-top:28px}
.rabbit .lbl{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:11px}
.rabbit-list{display:flex;flex-direction:column;gap:8px}
.rh{display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;text-align:left;transition:transform .14s,border-color .18s}
.rh:active{transform:scale(.98)}
.rh.dead{color:var(--faint);font-weight:500;background:transparent;border-style:dashed;cursor:default}
.rh .arrow{color:var(--accent);flex-shrink:0}

.story-nav{display:flex;gap:10px;margin-top:34px}
.story-nav .btn{flex:1}

.actions{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:center;margin-top:30px;pointer-events:none}
.actions-inner{
  display:flex;gap:2px;padding:5px;border-radius:16px;pointer-events:auto;
  background:var(--surface);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--line);box-shadow:var(--shadow-lg)
}
.act{padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--muted);transition:background .18s,color .18s,transform .12s}
.act:active{transform:scale(.94)}
.act.on{color:var(--accent)}
.act:hover{background:var(--bg2)}

/* ---------- Flashcards ---------- */
.flash{
  min-height:340px;display:flex;flex-direction:column;justify-content:center;
  padding:34px 26px;text-align:center;position:relative;overflow:hidden
}
.flash:before{content:'';position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 0%,var(--accent-soft),transparent 60%);opacity:.7}
.flash > *{position:relative}
.flash .em{font-size:46px;margin-bottom:18px}
.flash .cat-lbl{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.flash h3{font-family:var(--serif);font-size:27px;line-height:1.25;letter-spacing:-.02em;font-weight:600;margin:0 0 14px}
.flash .teaser{color:var(--muted);font-size:16px;margin:0 0 26px}
.flash-answer{text-align:left;animation:fade .4s ease}
.flash-progress{font-size:12.5px;color:var(--faint);font-weight:600;text-align:center;margin:16px 0 0;letter-spacing:.03em}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:52px 20px;color:var(--faint)}
.empty .em{font-size:34px;display:block;margin-bottom:12px;opacity:.65}
.empty p{margin:0 0 6px;font-size:15px}

/* ---------- Stats strip ---------- */
.stats{display:flex;gap:10px;margin:18px 0 0}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stat .n{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1;letter-spacing:-.02em}
.stat .l{font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.03em;margin-top:5px}

/* ---------- Tabbar ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
.tabs-inner{max-width:var(--max);margin:0 auto;display:flex}
.tab{flex:1;padding:9px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);transition:color .18s}
.tab.on{color:var(--accent)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.01em}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(94px + env(safe-area-inset-bottom));
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center
}
html[data-theme="dark"] #toast{color:#121110}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:640px){
  h1.display{font-size:40px}
  .story-head h1{font-size:40px}
  .hero h3{font-size:31px}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand" onclick="go('home')"><span class="dot"></span>Curiosity Cards</div>
    <div class="top-actions">
      <button class="icon-btn" onclick="go('browse');setTimeout(()=>document.getElementById('q').focus(),120)" aria-label="Suchen">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Farbmodus" id="themeBtn">
        <svg viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main>

  <!-- ============ HOME ============ -->
  <section class="view active" id="view-home">
    <div style="padding:22px 0 4px">
      <p class="eyebrow">Deine tägliche Neugier</p>
      <div class="card hero tappable" id="dailyCard"></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-ghost" style="flex:1" onclick="randomStory()">🔄 Zufällige Story</button>
        <button class="btn btn-ghost" style="flex:1" onclick="go('cards')">🃏 Karteikarten</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <h2 class="sec">Kategorien</h2>
    <div class="cats" id="catGrid"></div>

    <div id="recentBlock"></div>
    <div id="favBlockHome"></div>

    <div style="height:20px"></div>
  </section>

  <!-- ============ BROWSE ============ -->
  <section class="view" id="view-browse">
    <div style="padding:18px 0 0">
      <h1 class="display">Stöbern</h1>
      <div class="searchbar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Suche nach Thema, Wort, Geschichte…" autocomplete="off">
      </div>
    </div>
    <div class="chips" id="filterChips"></div>
    <p class="eyebrow grey" id="resultCount"></p>
    <div class="list" id="results"></div>
    <div style="height:24px"></div>
  </section>

  <!-- ============ STORY ============ -->
  <section class="view" id="view-story">
    <div class="story-wrap" id="storyWrap"></div>
  </section>

  <!-- ============ CARDS ============ -->
  <section class="view" id="view-cards">
    <div style="padding:18px 0 0">
      <h1 class="display">Karteikarten</h1>
      <p class="lede">Erst die Frage. Dann die Geschichte. Ohne Punkte, ohne Test.</p>
    </div>
    <div class="chips" style="margin-top:18px" id="cardChips"></div>
    <div id="cardArea"></div>
    <div style="height:24px"></div>
  </section>

  <!-- ============ FAVS ============ -->
  <section class="view" id="view-favs">
    <div style="padding:18px 0 0">
      <h1 class="display">Merkliste</h1>
      <p class="lede">Deine gespeicherten Stories – bleiben auch nach dem Schließen erhalten.</p>
    </div>
    <div id="favList" style="margin-top:22px"></div>
    <div style="height:24px"></div>
  </section>

</main>

<nav class="tabs">
  <div class="tabs-inner">
    <button class="tab on" data-tab="home" onclick="go('home')">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg><span>Entdecken</span>
    </button>
    <button class="tab" data-tab="browse" onclick="go('browse')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Stöbern</span>
    </button>
    <button class="tab" data-tab="cards" onclick="go('cards')">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="15" rx="2.5"/><path d="M8 3h10a2.5 2.5 0 0 1 2.5 2.5V17"/></svg><span>Karten</span>
    </button>
    <button class="tab" data-tab="favs" onclick="go('favs')">
      <svg viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg><span>Merkliste</span>
    </button>
  </div>
</nav>

<div id="toast"></div>

<script>
// ==== TEIL 1: Food & Drinks, Fashion & Style ====
const STORIES_1 = [
{
id:'negroni', t:'Negroni', emoji:'🍸', cat:'food',
teaser:'Wie aus einer einzigen ungeduldigen Bar-Bestellung einer der berühmtesten Cocktails der Welt wurde.',
story:`<p>Florenz, angeblich 1919. Im <strong>Caffè Casoni</strong> sitzt Graf Camillo Negroni – ein Mann, dem man nachsagt, er habe eine Zeit lang als Rodeo-Reiter in Amerika gearbeitet. Er bestellt seinen üblichen <em>Americano</em>: Campari, roter Wermut, Soda.</p>
<h4>Die eine kleine Änderung</h4>
<p>An diesem Tag will er ihn stärker. Der Barmann Fosco Scarselli ersetzt das Soda durch <strong>Gin</strong> – und wechselt die Zitronenzeste gegen eine Orangenscheibe, damit klar ist, dass das nicht der normale Drink ist.</p>
<p>Andere Gäste sehen das und bestellen bald „den Negroni“. Aus einer Sonderbestellung wird eine Bestellung. Aus einer Bestellung ein Rezept.</p>
<h4>Warum das nicht ganz sicher ist</h4>
<p>Die Geschichte stammt vor allem aus Familienerzählungen der Negronis und wurde erst Jahrzehnte später aufgeschrieben. Es gibt konkurrierende Versionen mit einem anderen Grafen Negroni aus Korsika. Sicher belegt ist: Der Drink ist eine direkte Ableitung des Americano – und der Name taucht in den 1920ern in Florenz auf.</p>`,

id:'coca-cola', t:'Coca-Cola', emoji:'🥤', cat:'food',
teaser:'Der Name ist eigentlich eine Zutatenliste – und die Erfindung war ein Nebenprodukt eines Alkoholverbots.',
story:`<p><strong>John Pemberton</strong> war Apotheker in Atlanta und verkaufte ab 1885 ein Tonikum namens <em>Pemberton's French Wine Coca</em>: Wein, Cocablatt-Extrakt, Kolanuss. Angepriesen gegen Kopfschmerzen, Erschöpfung und „Nervenleiden“.</p>
<h4>Dann kam die Prohibition – regional</h4>
<p>1886 führte Atlanta ein lokales Alkoholverbot ein. Pemberton musste den Wein rauswerfen und ersetzte ihn durch gesüßten Sirup, den man mit Sodawasser mischte. Der Rest der Formel blieb.</p>
<h4>Und der Name?</h4>
<p>Den erfand sein Buchhalter <strong>Frank Robinson</strong> – schlicht aus den beiden Hauptzutaten: <em>Coca</em> (Cocablatt) und <em>Kola</em> (Kolanuss). Er schrieb ihn mit C statt K, weil zwei C nebeneinander in der Werbung besser aussahen, und zeichnete den Schriftzug in <strong>Spencerian Script</strong>, der damaligen amerikanischen Schreibschrift für Geschäftsbriefe. Dieser Schriftzug ist bis heute im Wesentlichen derselbe.</p>
<p>Kokain-Spuren wurden Anfang des 20. Jahrhunderts entfernt; Cocablatt-Extrakt ohne Wirkstoff wird bis heute verwendet.</p>`,

id:'red-bull', t:'Red Bull', emoji:'🐂', cat:'food',
teaser:'Ein Österreicher hatte Jetlag in Bangkok – und trank aus Versehen die Zukunft.',
story:`<p>1982 landet <strong>Dietrich Mateschitz</strong>, damals Marketingmann für Zahnpasta, mit üblem Jetlag in Bangkok. Jemand empfiehlt ihm ein lokales Getränk: <em>Krating Daeng</em>, „roter Gaur“ (eine Wildrindart). Es half.</p>
<h4>Das Getränk war nicht für Sportler gedacht</h4>
<p>Krating Daeng war ein billiges, süßes Tonikum für <strong>Lkw-Fahrer, Bauarbeiter und Fabrikarbeiter</strong> – Leute, die Schichten durchhalten mussten. Getrunken wurde es warm, aus kleinen Glasflaschen, ohne Kohlensäure.</p>
<h4>Der Deal</h4>
<p>Mateschitz tat sich mit dem Erfinder <strong>Chaleo Yoovidhya</strong> zusammen: beide je 49 %, dessen Sohn 2 %. Für den westlichen Markt wurde das Getränk kohlensäurehaltig, weniger süß gemacht und – entscheidend – nicht als Arbeitertonikum, sondern als Lifestyle-Produkt positioniert. Start in Österreich: 1987. Deutschland: erst 1994.</p>
<p>Aus zwei Männern, die ein thailändisches Fahrerschicht-Getränk lizenzierten, wurden Milliardäre.</p>`,

id:'croissant', t:'Croissant', emoji:'🥐', cat:'food',
teaser:'Die berühmteste Erklärung ist vermutlich falsch – die echte ist trotzdem gut.',
story:`<p>Die Legende kennt jeder: Bei der <strong>Belagerung Wiens 1683</strong> hätten Bäcker nachts das Graben der Osmanen gehört, Alarm geschlagen und zur Feier ein Gebäck in Form des osmanischen Halbmonds gebacken.</p>
<h4>Das Problem</h4>
<p>Für diese Geschichte gibt es <strong>keinen zeitgenössischen Beleg</strong>. Sie taucht erst im 19. Jahrhundert in Kochbüchern auf – also rund 200 Jahre später.</p>
<h4>Was sich belegen lässt</h4>
<p>Das Wiener <em>Kipferl</em> gibt es tatsächlich lange, es war aber ein dichtes Hefegebäck, kein Blätterteig. 1839 eröffnete der Wiener Offizier <strong>August Zang</strong> in Paris die „Boulangerie Viennoise“ und machte Wiener Gebäck dort zum Trend – daher heißen Croissants in Frankreich bis heute <em>viennoiserie</em>, „Wiener Ware“.</p>
<p>Das Croissant, wie wir es kennen – aus tourniertem, gefaltetem Butterteig – ist eine <strong>französische Erfindung des frühen 20. Jahrhunderts</strong>. Das erste Rezept dafür ist um 1905/1906 dokumentiert.</p>`,

perfect:'Dinner / Small Talk',

id:'worcestershire', t:'Worcestershire Sauce', emoji:'🧴', cat:'food',
teaser:'Das Beste an dieser Sauce passierte, während alle sie vergessen hatten.',
story:`<p>Zwei Apotheker in Worcester, <strong>John Lea</strong> und <strong>William Perrins</strong>, mischten in den 1830ern eine Sauce nach einer Rezeptvorlage an. Das Ergebnis war – so die Firmenüberlieferung – ungenießbar scharf und wurde in einem Fass im Keller abgestellt und vergessen.</p>
<h4>Jahre später</h4>
<p>Beim Aufräumen probierten sie erneut. Die Sauce hatte fermentiert und war <strong>komplett anders</strong>: tief, salzig, umami. 1837 kam sie in den Verkauf.</p>
<h4>Der eigentliche Clou</h4>
<p>Was damals ein Zufall war, ist heute Verfahren: Original Lea &amp; Perrins <strong>reift bis zu 18 Monate</strong>, bevor sie abgefüllt wird. Und in der Zutatenliste stehen bis heute <strong>Sardellen</strong> – weshalb die Sauce für Vegetarier ein klassischer Stolperstein ist.</p>
<p>Ihre Urahnin ist übrigens das römische <em>Garum</em>, eine fermentierte Fischsauce, die im Mittelmeerraum jahrhundertelang das war, was heute Ketchup ist.</p>`,

teaser:'Der Mönch, der angeblich die Bläschen erfand, hat sein Leben damit verbracht, sie zu bekämpfen.',
story:`<p>„Komm schnell, ich trinke Sterne!“ – dieser Satz von <strong>Dom Pérignon</strong> ist eine Werbeerfindung des späten 19. Jahrhunderts. Es gibt ihn in keiner zeitgenössischen Quelle.</p>
<h4>Bläschen waren ein Defekt</h4>
<p>In der Champagne unterbrach die Kälte im Winter die Gärung; im Frühjahr sprang sie wieder an – in der bereits verschlossenen Flasche. Das Ergebnis: Druck. Flaschen platzten reihenweise, Kellermeister trugen Schutzmasken. Man nannte es <em>le vin du diable</em>, den Teufelswein.</p>
<p>Dom Pérignon war ab 1668 Kellermeister in Hautvillers – und seine dokumentierte Aufgabe war, den Wein <strong>ruhig</strong> zu bekommen. Seine echten Verdienste liegen bei Verschnitt und Weißkeltern roter Trauben.</p>
<h4>Wer war es dann?</h4>
<p>Der Engländer <strong>Christopher Merret</strong> beschrieb bereits <strong>1662</strong> – sechs Jahre bevor Pérignon anfing – vor der Royal Society, wie man Wein absichtlich Zucker zusetzt, um ihn perlend zu machen. Möglich war das in England auch deshalb, weil dort mit Kohle befeuerte Öfen deutlich <strong>stabileres Glas</strong> produzierten.</p>`,

id:'ketchup', t:'Ketchup', emoji:'🍅', cat:'food',
teaser:'Ursprünglich war weder Tomate noch Süße drin – dafür Fisch. Und eine Zeit lang war es Medizin.',
story:`<p>Das Wort stammt vermutlich aus dem südchinesischen Raum: <em>kê-tsiap</em> bezeichnete eine <strong>fermentierte Fischsauce</strong>. Britische Händler brachten das Konzept im 17./18. Jahrhundert nach Europa – und „Ketchup“ wurde dort zur Sammelbezeichnung für dunkle, würzige Würzsaucen.</p>
<p>Es gab <strong>Walnuss-Ketchup</strong>, <strong>Pilz-Ketchup</strong>, <strong>Austern-Ketchup</strong>. Jane Austens Familie hatte Rezepte dafür. Die Tomate kam erst später dazu.</p>
<h4>Die Medizin-Phase</h4>
<p>Um 1834 behauptete der Arzt <strong>John Cook Bennett</strong>, Tomaten könnten Durchfall und Verdauungsbeschwerden heilen, und ließ Tomatenkonzentrat zu <strong>Pillen</strong> pressen. Es folgten Konkurrenzprodukte, dreiste Werbeversprechen und ein regelrechter Patentmedizin-Krieg – bis der Schwindel aufflog.</p>
<h4>Warum Heinz gewann</h4>
<p>Ketchup verdarb leicht. Henry J. Heinz setzte ab 1876 auf mehr <strong>Essig, Zucker und reife Tomaten</strong> – nicht wegen des Geschmacks, sondern weil das Produkt dadurch ohne die damals üblichen konservierenden Zusätze haltbar war. Der Geschmack, den heute die halbe Welt kennt, ist also ein Nebeneffekt eines Haltbarkeitsproblems.</p>`,
cool:'Der süß-saure Geschmack von Ketchup ist kein Rezept, sondern eine Konservierungsmethode, die sich weltweit durchgesetzt hat.',

id:'parmesan', t:'Parmesan', emoji:'🧀', cat:'food',
teaser:'Es gibt eine italienische Bank, deren Tresor voller Käse ist. Kein Witz.',
story:`<p>Parmigiano Reggiano reift <strong>mindestens 12, oft 24 bis 36 Monate</strong>. Für einen Käser heißt das: Er hat riesige Mengen Kapital in Form von Laiben im Lager liegen, aber jahrelang kein Geld.</p>
<h4>Die Lösung ist eine Bank</h4>
<p>Die Bank <strong>Credito Emiliano</strong> („Credem“) betreibt in der Emilia-Romagna klimatisierte Lagerhäuser, in denen hunderttausende Käselaibe liegen. Der Käser gibt seinen Käse als <strong>Sicherheit</strong> ab und bekommt dafür einen Kredit. Die Bank lagert und pflegt den Käse professionell – und wenn der Käser nicht zurückzahlt, verkauft sie ihn.</p>
<p>Das System läuft seit den 1950er-Jahren. Es gibt Bankangestellte, deren Job es ist, Käse zu klopfen.</p>
<h4>Und warum ist Parmesan so umami?</h4>
<p>Beim langen Reifen entstehen freie Aminosäuren – vor allem <strong>Glutamat</strong>. Die weißen Kristalle im alten Parmesan sind größtenteils Tyrosin. Der Käse würzt sich beim Reifen praktisch selbst.</p>`,

id:'espresso', t:'Espresso & Cappuccino', emoji:'☕', cat:'food',
teaser:'Der eine wurde aus Ungeduld erfunden, der andere ist nach einer Mönchskutte benannt.',
story:`<p><strong>Espresso</strong> entstand aus einem sehr banalen Problem: Kaffeekochen dauerte zu lange, und Fabrikbesitzer bezahlten Pausen. Der Mailänder <strong>Luigi Bezzera</strong> meldete 1901 eine Maschine an, die Wasser mit Dampfdruck durch das Kaffeemehl presste – Kaffee in Sekunden statt Minuten.</p>
<p><em>Espresso</em> heißt dabei nicht „schnell“, sondern eher „eigens für dich gemacht“ – wie in „express“ für einen Auftrag auf Bestellung. Der moderne Espresso mit Crema kam erst 1948 mit <strong>Achille Gaggias</strong> Hebelmaschine, die echten Druck statt nur Dampf erzeugte.</p>
<h4>Und der Cappuccino?</h4>
<p>Der Name kommt von den <strong>Kapuzinermönchen</strong>. Deren Ordenstracht hat genau dieses Braun mit heller Kapuze – italienisch <em>cappuccio</em>. In Wien gab es schon im 18. Jahrhundert den „Kapuziner“: Kaffee mit so viel Sahne, dass er die Farbe der Kutte annahm. Der italienische Cappuccino, wie wir ihn kennen, entstand erst mit den Druckmaschinen, die Milch aufschäumen konnten.</p>
<p>Die Kapuzinermönche heißen übrigens nach ihrer auffälligen Kapuze – und der Kapuzineraffe wiederum nach den Mönchen.</p>`,

id:'nutella', t:'Nutella', emoji:'🍫', cat:'food',
teaser:'Nutella existiert, weil nach dem Krieg der Kakao ausging – und in Piemont die Haselnüsse nicht.',
story:`<p>Nach dem Zweiten Weltkrieg war Kakao in Italien extrem knapp und hoch besteuert. Der Konditor <strong>Pietro Ferrero</strong> in Alba (Piemont) hatte ein Problem: Schokolade war für normale Leute unbezahlbar.</p>
<h4>Was er hatte</h4>
<p>Haselnüsse. Das Piemont ist eine der besten Haselnussregionen der Welt. Ferrero streckte den wenigen Kakao mit gemahlenen Haselnüssen und Zucker – eine lokale Tradition namens <em>gianduia</em>, die schon zu Napoleons Kontinentalsperre entstanden war, als Kakao ebenfalls fehlte.</p>
<h4>Erst ein Laib, dann eine Creme</h4>
<p>1946 verkaufte er das Ergebnis als <strong>Giandujot</strong> – einen festen Block, von dem man Scheiben abschnitt und aufs Brot legte. Weil er in der Sommerhitze weich wurde, entwickelte man daraus die streichfähige <em>Supercrema</em>. 1964 gab Sohn Michele ihr einen international aussprechbaren Namen: <strong>Nutella</strong>.</p>
<p>Ferrero ist bis heute einer der größten Haselnusskäufer der Welt.</p>`,

id:'kartoffelchips', t:'Kartoffelchips', emoji:'🥔', cat:'food',
teaser:'Die berühmte Rache-Geschichte hinter den Chips hält der Prüfung leider nicht ganz stand.',
story:`<p>Die Standardversion: 1853 im Kurort Saratoga Springs schickt ein Gast seine Pommes zurück – zu dick, zu labberig. Koch <strong>George Crum</strong> rächt sich, schneidet die Kartoffeln papierdünn, frittiert sie knusprig und salzt sie über. Der Gast ist begeistert. Chips sind geboren.</p>
<h4>Was daran wackelt</h4>
<p>Die Geschichte taucht erst Jahrzehnte später auf, der berühmte Gast (angeblich Cornelius Vanderbilt) wird erst noch später hinzugedichtet. Und vor allem: <strong>Rezepte für dünn frittierte Kartoffelscheiben gibt es schon vorher</strong> – etwa in William Kitchiners britischem Kochbuch „The Cook's Oracle“ von 1817.</p>
<p>Belegbar ist immerhin, dass in Saratoga tatsächlich „Saratoga Chips“ berühmt wurden – und dass Crums Schwester <strong>Catherine Wicks</strong> in manchen frühen Berichten als die eigentliche Erfinderin genannt wird.</p>
<h4>Der eigentliche Durchbruch</h4>
<p>Chips blieben lange lose Ware aus dem Fass, die schnell weich wurde. Die Amerikanerin <strong>Laura Scudder</strong> ließ ab den 1920ern Mitarbeiterinnen Wachspapier zu Tüten bügeln – die luftdichte Tüte machte aus einem Restaurantsnack ein Weltprodukt.</p>`,

id:'sushi', t:'Sushi', emoji:'🍣', cat:'food',
teaser:'Ursprünglich war der Reis nur Verpackung – und wurde weggeworfen.',
story:`<p>Die Urform heißt <strong>narezushi</strong> und kam vermutlich über Südostasien nach Japan. Fisch wurde in gekochtem Reis eingelegt und <strong>monatelang fermentiert</strong>. Die Milchsäuregärung des Reises konservierte den Fisch.</p>
<p>Der Reis war dabei reines Konservierungsmittel: eine matschige, saure Masse, die man vor dem Essen <strong>abstreifte und wegwarf</strong>.</p>
<h4>Die Abkürzung</h4>
<p>Irgendwann kam jemand auf die Idee, den sauren Geschmack schneller herzustellen – mit <strong>Reisessig</strong> statt monatelanger Gärung. Damit wurde der Reis plötzlich selbst essbar.</p>
<h4>Sushi war Fast Food</h4>
<p>Im Edo des frühen 19. Jahrhunderts (dem heutigen Tokio) verkaufte <strong>Hanaya Yohei</strong> an einem Straßenstand Häppchen aus gepresstem Essigreis mit einer Scheibe Fisch obendrauf: <em>nigiri</em>. Gedacht als schnelles Essen im Stehen, für Handwerker, zwischen zwei Terminen. Die Stücke waren deutlich größer als heute.</p>
<p>Das Bild vom stillen, hochpreisigen Sushi-Tempel kam erst viel später.</p>`,

id:'bier-reinheitsgebot', t:'Reinheitsgebot', emoji:'🍺', cat:'food',
teaser:'Das älteste Lebensmittelgesetz der Welt war zu großen Teilen Wirtschaftspolitik.',
story:`<p>1516 erließ Herzog Wilhelm IV. von Bayern eine Landesordnung, in der stand, Bier dürfe nur aus <strong>Gerste, Hopfen und Wasser</strong> gebraut werden. (Hefe fehlt, weil man sie noch nicht kannte.)</p>
<h4>Es ging nicht nur um Qualität</h4>
<p>Weizen und Roggen sollten den <strong>Bäckern</strong> vorbehalten bleiben – Brotgetreide war knapp und teuer. Die Regel drückte also gezielt Bierbrauer aus dem Markt für Backgetreide.</p>
<p>Der zweite Punkt: Die Verordnung legte auch <strong>Höchstpreise</strong> für Bier fest. Und sie beendete den Einsatz der damals üblichen Kräutermischungen (<em>Grut</em>) – auf die in manchen Regionen ein lukratives Steuermonopol lag.</p>
<h4>Und der Name?</h4>
<p>Das Wort „Reinheitsgebot“ fällt 1516 nirgends. Es taucht erst <strong>1918</strong> in einer Debatte im bayerischen Landtag auf – und wurde danach zum Marketingbegriff.</p>
<p>Beim Beitritt Bayerns zum Deutschen Reich 1871 machte Bayern die bundesweite Übernahme der Regel übrigens zur Bedingung.</p>`,

id:'pizza-margherita', t:'Pizza Margherita', emoji:'🍕', cat:'food',
teaser:'Die Königin, die Flagge, der Pizzabäcker – und ein Dokument, das Zweifel weckt.',
story:`<p>Die berühmte Version: 1889 besucht Königin <strong>Margherita von Savoyen</strong> Neapel. Pizzaiolo <strong>Raffaele Esposito</strong> backt ihr drei Pizzen; die mit Tomate, Mozzarella und Basilikum – rot, weiß, grün wie die italienische Flagge – gefällt ihr am besten und wird nach ihr benannt.</p>
<h4>Der Haken</h4>
<p>Als Beleg gilt ein Dankschreiben des königlichen Hofes. Der italienische Foodhistoriker <strong>Zachary Nowak</strong> hat es untersucht und hält es für <strong>zweifelhaft</strong>: Wappen und Formulierungen passen nicht zur damaligen Hofkorrespondenz.</p>
<p>Außerdem: Eine Pizza mit Tomate, Mozzarella und Basilikum ist bereits <strong>1866</strong> beschrieben – bei Francesco DeBouchard, über 20 Jahre vor dem Besuch der Königin. Sie hatte damals nur keinen Namen.</p>
<h4>Was trotzdem stimmt</h4>
<p>Pizza war in Neapel Armenessen und galt in Norditalien lange als unappetitlich. Die Verbindung mit einer Königin – ob echt oder gut erfunden – hat maßgeblich dazu beigetragen, dass sie gesellschaftsfähig wurde.</p>`,
cool:'Der wahre Effekt der Geschichte war nicht das Rezept, sondern der Imagewechsel: Armenessen wird Nationalgericht, weil eine Königin darin vorkommt.',
gold:'Die Margherita-Königinnengeschichte ist umstritten – das angebliche Beweisdokument gilt als zweifelhaft, und das Rezept ist schon 1866 belegt.',
perfect:'Dinner / Restaurant',
diff:'interesting', mem:4, cert:'legende',
src:'Zachary Nowak, „Folklore, Fakelore, History: Invented Tradition and the Origins of the Pizza Margherita“ (2014)',

{
id:'eiswaffel', t:'Die Eiswaffel', emoji:'🍦', cat:'food',
teaser:'Eine Weltausstellung, ein ausverkaufter Stand und ein Nachbar mit zu vielen Waffeln.',
story:`<p>Weltausstellung <strong>St. Louis, 1904</strong>. Ein Eisverkäufer hat einen Ansturm – und irgendwann keine sauberen Schälchen mehr. Nebenan steht ein syrisch-libanesischer Waffelbäcker namens <strong>Ernest Hamwi</strong>, dessen dünne <em>zalabia</em>-Waffeln sich schlecht verkaufen.</p>
<p>Hamwi rollt eine heiße Waffel zur Tüte, das Eis kommt hinein – und der Stand hat wieder Geschäft. Die Waffeltüte wird zur Attraktion der Messe.</p>
<h4>Aber…</h4>
<p>Mindestens vier verschiedene Personen haben die Erfindung auf dieser Messe für sich reklamiert. Und der Italiener <strong>Italo Marchiony</strong> in New York hatte bereits <strong>1903</strong> ein Patent auf eine Form zur Herstellung essbarer Eisbecher.</p>
<p>Was nicht bestritten wird: St. Louis 1904 war der Moment, in dem die Eistüte aus einer Kuriosität ein Massenprodukt wurde.</p>
<h4>Nebenbei</h4>
<p>Dieselbe Weltausstellung gilt auch als Popularisierungsmoment für Hot Dogs, Erdnussbutter und Eistee. Ob alles dort erfunden wurde? Eher nicht. Berühmt wurde es dort auf jeden Fall.</p>`,
cool:'Es gibt Momente, in denen sich Alltagsgegenstände einfach durchsetzen – und die Weltausstellung 1904 war so ein Massen-Geburtstag.',

perfect:'Sommer / Small Talk',

id:'jeans-nieten', t:'Die Nieten an der Jeans', emoji:'👖', cat:'fashion',
teaser:'Ein Schneider aus Nevada hatte ein Problem mit reißenden Taschen – und kein Geld für das Patent.',
story:`<p><strong>Jacob Davis</strong> war Schneider in Reno, Nevada, und nähte Arbeitshosen. Seine Kunden – Bergleute, Holzfäller – rissen ihm ständig die Taschen aus der Hose, wenn sie Werkzeug hineinstopften.</p>
<h4>Die Idee</h4>
<p>Davis hatte Kupfernieten für Pferdedecken herum liegen. Er setzte sie an die <strong>Belastungspunkte der Taschenecken</strong>. Die Hosen hielten – und sprachen sich herum.</p>
<p>Ein Patent kostete 68 Dollar, die er nicht hatte. Also schrieb er an seinen Stofflieferanten in San Francisco: <strong>Levi Strauss</strong>. Am 20. Mai 1873 bekamen die beiden gemeinsam US-Patent Nr. 139.121 – auf „Verbesserungen an Taschenöffnungen“. Dieses Datum gilt als Geburtstag der Jeans.</p>
<h4>Die verschwundene Niete</h4>
<p>Lange saß eine Niete auch im <strong>Schritt</strong>. Firmenüberlieferung zufolge beschwerten sich Cowboys, dass sie sich am Lagerfeuer aufheizte; angeblich soll auch der Levi's-Chef selbst dieses Erlebnis gehabt haben. 1941 verschwand sie – offiziell wegen Metallrationierung im Krieg. Sie kam nie zurück.</p>
<p>Die winzige fünfte Tasche über der rechten Vordertasche war übrigens eine <strong>Uhrentasche</strong> für Taschenuhren.</p>`,

id:'knopfleiste', t:'Knöpfe links oder rechts', emoji:'👔', cat:'fashion',
teaser:'Warum Frauen- und Männerhemden bis heute spiegelverkehrt schließen.',
story:`<p>Bei Herrenhemden sitzen die Knöpfe rechts, bei Damenblusen links. Praktisch weltweit, seit über hundert Jahren, ohne dass es eine Regel gäbe, die das vorschreibt.</p>
<h4>Die gängigste Erklärung</h4>
<p>Wohlhabende Frauen wurden früher <strong>angezogen</strong> – von Zofen. Für eine Person, die dem Gegenüber gegenübersteht, ist es leichter, Knöpfe auf der eigenen rechten Seite zu greifen, also auf der linken Seite der Trägerin. Männer zogen sich selbst an.</p>
<p>Für Männer gibt es eine zweite Erklärung: Wer mit rechts das Schwert oder später die Waffe zieht, greift mit rechts unter den Mantel – dafür sollte die rechte Seite oben liegen. Auch Uniformen sind so geschnitten.</p>
<h4>Ehrlich gesagt</h4>
<p>Beide Erklärungen sind <strong>plausibel, aber nicht sauber belegt</strong>. Sie stammen aus späteren Erzählungen, nicht aus zeitgenössischen Schneiderquellen. Was sicher ist: Die Konvention verfestigte sich mit der industriellen Konfektionsfertigung im 19. Jahrhundert – und blieb dann einfach, weil Maschinen, Schnittmuster und Gewohnheit teurer zu ändern sind als beizubehalten.</p>`,

id:'anzugknopf', t:'Der Knopf, den man nie schließt', emoji:'🤵', cat:'fashion',
teaser:'Eine Kleiderregel, die angeblich existiert, weil ein König zugenommen hat.',
story:`<p>Die Regel ist eisern: Beim Zweireiher… nein, beim Einreiher schließt man den <strong>unteren Knopf nie</strong>. Bei drei Knöpfen: manchmal oben, immer Mitte, nie unten. Auch bei Westen bleibt der letzte Knopf offen.</p>
<h4>Die Erklärung, die alle kennen</h4>
<p><strong>Edward VII.</strong>, britischer König ab 1901 und einflussreichster Modemann seiner Zeit, war ein Genussmensch von beträchtlichem Umfang. Er ließ – so die Erzählung – den untersten Westenknopf offen, weil es bequemer war. Der Hof machte es nach, aus Höflichkeit. Danach die feine Gesellschaft. Dann alle.</p>
<h4>Wie sicher ist das?</h4>
<p>Es ist die am häufigsten erzählte Version und passt gut zu Edwards dokumentiertem Modeeinfluss – er hat auch die Hosenumschläge und das Rauchen nach dem Dinner salonfähig gemacht. Ein zeitgenössischer Beleg für den konkreten Knopf-Moment <strong>fehlt aber</strong>.</p>
<p>Die nüchterne Alternative: Sakkos und Westen jener Zeit waren am unteren Knopf geschnitten wie ein Reitrock. Geschlossen zieht der Stoff hässlich und behindert beim Sitzen – und im Sattel. Die Regel ist also womöglich einfach <strong>Schnittlogik</strong>, die sich später eine Anekdote gesucht hat.</p>`,
cool:'Millionen Menschen befolgen täglich eine Regel, die vermutlich nur ein Kompromiss zwischen Stoffzug und Bequemlichkeit ist.',
gold:'Der unterste Anzugknopf bleibt offen – angeblich, weil König Edward VII. zu korpulent war und der Hof es ihm nachmachte.',

id:'krawatte', t:'Die Krawatte', emoji:'👔', cat:'fashion',
teaser:'Ein völlig nutzloses Kleidungsstück, das nur existiert, weil französische Höflinge etwas cool fanden.',
story:`<p>Im <strong>Dreißigjährigen Krieg</strong> dienten kroatische Söldner in französischen Diensten. Sie trugen um den Hals ein geknotetes Tuch – teils praktisch (es hielt den Hemdkragen zusammen), teils als Erkennungszeichen der Einheit.</p>
<h4>Paris fand das gut</h4>
<p>Am französischen Hof, ab etwa 1660 unter Ludwig XIV., wurde das Tuch zum Modeaccessoire. Der Name blieb an der Herkunft hängen: französisch <em>cravate</em>, abgeleitet von <em>Croate</em> – Kroate. Im Deutschen wurde daraus die <strong>Krawatte</strong>.</p>
<p>Kroatien feiert deshalb bis heute am 18. Oktober den „Tag der Krawatte“.</p>
<h4>Vom Tuch zum Schlips</h4>
<p>Jahrhundertelang war das Ding ein wallendes Halstuch. Die moderne, schmale Krawatte mit Schrägschnitt, die sich richtig binden lässt und wieder in Form fällt, ist eine erstaunlich junge Erfindung: <strong>Jesse Langsdorf</strong> patentierte sie <strong>1924</strong> in New York.</p>
<p>Das Kleidungsstück, das heute Seriosität signalisiert, ist damit jünger als das Automobil.</p>`,

id:'aermelknoepfe', t:'Knöpfe am Sakkoärmel', emoji:'🧵', cat:'fashion',
teaser:'Vier Knöpfe an einer Stelle, an der sich nie etwas öffnet. Warum?',
story:`<p>An fast jedem Sakkoärmel sitzen drei oder vier Knöpfe, die nichts halten. Bei billigen Anzügen sind sie sogar aufgenäht, ohne Knopfloch.</p>
<h4>Die Legende</h4>
<p>Napoleon habe seinen Soldaten Knöpfe an die Ärmel nähen lassen, damit sie sich nicht mit dem Ärmel die Nase abwischen. Charmant – aber ohne Quelle und vermutlich erfunden.</p>
<h4>Die wahrscheinlichere Erklärung</h4>
<p>Frühe Mäntel und Uniformröcke hatten am Ärmel tatsächlich <strong>funktionierende Knöpfe</strong>. Man konnte den Ärmel öffnen und hochkrempeln – wichtig für Ärzte, Handwerker und alle, die mit den Händen arbeiteten, ohne den Rock auszuziehen. Bei militärischen Uniformen half es beim Anziehen enger Ärmel.</p>
<p>Als Sakkos zur reinen Repräsentationskleidung wurden, blieb das Detail – als <strong>dekorativer Rest einer Funktion</strong>.</p>
<h4>Der Insider-Code</h4>
<p>Bei maßgeschneiderten Sakkos lassen sich die Ärmelknöpfe bis heute wirklich öffnen: die sogenannten <em>surgeon's cuffs</em>, „Chirurgenmanschetten“. Wer den untersten offen trägt, signalisiert damit still: Das hier ist kein Anzug von der Stange. Manche finden das elegant, andere albern.</p>`,

id:'schlaufe-hemd', t:'Die Schlaufe am Hemdrücken', emoji:'🪝', cat:'fashion',
teaser:'Diese kleine Stoffschlaufe hatte einen Zweck – und dann einen zweiten, den die Hersteller nie geplant hatten.',
story:`<p>Auf dem Rücken vieler Hemden – klassisch bei Oxford-Button-Downs – sitzt eine kleine Stoffschlaufe unterhalb der Passe. Sie heißt <em>locker loop</em>.</p>
<h4>Der Zweck</h4>
<p>Der Hersteller <strong>GANT</strong> nähte sie in den 1960ern ein, als er Hemden für amerikanische Ivy-League-Universitäten produzierte. Studenten hatten in den Umkleiden keine Kleiderbügel, nur Haken. Die Schlaufe erlaubte es, das Hemd aufzuhängen, <strong>ohne es zu zerknittern</strong>. Ähnliche Schlaufen gab es auch an Marine-Uniformen, wo Platz knapp war.</p>
<h4>Und dann übernahmen die Studenten</h4>
<p>An den Colleges entstand daraus ein sozialer Code: Eine <strong>abgerissene Schlaufe</strong> galt an manchen Campus als Zeichen, dass der Träger vergeben war. Manche erzählen, Studentinnen hätten die Schlaufe demonstrativ abgerissen, um öffentlich Anspruch anzumelden.</p>
<p>Diese Deutung ist Campus-Folklore, gut dokumentiert in Erinnerungen der Zeit, aber natürlich nie offiziell. GANT selbst nennt die Schlaufe heute schlicht ein Erkennungsmerkmal.</p>`,

gold:'Die kleine Schlaufe am Hemdrücken war zum Aufhängen an Umkleidehaken gedacht – an US-Colleges wurde ein abgerissener Loop zum Zeichen, dass jemand vergeben ist.',

id:'hohe-absaetze', t:'High Heels', emoji:'👠', cat:'fashion',
teaser:'Sie wurden für Männer erfunden – und zwar für einen sehr praktischen Zweck zu Pferd.',
story:`<p>Der Absatz kommt aus dem <strong>persischen Reiterwesen</strong>. Ein erhöhter Absatz hält den Fuß im Steigbügel, wenn der Reiter sich aufrichtet, um zu schießen. Reine Funktion, ausschließlich für Männer.</p>
<h4>Der Export</h4>
<p>Um 1600 kamen persische Diplomaten nach Europa. Der europäische Adel fand die Schuhe grandios: Sie waren zum Gehen unpraktisch – und genau das war der Punkt. <strong>Wer High Heels trug, musste nicht arbeiten.</strong></p>
<p><strong>Ludwig XIV.</strong> trug rote Absätze und verbot per Erlass allen außerhalb des Hofes, ebenfalls rote Sohlen zu tragen. Ein königliches Markenrecht auf eine Farbe – etwas, worüber Christian Louboutin Jahrhunderte später wieder prozessieren würde.</p>
<h4>Der Wechsel</h4>
<p>Im 17. Jahrhundert begannen Frauen, Männermode zu zitieren – Absätze inklusive. Mit der <strong>Aufklärung</strong> galt Männermode zunehmend als nüchtern und praktisch; der Absatz wurde als frivol abgelegt und blieb bei den Frauen. Die Französische Revolution beendete den Absatz dann für eine Weile ganz.</p>
<p>Er kam im 19. Jahrhundert zurück – da bereits eindeutig weiblich codiert.</p>`,

id:'sonnenbrille', t:'Die Sonnenbrille', emoji:'🕶️', cat:'fashion',
teaser:'Ursprünglich ging es nicht darum, weniger zu sehen – sondern darum, weniger gesehen zu werden.',
story:`<p>Frühe Formen dunkler Brillen dienten nicht dem Sonnenschutz. Im <strong>China des 12. Jahrhunderts</strong> nutzten Richter Scheiben aus geräuchertem Quarz – nicht gegen Blendung, sondern um ihre <strong>Augen zu verbergen</strong>. Niemand sollte an ihrem Blick ablesen, wie sie über eine Aussage dachten. Eine Art analoges Pokerface.</p>
<h4>Der medizinische Umweg</h4>
<p>Im 18. Jahrhundert verschrieb man in Europa getönte Gläser – grün und blau – gegen bestimmte Sehbeschwerden. Es blieb ein Nischenprodukt für Kranke.</p>
<h4>Der Massenmarkt</h4>
<p>1929 verkaufte <strong>Sam Foster</strong> billige Kunststoffbrillen an Strandbesucher in Atlantic City. Sie wurden ein Hit.</p>
<p>Parallel entwickelte Bausch &amp; Lomb ab den 1930ern für die US-Luftwaffe eine Brille, die Piloten in großen Höhen vor Blendung schützt: die <strong>Aviator</strong>. Über Fotos von Generälen und später Hollywood wurde daraus ein Stilobjekt.</p>
<p>Und damit schloss sich der Kreis: Heute trägt man Sonnenbrillen wieder auch aus dem ursprünglichen Grund – damit niemand sieht, wo man hinschaut.</p>`,

id:'weisses-brautkleid', t:'Das weiße Brautkleid', emoji:'👰', cat:'fashion',
teaser:'Vor 1840 war Weiß eine ziemlich unpraktische Wahl – und keine besonders symbolische.',
story:`<p>Bräute heirateten jahrhundertelang in ihrem <strong>besten Kleid</strong>, egal welcher Farbe. Häufig Rot, Blau oder Braun – Hauptsache haltbar und wiederverwendbar. Weiß war unpraktisch: schwer sauber zu halten, kaum färbbar, teuer.</p>
<h4>1840</h4>
<p><strong>Königin Victoria</strong> heiratete Prinz Albert in einem weißen Seidenkleid mit Honiton-Spitze. Teils, um die notleidende englische Spitzenindustrie zu fördern – Weiß zeigt Spitze am besten. Die Hochzeit wurde in Zeitungen und Stichen massenhaft verbreitet.</p>
<p>Der Effekt: Weiß wurde zum Statussymbol. Es signalisierte, dass man sich ein Kleid leisten konnte, das man <strong>nur einmal trägt</strong>.</p>
<h4>Die Bedeutung kam später</h4>
<p>Die Gleichsetzung „Weiß = Reinheit/Unschuld“ wurde erst im späteren 19. Jahrhundert nachträglich in die Mode hineininterpretiert – von Ratgeberliteratur und Magazinen, nicht von Victoria selbst.</p>
<p>Victoria trug ihre Spitze übrigens später mehrfach weiter, unter anderem zu einem Jubiläum. Sehr unromantisch, sehr vernünftig.</p>`,
cool:'Eine der emotional aufgeladensten Traditionen überhaupt ist im Kern ein Trend, den eine einzelne prominente Hochzeit ausgelöst hat.',

id:'sneaker-farbe', t:'Warum Sneakersohlen weiß sind', emoji:'👟', cat:'fashion',
teaser:'Die Farbe ist kein Designentscheid, sondern Chemie – und der Name „Sneaker“ ist eine kleine Frechheit.',
story:`<p>Naturkautschuk ist gelblich-braun und wird klebrig. Damit er belastbar wird, wird er <strong>vulkanisiert</strong> – und dabei kommt ein Füllstoff ins Spiel, der die Sohle stabil macht.</p>
<p>Zwei Optionen dominieren: <strong>Ruß</strong> macht Gummi schwarz und besonders abriebfest (deshalb sind Autoreifen schwarz). <strong>Zinkoxid und Titandioxid</strong> machen ihn weiß. Weiße Sohlen waren früher das Zeichen für Schuhe, die <em>nicht</em> für die Straße gedacht waren, sondern für Sport in der Halle oder auf dem Tennisplatz – dort wollte man keine schwarzen Streifen auf dem Boden.</p>
<h4>Und der Name?</h4>
<p>Ende des 19. Jahrhunderts fiel Leuten auf, dass Gummisohlen im Gegensatz zu Ledersohlen mit Absatz <strong>fast geräuschlos</strong> sind. In England und den USA nannte man solche Schuhe deshalb <em>sneakers</em> – von <em>to sneak</em>, sich anschleichen.</p>
<p>Der Begriff wurde teils spöttisch verwendet: Schuhe, in denen man sich unbemerkt nähern kann, klangen nach zwielichtigen Absichten.</p>`,
cool:'Ein Schuhtyp ist danach benannt, dass man sich damit anschleichen kann – und die Sohlenfarbe verrät, ob er ursprünglich für drinnen oder draußen gedacht war.',
gold:'„Sneaker“ heißt so, weil Gummisohlen im Gegensatz zu Ledersohlen lautlos sind – man konnte sich damit anschleichen.',

{
id:'kleidergroessen', t:'Warum Kleidergrößen nicht stimmen', emoji:'📏', cat:'fashion',
teaser:'Größe 38 ist keine Maßeinheit, sondern ein Gefühl – und das ist historisch erklärbar.',
story:`<p>Bei Schrauben, Kabeln und Papier funktionieren Normen. Bei Kleidung nicht. Eine 38 kann in drei Läden drei verschiedene Körper meinen. Das hat zwei Gründe.</p>
<h4>Grund 1: Die Norm war von Anfang an schlecht</h4>
<p>Die erste große US-Normierung basierte auf einer Vermessung von rund 15.000 Frauen in den 1930er-Jahren – finanziert im Rahmen von Beschäftigungsprogrammen. Teilgenommen haben überwiegend <strong>junge, weiße Frauen in wirtschaftlicher Not</strong>, weil es Geld dafür gab. Die Stichprobe repräsentierte die Bevölkerung schlicht nicht. Die daraus abgeleiteten Standards wurden 1983 offiziell zurückgezogen.</p>
<h4>Grund 2: Eitelkeit verkauft</h4>
<p>Seither gilt <strong>Vanity Sizing</strong>: Marken vergeben systematisch kleinere Zahlen für gleich bleibende Maße, weil Kundinnen und Kunden ein Kleidungsstück lieber kaufen, wenn eine kleinere Zahl im Etikett steht. Ein und dieselbe Zahl bezeichnet heute deutlich größere Maße als vor 50 Jahren.</p>
<p>Bei Herrenhosen funktioniert das anders: Dort steht mit Bundweite in Zoll eine echte Maßangabe – die allerdings von manchen Herstellern ebenfalls großzügig ausgelegt wird.</p>`,

story:`<p>Als die Eisenbahn Signale brauchte, war Rot für „Halt“ schnell gesetzt: Rot war seit Jahrhunderten die Warnfarbe, hat die längste Wellenlänge im sichtbaren Licht und ist bei Nebel und Regen am weitesten sichtbar.</p>

teaser:'Die berühmteste Erklärung – „damit man langsamer tippt“ – ist so ziemlich das Gegenteil der Wahrheit.',
story:`<p>Die verbreitete Version: <strong>Christopher Latham Sholes</strong> habe die Tasten absichtlich unpraktisch angeordnet, damit Schnelltipper die mechanischen Typenhebel nicht verhaken.</p>
<h4>Das ergibt nur halb Sinn</h4>
<p>Wäre Verlangsamung das Ziel gewesen, wäre die Anordnung deutlich schlechter ausgefallen. Tatsächlich stehen häufige Buchstabenpaare des Englischen so, dass sie sich <strong>nicht gegenseitig blockieren</strong> – das ist ein anderes Ziel als Langsamkeit. Verhaken verhindert man, indem man häufige Nachbarn <em>auseinander</em> zieht, nicht indem man alle Finger bremst.</p>
<h4>Die Telegrafen-These</h4>

<h4>Und warum bleibt es?</h4>

story:`<p>Ein Flugzeugfenster besteht aus <strong>drei Acrylglasscheiben</strong>. Nur in der mittleren sitzt das kleine Loch, das man vom Sitz aus sieht.</p>
<h4>Was es tut</h4>

<p>Die innerste Scheibe ist übrigens keine Sicherheitsscheibe, sondern nur Kratzschutz für die Passagiere.</p>`,

story:`<p>Die <strong>de Havilland Comet</strong> war 1952 das erste Düsenverkehrsflugzeug der Welt – ein britischer Triumph. Sie flog höher und schneller als alles zuvor und hatte große, elegante, <strong>fast rechteckige Fenster</strong>.</p>

<p>Die daraufhin angeordnete Untersuchung war eine der aufwendigsten der Luftfahrtgeschichte: Man versenkte einen kompletten Rumpf in einem <strong>Wassertank</strong> und simulierte Tausende Druckzyklen, bis er riss.</p>

<p>Die Comet-Untersuchung veränderte die Luftfahrt grundlegend – die Erkenntnisse flossen direkt in die Boeing 707 ein, die den Markt danach dominierte.</p>`,

story:`<p>Die nach innen gewölbte Vertiefung im Boden von Wein- und Sektflaschen hat einen eigenen Namen: <strong>Punt</strong> oder <em>Kick-up</em>.</p>
<h4>Die technische Erklärung</h4>
<p>Bei Sekt und Champagner ist der Zweck klar: Der Innendruck beträgt bis zu <strong>6 bar</strong>, ungefähr dreimal so viel wie in einem Autoreifen. Eine gewölbte Form verteilt Druck besser als eine flache – dasselbe Prinzip wie bei einer Kuppel oder einem Gewölbe.</p>
<h4>Die historische Erklärung</h4>

<h4>Und bei stillem Wein?</h4>

<p>Es gibt sogar Untersuchungen, die zeigen: Bei gleichem Inhalt wird Wein in Flaschen mit tiefem Punt als hochwertiger eingeschätzt.</p>`,

story:`<p>Als Münzen noch aus echtem Gold und Silber bestanden, war eine Münze so viel wert wie ihr Metall. Das führte zu einem einfachen Betrug: <strong>coin clipping</strong>. Man schabte oder feilte vom Rand ein wenig Metall ab, gab die Münze weiter – und sammelte die Späne. Aus genug Spänen ließ sich neues Geld gießen.</p>

<h4>Der Chefermittler</h4>

story:`<p>Zellstoff ist von Natur aus <strong>bräunlich</strong>, weil er Lignin enthält – den Stoff, der Holz stabil macht. Für Papier wird Lignin herausgelöst und der Rest gebleicht.</p>

story:`<p>Als Hochhäuser in den USA immer höher wurden, gab es massive Beschwerden über <strong>Wartezeiten am Aufzug</strong>. Die naheliegende Lösung – schnellere oder zusätzliche Aufzüge – war baulich extrem teuer.</p>
<h4>Die Umdeutung des Problems</h4>
<p>Ein Berater soll darauf hingewiesen haben, dass die Beschwerde nicht „zu lange“ lautet, sondern „zu langweilig“. Die Wartezeit war nicht das Problem, sondern die <strong>gefühlte</strong> Wartezeit.</p>
<p>Also hängte man <strong>Spiegel</strong> in die Aufzugslobbys und in die Kabinen. Die Beschwerden gingen deutlich zurück. Menschen betrachten sich selbst, beobachten unauffällig andere – und die Zeit vergeht subjektiv schneller.</p>

story:`<p>1948 hörte der Student <strong>Bernard Silver</strong> zufällig mit, wie ein Supermarktchef einen Professor darum bat, ein System zur automatischen Warenerfassung zu entwickeln. Der Professor lehnte ab. Silver erzählte es seinem Kommilitonen <strong>Joseph Woodland</strong>.</p>
<h4>Der Strand</h4>
<p>Woodland zog sich zum Nachdenken zu seinem Großvater nach Miami Beach zurück. Er konnte Morsecode – und während er im Sand saß, zog er, so seine eigene Schilderung, gedankenverloren <strong>vier Finger durch den Sand</strong>. Punkte und Striche des Morsecodes, nach unten verlängert zu Linien unterschiedlicher Dicke.</p>
<p>Ihr Patent von 1952 zeigte allerdings <strong>konzentrische Kreise</strong> – ein „Bullseye“-Code, den man aus jeder Richtung lesen kann.</p>
<h4>Warum 20 Jahre nichts passierte</h4>
<p>Es fehlte die Technik zum Lesen. Erst der <strong>Laser</strong> und billige Computer machten das System praktikabel. Die Supermarktbranche einigte sich 1973 auf den UPC-Strichcode von George Laurer bei IBM.</p>
<h4>Der erste Scan</h4>

id:'bic-loch', t:'Das Loch im Kugelschreiberdeckel', emoji:'🖊️', cat:'alltag',
teaser:'Es hat nichts mit Tinte zu tun. Es geht um Kinder.',
story:`<p>Auf der Kappe des klassischen BIC Cristal sitzt ein kleines Loch. Viele halten es für einen Druckausgleich, damit die Tinte fließt – das ist nicht der Hauptgrund. Der Druckausgleich passiert über ein winziges Loch im <strong>Schaft</strong>, nicht in der Kappe.</p>
<h4>Der eigentliche Grund</h4>
<p>Kugelschreiberkappen sind klein, glatt und landen erstaunlich häufig im Mund. Wenn eine solche Kappe in die Luftröhre gerät, kann sie diese vollständig verschließen.</p>
<p>Das Loch sorgt dafür, dass im Ernstfall <strong>weiterhin Luft strömen kann</strong>, bis medizinische Hilfe eintrifft. Es ist eine Notfall-Zeitreserve, kein Rettungsmittel.</p>
<h4>Nicht nur Design, sondern Norm</h4>
<p>Das ist keine Marotte eines Herstellers: Die internationale Norm <strong>ISO 11540</strong> regelt Anforderungen an Kappen von Schreibgeräten, die wahrscheinlich von Kindern benutzt werden – inklusive Mindestluftdurchlass.</p>
<p>Deshalb haben so viele Kappen entweder ein Loch, eine Rille oder sind absichtlich so groß gestaltet, dass sie gar nicht erst verschluckt werden können.</p>
<p>BIC gibt an, seit 1950 weit über 100 Milliarden Cristal produziert zu haben. Es ist damit eines der meistverkauften Produkte der Menschheitsgeschichte – und der Stift hängt im MoMA.</p>`,

teaser:'Die Form ist ein Code – und sie funktioniert selbst, wenn das Schild von Schnee bedeckt oder unlesbar ist.',
story:`<p>In den USA wurde in den 1920er-Jahren ein System entwickelt, das die <strong>Anzahl der Ecken</strong> mit der Gefahrenstufe verknüpft: je mehr Seiten, desto gefährlicher.</p>
<p>Der Kreis (unendlich viele Seiten) war für Bahnübergänge reserviert, das Achteck für „Halt“, das Dreieck für „Vorfahrt gewähren“, das Rechteck für reine Information.</p>
<h4>Der clevere Teil</h4>
<p>Das Achteck ist die einzige Verkehrsschild-Form, die es <strong>nur einmal gibt</strong>. Das hat einen sehr praktischen Effekt: Wer von hinten auf das Schild schaut, sieht keine Schrift – aber die Form. Wenn das Schild verschneit, verschmutzt oder verblasst ist, bleibt die Silhouette lesbar.</p>
<p>Auch beim schnellen Vorbeifahren erkennt das Gehirn Umrisse schneller als Text.</p>
<h4>Warum Rot?</h4>
<p>Anfangs waren Stoppschilder <strong>gelb mit schwarzer Schrift</strong> – Rot verblasste zu schnell. Erst als in den 1950ern haltbare rote Reflexfolien verfügbar waren, wurde umgestellt.</p>
<p>Die Form setzte sich international durch: Das achteckige Stoppschild ist in der Wiener Straßenverkehrszeichen-Konvention von 1968 festgeschrieben – eines der wenigen Symbole, die auf fast jeder Straße der Welt dasselbe bedeuten. Auf vielen Schildern steht sogar in nicht-englischsprachigen Ländern „STOP“.</p>`,

{
id:'papierformat', t:'Warum DIN A4 so seltsame Maße hat', emoji:'📄', cat:'alltag',
teaser:'210 × 297 mm klingt willkürlich. Dahinter steckt eine wunderschöne mathematische Idee.',
story:`<p>Warum nicht 200 × 300? Weil dann etwas nicht mehr funktionieren würde.</p>
<h4>Die Regel</h4>
<p>Bei DIN-A-Formaten ist das Verhältnis von langer zu kurzer Seite immer <strong>√2 ≈ 1,414</strong>. Das ist die einzige Proportion, bei der ein halbiertes Blatt <strong>exakt dieselben Proportionen</strong> behält.</p>
<p>Deshalb ist A5 genau ein halbes A4, A3 genau zwei A4 – und alles lässt sich verlustfrei skalieren. Kopierer haben nur deshalb Tasten wie „70 %“: Das ist der Faktor von A4 auf A5.</p>
<h4>Und der Startpunkt?</h4>
<p>A0 ist definiert als das Blatt mit √2-Verhältnis und einer Fläche von <strong>genau einem Quadratmeter</strong>. Daraus ergibt sich alles andere durch Halbieren – auch die krummen Millimeterzahlen.</p>
<p>Praktischer Nebeneffekt: Papiergewicht wird in g/m² angegeben. Ein A0-Blatt 80-g-Papier wiegt also 80 Gramm – und ein A4-Blatt exakt ein Sechzehntel davon, also 5 Gramm. Deshalb weiß man beim Briefporto sofort, wie viele Blätter noch ins Standardgewicht passen.</p>
<h4>Wer hatte die Idee?</h4>
<p>Beschrieben hat sie schon 1786 der Physiker <strong>Georg Christoph Lichtenberg</strong> in einem Brief. Zur Norm wurde sie 1922 durch Walter Porstmann als DIN 476. Die USA sind bis heute nicht dabei – deshalb passt US-Letter nie ordentlich in europäische Ordner.</p>`,
cool:'Ein Standard, der so gut durchdacht ist, dass man aus einer einzigen Zahl – 1 Quadratmeter – das gesamte Papierwesen ableiten kann.',
gold:'DIN A4 hat krumme Maße, weil A0 exakt einen Quadratmeter groß ist und jedes Blatt beim Halbieren seine Proportionen behält. Ein A4-Blatt 80g-Papier wiegt genau 5 Gramm.',
perfect:'Büro / Small Talk',

src:'DIN 476 / ISO 216; Brief Lichtenbergs an Johann Beckmann, 1786',
rh:['kleidergroessen','barcode','meter']
},

id:'aspirin-name', t:'Warum Medikamente heißen, wie sie heißen', emoji:'💊', cat:'alltag',
teaser:'Der Name Aspirin ist eine Abkürzung aus drei Teilen – und eine deutsche Firma verlor ihn als Kriegsreparation.',
story:`<p><strong>Aspirin</strong> setzt sich zusammen aus: <em>A</em> für Acetyl, <em>spir</em> für <em>Spiraea ulmaria</em> (das Echte Mädesüß, aus dem verwandte Salicylverbindungen isoliert wurden) und der damals üblichen Endung <em>-in</em> für Arzneimittel.</p>
<h4>Der Name als Kriegsbeute</h4>
<p>Nach dem Ersten Weltkrieg musste Bayer im Rahmen der Reparationen Markenrechte abgeben. In den USA, Frankreich, Großbritannien und Russland wurde „Aspirin“ zur <strong>Gattungsbezeichnung</strong> – dort darf es jeder so nennen. In Deutschland und rund 80 weiteren Ländern gehört die Marke bis heute Bayer.</p>
<p>Deshalb heißt dasselbe Medikament in den USA schlicht „aspirin“ mit kleinem a, in Deutschland aber „Aspirin®“.</p>
<h4>Das gleiche Schicksal traf noch etwas</h4>
<p>Bayer verlor damals auch die Rechte an einem zweiten Markennamen, den die Firma für ein Hustenmittel eingetragen hatte: <strong>Heroin</strong> – vom griechischen <em>heros</em>, weil Testpersonen sich angeblich „heroisch“ fühlten. Es wurde ab 1898 rezeptfrei verkauft, unter anderem für Kinder, bevor die Wirkung als Suchtmittel offensichtlich wurde.</p>
<p>Beide Namen stammen aus demselben Labor, in denselben Jahren.</p>`,

id:'ok', t:'Woher kommt „OK“?', emoji:'👌', cat:'geschichte',
teaser:'Das vielleicht meistgesprochene Wort der Welt begann als dummer Zeitungswitz.',
story:`<p>Boston, <strong>23. März 1839</strong>. Die <em>Boston Morning Post</em> druckt einen kleinen Scherz. In der damaligen Redaktionsmode war es beliebt, Ausdrücke <strong>absichtlich falsch zu schreiben und dann abzukürzen</strong>. Etwa <em>KY</em> für „know yuse“ (statt „no use“) oder <em>OW</em> für „oll wright“ (statt „all right“).</p>
<p>Und eben <strong>OK</strong> für <em>oll korrect</em> – bewusst falsch für „all correct“.</p>
<h4>Warum überlebte ausgerechnet dieses?</h4>
<p>Ein Zufall der Politik. 1840 kandidierte Präsident <strong>Martin Van Buren</strong> für die Wiederwahl. Sein Spitzname war „Old Kinderhook“, nach seinem Geburtsort im Staat New York. Seine Anhänger gründeten <strong>OK Clubs</strong>, plakatierten „OK“ überall – und die zwei Buchstaben waren plötzlich im ganzen Land präsent.</p>
<p>Van Buren verlor die Wahl. „OK“ gewann.</p>
<h4>Der Turbo</h4>
<p>Der <strong>Telegraf</strong> machte den Rest: Zwei Buchstaben, die eindeutig sind und sich nicht mit anderen Signalen verwechseln lassen, waren ideal, um eine Übertragung zu bestätigen. Später übernahmen Eisenbahn und Luftfahrt das Prinzip.</p>
<p>Der Sprachwissenschaftler Allen Walker Read hat das in den 1960ern akribisch nachgewiesen – gegen etwa ein Dutzend konkurrierender Theorien (griechisch, choctaw, französisch, schottisch), die sich alle nicht belegen ließen.</p>`,

id:'deadline', t:'Deadline', emoji:'⏱️', cat:'geschichte',
teaser:'Das Wort, das dein Arbeitsleben strukturiert, kommt aus einem Gefangenenlager.',
story:`<p>Im <strong>Amerikanischen Bürgerkrieg</strong> gab es das berüchtigte Kriegsgefangenenlager <strong>Andersonville</strong> in Georgia. Es war völlig überfüllt, ohne feste Gebäude, und rund 13.000 Gefangene starben dort.</p>
<h4>Die Linie</h4>
<p>Innerhalb des Palisadenzauns verlief in einigen Metern Abstand eine leichte Markierung – ein niedriges Geländer oder eine gezogene Linie. Wer sie überschritt, wurde von den Wachtürmen aus <strong>ohne Warnung erschossen</strong>.</p>
<p>Diese Linie hieß in Berichten und Verhören der Zeit wörtlich <em>dead line</em>. Der Lagerkommandant Henry Wirz wurde nach dem Krieg unter anderem deswegen angeklagt und hingerichtet – einer der wenigen Kriegsverbrecherprozesse des Konflikts.</p>
<h4>Vom Ort zur Zeit</h4>
<p>Der Begriff überlebte zunächst im Druckereiwesen: Dort bezeichnete <em>deadline</em> eine Linie auf der Druckplatte, jenseits derer Text nicht mehr gedruckt wurde – was ebenfalls „drüber ist weg“ bedeutete.</p>
<p>Erst im frühen 20. Jahrhundert, im <strong>Zeitungsjournalismus</strong>, wurde daraus eine Zeitangabe: der Moment, ab dem ein Text nicht mehr ins Blatt kommt. Von dort wanderte das Wort in jede Bürowelt der Erde.</p>
<p>Die Bedeutungsverschiebung von Raum zu Zeit ist gut dokumentiert – der genaue Übergang aber nicht lückenlos belegt.</p>`,
cool:'Ein Wort, das heute Terminstress bedeutet, war einmal wörtlich die Linie zwischen Leben und Tod.',

id:'washington-dc', t:'Washington D.C.', emoji:'🏛️', cat:'geschichte',
teaser:'Die Hauptstadt der USA liegt dort, wo sie liegt, wegen eines Deals beim Abendessen.',
story:`<p>1790 stand die junge USA vor zwei ungelösten Streitfragen. Erstens: Sollte der Bund die <strong>Kriegsschulden der Einzelstaaten</strong> übernehmen? Die Nordstaaten wollten das dringend, die Südstaaten – die ihre Schulden schon bezahlt hatten – strikt nicht. Zweitens: <strong>Wo</strong> sollte die dauerhafte Hauptstadt liegen?</p>
<h4>Das Dinner</h4>
<p>Im Juni 1790 lud <strong>Thomas Jefferson</strong> nach eigener Darstellung <strong>Alexander Hamilton</strong> und <strong>James Madison</strong> zum Essen ein. Das Ergebnis ging als <em>Compromise of 1790</em> in die Geschichte: Hamilton bekam seine Schuldenübernahme – und der Süden bekam die Hauptstadt, gelegen am Potomac, direkt an der Grenze zu Virginia und Maryland.</p>
<p>Genau dieses Abendessen ist im Musical „Hamilton“ das Lied „The Room Where It Happens“.</p>
<h4>Und der Name?</h4>
<p><strong>Washington</strong> nach dem ersten Präsidenten. <strong>D.C.</strong> steht für <em>District of Columbia</em> – „Columbia“ war im 18. Jahrhundert der poetische Name für Amerika, abgeleitet von Kolumbus.</p>
<p>Der Bundesdistrikt gehört bewusst zu keinem Bundesstaat, damit kein Einzelstaat Macht über die Bundesregierung hat. Der Preis: Die rund 670.000 Einwohner haben bis heute <strong>keine stimmberechtigte Vertretung im Senat</strong>. Auf den Autokennzeichen steht deshalb der Protestspruch „Taxation Without Representation“.</p>`,

id:'sicherheitsgurt', t:'Der Dreipunktgurt', emoji:'🚗', cat:'geschichte',
teaser:'Volvo hatte das Patent auf die vielleicht wirksamste Sicherheitserfindung des 20. Jahrhunderts – und verschenkte es.',
story:`<p>Autos hatten in den 1950ern Beckengurte, wenn überhaupt. Die waren bei Unfällen teils schlimmer als nichts: Der Oberkörper klappte nach vorn, innere Verletzungen waren häufig.</p>
<h4>Der Ingenieur</h4>
<p><strong>Nils Bohlin</strong> kam von <strong>Saab</strong>, wo er an Schleudersitzen für Kampfflugzeuge gearbeitet hatte. Dort war klar: Ein Körper muss an <strong>Schulter und Becken gleichzeitig</strong> gehalten werden. Bei Piloten durfte die Konstruktion kompliziert sein – bei Autofahrern nicht.</p>
<p>Bohlins Lösung von 1959: ein V-förmiger Gurt, der Becken und Brustkorb sichert und sich <strong>mit einer Hand</strong> schließen lässt. Volvo führte ihn im selben Jahr serienmäßig ein – als erster Hersteller der Welt.</p>
<h4>Die Entscheidung</h4>
<p>Volvo entschied, das Patent <strong>offen zugänglich</strong> zu machen: Jeder Hersteller durfte es kostenlos nutzen. Die Begründung war, dass der Nutzen für Menschenleben größer sei als der Wettbewerbsvorteil.</p>
<p>Schätzungen gehen von über einer Million geretteter Leben aus. Bohlin wurde später in die amerikanische National Inventors Hall of Fame aufgenommen.</p>
<p>In Deutschland wurde die Anschnallpflicht auf den Vordersitzen erst <strong>1976</strong> eingeführt – und ein Bußgeld dafür gab es sogar erst ab 1984.</p>`,

id:'richterrobe', t:'Warum Richter schwarz tragen', emoji:'⚖️', cat:'geschichte',
teaser:'Die schwarze Robe ist möglicherweise nur eine Trauerkleidung, die niemand mehr abgelegt hat.',
story:`<p>Englische Richter trugen im Mittelalter <strong>farbige</strong> Roben – rot, violett, grün – je nach Anlass und Jahreszeit. Schwarz war nur eine Option unter vielen.</p>
<h4>1694</h4>
<p>Königin <strong>Mary II.</strong> starb an den Pocken. Für die Staatstrauer legten Richter schwarze Roben an. Die verbreitete Erklärung lautet: Sie haben sie danach schlicht <strong>nie wieder ausgezogen</strong>.</p>
<p>Diese Version wird oft erzählt und ist plausibel – aber Historiker weisen darauf hin, dass Schwarz auch vorher schon üblich war und der Wandel eher schleichend verlief. Es ist eine gute Geschichte mit unscharfen Rändern.</p>
<h4>Der eigentliche Punkt der Robe</h4>
<p>Amtstracht hat eine klare Funktion: Sie <strong>löscht die Person</strong>. Wer eine Robe trägt, tritt nicht als Individuum auf, sondern als Institution. Keine Modeaussage, kein Statussignal, kein Rückschluss auf Einkommen oder Geschmack.</p>
<p>Die englischen Perücken haben dieselbe Logik – sie kamen im 17. Jahrhundert schlicht als Hofmode und blieben dann als Symbol hängen. In England wurden sie in Zivilverfahren erst <strong>2008</strong> weitgehend abgeschafft.</p>
<p>In Deutschland ist die Robe übrigens nicht bundesweit einheitlich geregelt – Details wie Farbe der Besätze unterscheiden sich je nach Gericht und Land.</p>`,

id:'napoleon-groesse', t:'Napoleon war nicht klein', emoji:'📏', cat:'geschichte',
teaser:'Der berühmteste Minderwertigkeitskomplex der Geschichte beruht auf einem Umrechnungsfehler.',
story:`<p>„Napoleon-Komplex“ ist ein feststehender Begriff. Nur: Napoleon war nicht klein.</p>
<h4>Der Messfehler</h4>
<p>Bei seinem Tod 1821 wurde er mit <strong>5 Fuß 2 Zoll</strong> vermessen. In britischen Maßen wären das etwa 1,57 m – winzig. Gemessen wurde aber in <strong>französischen Maßen</strong>, und der französische Zoll (<em>pouce</em>) war größer als der englische.</p>
<p>Umgerechnet ergibt das rund <strong>1,68 bis 1,69 m</strong>. Für einen Franzosen dieser Zeit war das durchschnittlich bis leicht überdurchschnittlich.</p>
<h4>Warum es sich trotzdem festsetzte</h4>
<p><strong>Erstens Propaganda:</strong> Der britische Karikaturist <strong>James Gillray</strong> zeichnete ihn jahrelang als „Little Boney“ – ein zappelndes Männchen. Diese Bilder waren in ganz Europa bekannt und prägten das Bild dauerhaft.</p>
<p><strong>Zweitens sein Umfeld:</strong> Napoleon war fast immer von den Grenadieren seiner Garde umgeben, für die es <strong>Mindestgrößen</strong> gab. Neben ausgesuchten Zwei-Meter-Männern wirkt jeder klein.</p>
<p><strong>Drittens sein Spitzname:</strong> „le petit caporal“, der kleine Korporal, war ein <strong>Kosename der Soldaten</strong> – gemeint war Zuneigung, nicht Körpergröße.</p>`,

id:'kalender-luecke', t:'Die elf Tage, die es nie gab', emoji:'📅', cat:'geschichte',
teaser:'Im September 1752 folgte auf den 2. direkt der 14. – und niemand konnte etwas dagegen tun.',
story:`<p>Der julianische Kalender war minimal zu lang: rund <strong>11 Minuten pro Jahr</strong>. Über Jahrhunderte summierte sich das, und der kalendarische Frühlingsanfang wanderte langsam vom astronomischen weg – ein Problem, weil davon das Osterdatum abhängt.</p>
<h4>1582</h4>
<p>Papst Gregor XIII. reformierte den Kalender: Zehn Tage wurden gestrichen, und die Schaltjahrregel wurde verfeinert (durch 100 teilbare Jahre sind keine Schaltjahre – außer sie sind durch 400 teilbar; deshalb war 2000 eines und 1900 nicht).</p>
<h4>Aber nicht alle machten mit</h4>
<p>Katholische Länder stellten sofort um. <strong>Protestantische und orthodoxe</strong> lehnten eine päpstliche Reform ab – teils über Jahrhunderte. Das protestantische Deutschland zog erst <strong>1700</strong> nach, Großbritannien <strong>1752</strong> (da fehlten schon elf Tage), Russland erst <strong>1918</strong>.</p>
<p>Das führt zu einem Kuriosum: Die russische „Oktoberrevolution“ fand nach unserem Kalender im <strong>November</strong> statt.</p>
<h4>Und die Aufstände?</h4>
<p>Die Erzählung, Menschen seien 1752 mit dem Ruf „Gebt uns unsere elf Tage zurück!“ auf die Straße gegangen, geht vor allem auf ein Gemälde von William Hogarth zurück – es zeigt ein Wahlkampfbanner mit diesem Spruch. Historiker halten flächendeckende Unruhen für <strong>stark übertrieben</strong>. Es gab allerdings sehr reale Streitigkeiten über Mieten, Löhne und Zinsen für die fehlenden Tage.</p>`,

id:'september-monat', t:'Warum September der 9. Monat ist', emoji:'🗓️', cat:'geschichte',
teaser:'September heißt „der siebte“. Und das war mal richtig.',
story:`<p>Septem = sieben. Octo = acht. Novem = neun. Decem = zehn. Die letzten vier Monatsnamen zählen also konsequent <strong>zwei zu niedrig</strong>.</p>
<h4>Der Grund</h4>
<p>Der römische Kalender begann ursprünglich im <strong>März</strong>. Das ergab Sinn: Frühling, Beginn der Feldarbeit und – wichtiger – Beginn der Feldzugssaison. Der Winter war so uninteressant, dass die ältesten römischen Kalender ihn schlicht <strong>gar nicht durchzählten</strong>: Nach dem Dezember kam eine namenlose Winterperiode von rund 60 Tagen.</p>
<p>Später wurden Januar und Februar eingeführt und irgendwann an den Anfang gesetzt. Die Zählnamen der hinteren Monate blieben – und stimmen seither nicht mehr.</p>
<h4>Die anderen Monate</h4>
<p><strong>Januar</strong> nach Janus, dem Gott mit zwei Gesichtern, der zurück und nach vorn schaut. <strong>März</strong> nach Mars. <strong>Juli</strong> und <strong>August</strong> nach Julius Caesar und Kaiser Augustus – vorher hießen sie Quintilis und Sextilis, also „der fünfte“ und „der sechste“.</p>
<p>Die hartnäckige Geschichte, Augustus habe dem Februar einen Tag geklaut, damit sein Monat genauso lang ist wie Caesars, gilt heute als <strong>Legende</strong> aus dem 13. Jahrhundert. Die ungleichen Monatslängen sind älter.</p>`,
cool:'Wir benutzen jeden Tag Namen, die auf eine Kalenderordnung verweisen, die es seit über 2000 Jahren nicht mehr gibt.',
gold:'September heißt „der siebte“, weil das römische Jahr im März begann – und der Winter anfangs gar nicht mitgezählt wurde.',

id:'zeitzonen', t:'Warum es Zeitzonen gibt', emoji:'🕰️', cat:'geschichte',
teaser:'Bis ins 19. Jahrhundert hatte jede Stadt ihre eigene Uhrzeit. Erst die Eisenbahn beendete das.',
story:`<p>Vor der Eisenbahn richtete sich die Uhr nach der Sonne: Mittag war, wenn die Sonne am höchsten stand. Das ist in Frankfurt ein paar Minuten anders als in Köln. Solange man mit der Kutsche reiste, war das <strong>vollkommen egal</strong>.</p>
<h4>Dann kamen Züge</h4>
<p>Ein Fahrplan über mehrere Städte ist unmöglich, wenn jede Station eine andere Zeit hat. Schlimmer: Auf eingleisigen Strecken hingen <strong>Menschenleben</strong> davon ab, dass zwei Züge dieselbe Uhr benutzten.</p>
<p>Britische Bahngesellschaften führten ab 1840 die <strong>„Railway Time“</strong> ein – für alle Stationen die Zeit von Greenwich. Manche Bahnhofsuhren hatten eine Zeit lang zwei Minutenzeiger: einen für die lokale, einen für die Bahnzeit.</p>
<h4>Der weltweite Beschluss</h4>
<p>1884 einigten sich Delegierte aus 25 Ländern auf der <strong>International Meridian Conference</strong> in Washington auf Greenwich als Nullmeridian – nicht aus Sympathie für Großbritannien, sondern weil bereits rund zwei Drittel aller Seekarten der Welt darauf basierten. Frankreich enthielt sich und benutzte noch bis 1911 den Pariser Meridian.</p>
<p>Deutschland führte eine einheitliche Zeit erst <strong>1893</strong> ein – zuvor gab es fünf verschiedene Bahnzeiten im Reich.</p>`,

teaser:'26. September 1983: Ein sowjetischer Offizier entscheidet gegen sein eigenes System – und behält recht.',
story:`<p>Kurz nach Mitternacht, sowjetisches Frühwarnzentrum Serpuchow-15. Oberstleutnant <strong>Stanislaw Petrow</strong> hat Dienst. Das Satellitensystem Oko meldet: <strong>Eine amerikanische Interkontinentalrakete im Anflug.</strong> Kurz darauf: eine zweite. Dritte. Vierte. Fünfte.</p>
<h4>Die Lage</h4>
<p>Die Beziehungen waren auf einem Tiefpunkt – drei Wochen zuvor hatte die Sowjetunion ein koreanisches Passagierflugzeug abgeschossen. Petrows Aufgabe war klar definiert: melden. Die Doktrin sah einen Gegenschlag vor.</p>
<h4>Warum er es nicht tat</h4>
<p>Petrow hatte einen Verdacht. Ein echter amerikanischer Erstschlag hätte aus <strong>hunderten</strong> Raketen bestanden, nicht aus fünf. Und die Bodenradarstationen bestätigten nichts. Er meldete: <strong>Fehlalarm.</strong> Und wartete – in dem Wissen, dass er innerhalb von Minuten wissen würde, ob er sich geirrt hatte.</p>
<p>Es war ein Fehlalarm. Sonnenlicht hatte sich in großer Höhe an Wolkenoberkanten gespiegelt und das Satellitensystem getäuscht.</p>
<h4>Der Dank</h4>
<p>Petrow wurde nicht ausgezeichnet. Es hätte bedeutet, den Konstrukteuren des Systems Versagen zu bescheinigen. Er wurde versetzt, ging früh in Pension und lebte lange unbeachtet in einem Vorort von Moskau. Erst in den 1990ern wurde der Fall öffentlich.</p>
<p>Er selbst sagte später sinngemäß, er habe nur seine Arbeit gemacht – und er sei ohnehin der Einzige im Team mit Zivilausbildung gewesen. Die anderen, sagte er, wären reine Soldaten gewesen und hätten die Meldung weitergegeben.</p>`,
