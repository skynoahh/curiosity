story:`<p>Die Version, die man überall liest: Beim Färben mit <strong>Waid</strong> (der europäischen Indigopflanze) mussten die gefärbten Stoffe an der Luft liegen, um durch Oxidation blau zu werden. Währenddessen hatten die Färber nichts zu tun – sie „machten blau“. Und weil im Färberbottich <strong>Urin</strong> als Reduktionsmittel diente, den man durch reichlich Bierkonsum beschaffte, saßen sie dabei angeblich in der Kneipe.</p>

<p>Sprachhistoriker halten diese Herleitung überwiegend für eine <strong>nachträgliche Volksetymologie</strong> – zu gut, um wahr zu sein. Sie taucht in der Fachliteratur spät auf.</p>
<h4>Die wahrscheinlichere Spur</h4>
<p>Sehr viel besser belegt ist der <strong>„blaue Montag“</strong>. Der Montag war in vielen Handwerkszünften traditionell arbeitsfrei oder wurde es faktisch, weil die Gesellen am Sonntag gefeiert hatten. Die Kirche färbte in der Fastenzeit die Altartücher blau – manche Quellen bringen das mit dem Begriff in Verbindung.</p>
<p>Und „blau sein“ für betrunken existiert seit Langem parallel; die Bedeutungen haben sich vermutlich gegenseitig verstärkt.</p>
<p>Fazit: Die Färber-Geschichte ist eine großartige Geschichte, aber man sollte sie als solche erzählen – <strong>nicht als Fakt</strong>.</p>`,

story:`<p><strong>27. August 1896</strong>, Sansibar. Der britisch gestützte Sultan war gestorben; sein Neffe <strong>Khalid bin Barghash</strong> ergriff die Macht – ohne die von den Briten geforderte Zustimmung.</p>

teaser:'Und warum sich derselbe Urlaub im Rückblick trotzdem lang anfühlt.',
story:`<p>Das nennt man das <strong>Ferien-Paradox</strong> (holiday paradox), beschrieben unter anderem von der Psychologin Claudia Hammond.</p>
<h4>Zwei verschiedene Uhren</h4>
<p>Unser Zeitgefühl arbeitet mit zwei völlig unterschiedlichen Systemen:</p>
<p><strong>Im Moment</strong> misst das Gehirn Zeit über Aufmerksamkeit. Wenn viel passiert und wir intensiv beschäftigt sind, achten wir nicht auf die Uhr – die Zeit „rast“.</p>
<p><strong>Im Rückblick</strong> schätzt das Gehirn Zeit über die <strong>Menge neuer Erinnerungen</strong>. Und ein Urlaub produziert davon extrem viele: neue Orte, neue Gerüche, neue Gesichter, keine Routine.</p>
<h4>Deshalb der Widerspruch</h4>
<p>Eine Woche Urlaub vergeht gefühlt in einem Wimpernschlag – und wirkt zwei Wochen später trotzdem wie ein halber Monat. Eine Woche im gewohnten Büro ist genau umgekehrt: zäh im Erleben, im Rückblick praktisch nicht vorhanden.</p>
<h4>Und der Trick daraus</h4>
<p>Das erklärt auch, warum die Jahre mit dem Alter „schneller“ werden: weniger erste Male, mehr Routine, weniger Erinnerungsmarker. Wer subjektiv längere Jahre will, muss nicht mehr Zeit haben, sondern <strong>mehr Neues</strong>. Ein anderer Weg zur Arbeit reicht schon.</p>
<p>Ein Randbefund passt dazu: Menschen überschätzen bei einem Unfall oder Sturz die vergangene Zeit deutlich. Nicht, weil sie in Zeitlupe wahrnehmen, sondern weil sie in Extremsituationen dichter erinnern.</p>`,

story:`<p>Du stehst in der Küche und hast keine Ahnung mehr, warum. Das ist kein Anzeichen von Vergesslichkeit, sondern ein gut untersuchter Effekt: der <strong>doorway effect</strong> oder <em>location updating effect</em>.</p>

<p>Der Psychologe <strong>Gabriel Radvansky</strong> hat das in Versuchen mit realen und virtuellen Räumen gezeigt: Menschen vergessen kurz zuvor gemerkte Objekte deutlich häufiger, nachdem sie durch eine Tür gegangen sind – selbst wenn die Entfernung gleich bleibt.</p>

<p>Absichten, die noch nicht ausgeführt sind, gehören zum alten Kapitel – und rutschen mit weg.</p>
<h4>Warum es zurückkommt</h4>
<p>Deshalb funktioniert der klassische Trick: <strong>Zurück in den ursprünglichen Raum gehen.</strong> Der Kontext, in dem die Absicht entstand, ist der beste Abrufreiz – dasselbe Prinzip, aus dem man in derselben Umgebung besser abruft, in der man gelernt hat.</p>

story:`<p>Fachbegriff: <strong>involuntary musical imagery</strong>, kurz INMI. Rund 90 % der Menschen erleben das mindestens wöchentlich.</p>
<h4>Was Ohrwurm-Songs gemeinsam haben</h4>

teaser:'Du hast wahrscheinlich beim Lesen dieser Zeile schon dran gedacht. Genau das ist der Punkt.',
story:`<p>Gähnen ist eines der ansteckendsten Verhalten überhaupt. Es genügt, jemanden gähnen zu <strong>sehen</strong>, zu <strong>hören</strong>, davon zu <strong>lesen</strong> oder daran zu denken.</p>

<p>Ein Alltagsverhalten, das jeder Mensch täglich zeigt – und dessen Zweck die Wissenschaft bis heute diskutiert.</p>`,

story:`<p>Nachts fällt einem eine Peinlichkeit von 2013 ein, und der ganze Körper zuckt. Warum bleibt ausgerechnet das?</p>
<h4>Drei Mechanismen greifen ineinander</h4>
<p><strong>1. Emotionale Verstärkung.</strong> Bei starker Emotion ist die Amygdala aktiv und markiert Erinnerungen als wichtig. Peinlichkeit ist sozialer Stress – für ein Wesen, dessen Überleben jahrtausendelang an Gruppenzugehörigkeit hing, ein <strong>Alarmsignal</strong>.</p>
<p><strong>2. Unabgeschlossenheit.</strong> Peinliche Situationen fühlen sich selten „erledigt“ an. Nach dem <strong>Zeigarnik-Effekt</strong> bleiben unabgeschlossene Dinge präsenter. Man hat nie erfahren, ob es wirklich schlimm war – also bleibt die Akte offen.</p>
<p><strong>3. Wiederholung.</strong> Jedes Mal, wenn man daran denkt, ruft man die Erinnerung ab. Und Abruf ist die effektivste Methode, etwas zu festigen. Man trainiert die Erinnerung buchstäblich.</p>
<h4>Der tröstliche Teil</h4>
<p>Der <strong>Spotlight-Effekt</strong> (Gilovich, Medvec &amp; Savitsky, 1999) ist gut belegt: Menschen überschätzen systematisch, wie stark andere ihr Verhalten und Aussehen bemerken. In den Versuchen mussten Studierende ein peinliches T-Shirt tragen und schätzten anschließend, wie viele es bemerkt hatten – sie lagen etwa <strong>doppelt so hoch</strong> wie die Realität.</p>
<p>Und bei fremder Peinlichkeit greift ein anderer Mechanismus: Wir simulieren die Situation innerlich mit. Deshalb ist Fremdscham körperlich fast so unangenehm wie eigene.</p>`,

teaser:'Der Geruchssinn nimmt eine Abkürzung, die kein anderer Sinn hat.',
story:`<p>Ein Geruch aus der Kindheit – und plötzlich ist die ganze Szene da, samt Gefühl. Bei einem Foto passiert das selten so unmittelbar. Das hat eine anatomische Ursache.</p>
<h4>Die Abkürzung</h4>
<p>Sehen, Hören, Tasten und Schmecken laufen zuerst über den <strong>Thalamus</strong> – eine Art Verteilerstation, die filtert und weiterleitet.</p>
<p>Der Geruchssinn nicht. Signale vom Riechkolben gehen <strong>direkt</strong> in Bereiche des limbischen Systems: unter anderem zur <strong>Amygdala</strong> (Emotion) und zum <strong>Hippocampus</strong> (Gedächtnis). Ein Geruch trifft also Gefühl und Erinnerung, bevor er überhaupt bewusst benannt wird.</p>
<p>Deshalb der typische Ablauf: erst das Gefühl, dann das Bild – und erst zuletzt fällt einem ein, wonach es eigentlich riecht.</p>
<h4>Der Proust-Effekt</h4>
<p>Benannt nach der berühmten Szene bei Marcel Proust, in der ein in Tee getauchtes Madeleine-Gebäck eine ganze Kindheitswelt aufblättert.</p>
<p>Was Studien zusätzlich zeigen: Geruchsausgelöste Erinnerungen stammen überdurchschnittlich häufig aus den <strong>ersten zehn Lebensjahren</strong> – anders als Erinnerungen, die durch Wörter oder Bilder ausgelöst werden. Vermutlich, weil in dieser Zeit besonders viele Gerüche zum ersten Mal erlebt und daher besonders eindeutig verknüpft wurden.</p>
<p>Ein zweiter Grund: Anders als Bilder oder Musik begegnen einem bestimmte Gerüche <strong>jahrzehntelang gar nicht</strong>. Die Verknüpfung wird also nie überschrieben.</p>`,

teaser:'Du hörst deinen Namen quer durch einen lauten Raum. Wie geht das, wenn du gar nicht zugehört hast?',
story:`<p>Auf einer lauten Party konzentrierst du dich auf ein Gespräch und blendest den Rest aus. Aber wenn irgendwo dein <strong>Name</strong> fällt, hörst du ihn sofort.</p>
<p>Das ist paradox: Wenn du den Rest wirklich ausgeblendet hättest, hättest du den Namen nicht bemerken können.</p>
<h4>Was das bedeutet</h4>
<p>Der Kognitionsforscher <strong>Colin Cherry</strong> untersuchte das ab 1953 mit Kopfhörerexperimenten: links eine Stimme, rechts eine andere, Aufgabe war, eine davon nachzusprechen. Vom ignorierten Kanal konnten Testpersonen fast nichts wiedergeben – aber ein Wechsel der Sprache oder ein plötzlicher Ton fiel auf.</p>
<p><strong>Anne Treisman</strong> ergänzte das Modell: Der ignorierte Kanal wird nicht abgeschaltet, sondern nur <strong>abgeschwächt</strong>. Er läuft im Hintergrund weiter und wird flach auf Bedeutung geprüft. Reize mit sehr niedriger „Auslöseschwelle“ kommen durch – der eigene Name ist der Klassiker, ebenso Wörter wie „Feuer“ oder der Name des eigenen Kindes.</p>
<h4>Die praktische Seite</h4>
<p>Das Ganze ist auch ein akustisches Meisterstück: Das Gehirn trennt Stimmen mithilfe minimaler Laufzeitunterschiede zwischen beiden Ohren. Deshalb ist Sprachverstehen im Störgeräusch für Menschen mit einseitiger Hörminderung so viel schwerer – und deshalb ist es bis heute eine der härtesten Aufgaben für Hörgeräte und Spracherkennung.</p>`,

teaser:'Der Musikgeschmack friert ungefähr mit Anfang 20 ein. Dafür gibt es einen Namen.',
story:`<p>Frag Menschen nach ihren Lieblingsliedern, und ein Muster erscheint zuverlässig: Die meisten stammen aus der Zeit zwischen etwa <strong>14 und 24 Jahren</strong>.</p>
<h4>Der Reminiszenz-Höcker</h4>
<p>In der Gedächtnisforschung ist der <em>reminiscence bump</em> gut belegt: Bittet man ältere Menschen, Erinnerungen aus ihrem ganzen Leben zu erzählen, häufen sich diese auffällig in der Jugend und im frühen Erwachsenenalter – unabhängig davon, wie alt die Person heute ist.</p>
<p>Erklärungen, die diskutiert werden: In dieser Phase passiert extrem viel <strong>zum ersten Mal</strong>. Und es ist die Zeit, in der man sein Selbstbild formt – Erlebnisse, die zur eigenen Identität gehören, werden besser gespeichert.</p>
<h4>Bei Musik kommt etwas dazu</h4>
<p>Musik in der Jugend ist selten nur Musik. Sie ist mit Freundschaften, ersten Verliebtheiten, Zugehörigkeit zu einer Gruppe verknüpft. Sie ist <strong>emotional aufgeladen</strong> und wurde in der Regel sehr oft gehört.</p>
<p>Auswertungen von Streamingdaten (unter anderem eine viel zitierte Analyse von Spotify-Daten durch Ajay Kalia) zeigen, dass der Konsum aktueller Charts bei den meisten Menschen ab Anfang 30 deutlich abnimmt – bei Eltern noch stärker.</p>
<h4>Der Effekt in echt</h4>
<p>Deshalb funktionieren Hochzeiten und Firmenfeiern musikalisch nach dem Alter der Gäste. Und deshalb klingt „die Musik von früher“ für jede Generation objektiv besser – aus einem Grund, der gar nichts mit Musik zu tun hat.</p>`,
cool:'Jede Generation hält ihre Jugendmusik für die beste – und zwar nicht aus Nostalgie-Kitsch, sondern weil das Gehirn diese Jahre nachweislich anders speichert.',
gold:'Der Musikgeschmack prägt sich zwischen 14 und 24 ein – Erinnerungen aus dieser Zeit werden generell stärker gespeichert („reminiscence bump“).',
perfect:'Party / Bar',

src:'Rubin, Wetzler & Nebes zum reminiscence bump; Analyse von Streamingdaten (Kalia, 2015)',

{
id:'ikea-effekt', t:'Der IKEA-Effekt', emoji:'🔧', cat:'psycho',
teaser:'Warum du das schiefe Regal liebst, das du selbst zusammengeschraubt hast.',
story:`<p>Der Verhaltensökonom <strong>Dan Ariely</strong> und Kollegen zeigten in einer Reihe von Experimenten: Menschen bewerten Dinge, die sie <strong>selbst zusammengebaut</strong> haben, deutlich höher als identische Fertigprodukte – und sind bereit, dafür mehr zu zahlen.</p>
<p>Getestet wurde mit IKEA-Boxen, Origami und Lego. Bei Origami war der Effekt besonders drollig: Die Bastler hielten ihre schiefen Kraniche für fast so wertvoll wie die eines Experten. Unbeteiligte Betrachter fanden sie deutlich schlechter.</p>
<h4>Die Bedingung</h4>
<p>Der Effekt hat eine Grenze: Er verschwindet, wenn die Aufgabe <strong>nicht abgeschlossen</strong> wird. Wer den Bausatz halb fertig aufgeben muss, hängt nicht daran. Es geht also nicht um Mühe an sich, sondern um <strong>erfolgreich beendete</strong> Mühe.</p>
<h4>Der historische Vorläufer</h4>
<p>In den 1950ern verkauften sich Backmischungen in den USA schlecht, obwohl sie perfekt funktionierten – man musste nur Wasser zugeben. Die Branche reagierte, indem sie <strong>Ei und Milch aus der Mischung nahm</strong>, sodass die Backenden sie selbst zugeben mussten. Der Absatz stieg.</p>
<p>Diese Geschichte wird oft psychoanalytisch überhöht erzählt; belegbar ist vor allem, dass der Wechsel zu „Ei selbst zugeben“ stattfand und der Markt danach wuchs.</p>
<h4>Warum das überall auftaucht</h4>
<p>Selbstkonfigurierte Sneaker, personalisierte Möbel, Software mit Einrichtungsassistenten: Wer investiert, bindet sich. Der Aufwand ist Teil des Produkts.</p>`,
cool:'Unternehmen bauen absichtlich Arbeit in Produkte ein, weil Menschen genau das lieben, was sie selbst mühsam fertiggestellt haben.',

{
id:'kitzeln', t:'Warum man sich nicht selbst kitzeln kann', emoji:'🤣', cat:'psycho',
teaser:'Dein Gehirn sagt dir voraus, was du gleich fühlen wirst – und zieht es dann ab.',
story:`<p>Probier es: Man kann sich selbst nicht kitzeln. Praktisch niemand kann das. Der Grund ist ein Grundprinzip der Gehirnfunktion.</p>
<h4>Vorhersage statt Wahrnehmung</h4>
<p>Bevor du eine Bewegung ausführst, schickt das Gehirn ein Kopie des Bewegungsbefehls an andere Areale – eine <strong>Efferenzkopie</strong>. Damit sagt es voraus, welche Sinnesreize gleich entstehen werden.</p>
<p>Trifft die Vorhersage zu, wird der tatsächliche Reiz <strong>abgeschwächt</strong>. Selbst erzeugte Berührung fühlt sich messbar schwächer an als identische Fremdberührung.</p>
<p><strong>Sarah-Jayne Blakemore</strong> und Kollegen haben das am University College London elegant getestet: mit einem Roboterarm, der die eigene Handbewegung überträgt. Baute man eine <strong>Verzögerung von etwa 200 Millisekunden</strong> ein, wurde es plötzlich kitzelig – obwohl die Person sich noch immer selbst kitzelte.</p>
<h4>Warum das Sinn ergibt</h4>
<p>Das System dient dazu, Eigenes von Fremdem zu trennen. Ohne es wäre jede eigene Bewegung eine Reizflut. Und es erklärt, warum die eigene Stimme aufgenommen so fremd klingt – im Kopf hörst du sie nie „roh“.</p>
<p>Das Kleinhirn spielt dabei eine zentrale Rolle. Interessant für die Forschung: Bei manchen Menschen mit Psychose-Erfahrungen ist diese Dämpfung verändert – ein Ansatz, um zu verstehen, warum eigene Gedanken als fremd erlebt werden können.</p>`,
cool:'Ein alberner Kindheitstest führt direkt zu der Frage, wie das Gehirn überhaupt zwischen „ich“ und „nicht ich“ unterscheidet.',
gold:'Man kann sich nicht selbst kitzeln, weil das Gehirn selbst erzeugte Reize vorhersagt und dämpft – mit 200 ms Verzögerung funktioniert es plötzlich doch.',
perfect:'Party / Small Talk',

src:'Blakemore, Wolpert & Frith, „Central cancellation of self-produced tickle sensation“ (1998)',

{
id:'gruen-effekt', t:'Warum du im Supermarkt mehr kaufst', emoji:'🛒', cat:'psycho',
teaser:'Der Grundriss deines Supermarkts ist kein Zufall. Fast nichts daran ist Zufall.',
story:`<p>Der österreichische Architekt <strong>Victor Gruen</strong> erfand in den 1950ern in den USA das moderne Einkaufszentrum. Ironischerweise als <strong>sozialutopisches Projekt</strong>: Er wollte europäische Stadtplätze in autozentrierte US-Vororte bringen – Orte zum Verweilen, mit Kunst, Grün und Gemeinschaft.</p>
<p>Was daraus wurde, hasste er. Kurz vor seinem Tod distanzierte er sich öffentlich von den „Bastarden“, die aus seiner Idee entstanden seien.</p>
<h4>Der Effekt, der seinen Namen trägt</h4>
<p>Der <strong>Gruen-Effekt</strong> beschreibt den Moment, in dem ein zielgerichteter Kunde – „ich brauche nur Milch“ – die Orientierung verliert und zum <strong>ziellosen Schlenderer</strong> wird. Erzeugt wird er durch Reizüberflutung, fehlende Fenster und Uhren, verschachtelte Wege.</p>
<h4>Der Rest ist Handwerk</h4>
<p>Obst und Gemüse stehen vorn, weil frische Farben und Gerüche eine positive Stimmung erzeugen. Grundnahrungsmittel wie Milch und Brot liegen ganz hinten, damit man den Laden durchquert. Teure Marken stehen auf Augenhöhe, günstige unten – Regalplatz wird zwischen Händler und Hersteller verhandelt. Süßigkeiten an der Kasse zielen auf den Moment, in dem die Selbstkontrolle nach dem Einkauf am schwächsten ist.</p>
<p>Ehrlicherweise: Nicht jede dieser Regeln ist experimentell hart belegt, viele stammen aus der Handelspraxis. Der Effekt der <strong>Blickhöhe</strong> auf Verkaufszahlen ist aber gut dokumentiert.</p>`,
cool:'Der Erfinder des Einkaufszentrums wollte eigentlich das Gegenteil – und hat sich am Ende von seinem eigenen Werk losgesagt.',
gold:'Der „Gruen-Effekt“ ist der Moment, in dem man vom zielgerichteten Käufer zum Schlenderer wird – benannt nach dem Architekten, der die Mall erfand und später bereute.',
perfect:'Small Talk / Einkauf',

{
id:'gaensehaut', t:'Gänsehaut', emoji:'🐔', cat:'psycho',
teaser:'Ein Reflex für ein Fell, das wir seit ein paar Millionen Jahren nicht mehr haben.',
story:`<p>Bei Kälte oder starker Emotion ziehen sich winzige Muskeln an der Haarwurzel zusammen – die <em>Musculi arrectores pilorum</em>. Das Haar stellt sich auf, die Haut wirft Höcker.</p>
<h4>Wozu das gut war</h4>
<p>Bei behaarten Säugetieren hat das zwei Funktionen: Aufgestelltes Fell schließt <strong>mehr Luft ein</strong> und isoliert besser. Und ein Tier mit aufgestelltem Fell wirkt <strong>größer</strong> – siehe die Katze am Buckel.</p>
<p>Beim Menschen funktioniert beides nicht mehr. Wir haben nicht genug Haare. Der Reflex ist geblieben, seine Wirkung nicht: ein klassisches <strong>Rudiment</strong>, wie der Blinddarmfortsatz oder die Ohrmuskeln, mit denen manche Menschen wackeln können.</p>
<h4>Und die Gänsehaut bei Musik?</h4>
<p>Dafür gibt es einen eigenen Begriff: <strong>Frisson</strong>. Sie tritt typischerweise auf, wenn eine <strong>Erwartung durchbrochen</strong> wird – ein unerwarteter Harmoniewechsel, ein plötzlicher Einsatz, eine Stimme, die aus dem Nichts kommt.</p>
<p>Untersuchungen deuten darauf hin, dass das mit Dopaminausschüttung einhergeht und dass Menschen sich darin stark unterscheiden: Ein erheblicher Teil erlebt Musik-Gänsehaut selten oder nie. Es korreliert unter anderem mit dem Persönlichkeitsmerkmal Offenheit für Erfahrungen.</p>
<h4>Ein Nachtrag aus der Forschung</h4>
<p>2020 zeigte ein Team der Harvard University, dass genau die Zellen, die für die Aufrichtung zuständig sind, auch an der Regulation von <strong>Haarfollikel-Stammzellen</strong> beteiligt sind. Der Reflex ist also vielleicht doch nicht ganz nutzlos – nur eben für etwas völlig anderes.</p>`,
cool:'Wir tragen einen Reflex mit uns herum, der für ein Fell gemacht ist, das wir nicht mehr haben – und der bei der richtigen Musik trotzdem auslöst.',
gold:'Gänsehaut ist ein Überbleibsel aus der Zeit mit Fell: Aufgestellte Haare isolieren besser und lassen größer wirken. Beim Menschen bringt es nichts mehr.',
perfect:'Small Talk / Party',
diff:'easy', mem:5, cert:'belegt',
src:'Shwartz et al., Harvard University, Cell (2020); Forschung zu musikalischem Frisson (Sachs, Salimpoor)',

id:'bluetooth', t:'Bluetooth', emoji:'🦷', cat:'tech',
teaser:'Benannt nach einem Wikingerkönig. Und das Logo besteht aus seinen Initialen in Runen.',
story:`<p>1996 saßen Vertreter von <strong>Intel, Ericsson und Nokia</strong> zusammen, um einen gemeinsamen Funkstandard für kurze Distanzen zu schaffen. Sie brauchten einen Arbeitsnamen.</p>
<h4>Der Vorschlag</h4>
<p><strong>Jim Kardach</strong> von Intel las damals ein Buch über Wikinger. Darin kam <strong>Harald Blauzahn</strong> vor – dänisch <em>Harald Blåtand</em>, König im 10. Jahrhundert. Seine historische Leistung: Er einte verfeindete dänische Stämme und brachte Teile Norwegens dazu.</p>
<p>Kardach fand die Analogie passend: ein Standard, der zerstrittene Technologien vereint. Als Arbeitsname. Der richtige Name sollte später kommen – „PAN“ oder „RadioWire“.</p>
<h4>Der Arbeitsname blieb</h4>
<p>Die Markenrechtsprüfung der Alternativen zog sich, der Launch stand an – und „Bluetooth“ war intern längst etabliert. Also blieb es.</p>
<h4>Das Logo</h4>
<p>Das Bluetooth-Symbol ist keine abstrakte Form. Es ist eine <strong>Bindrune</strong>: die beiden altnordischen Runen <strong>ᚼ (Hagall)</strong> und <strong>ᛒ (Bjarkan)</strong> übereinandergelegt – die Initialen von Harald Blåtand.</p>
<p>Und der Beiname? Vermutlich hatte der König tatsächlich einen dunkel verfärbten, toten Zahn.</p>`,
cool:'Milliarden Geräte tragen ein Symbol, das die Initialen eines dänischen Königs aus dem 10. Jahrhundert in Runenschrift sind.',

{
id:'google-name', t:'Google', emoji:'🔍', cat:'tech',
teaser:'Der Name ist ein Tippfehler. Und der ursprüngliche Name war deutlich schlechter.',
story:`<p>Das Projekt hieß zuerst <strong>BackRub</strong> – weil es Websites nach ihren <em>Backlinks</em> bewertete. Kein guter Markenname.</p>
<h4>Die Zahl</h4>
<p>1997 suchten Larry Page und Sergey Brin einen neuen Namen. Ein Kommilitone schlug <strong>„googol“</strong> vor – der mathematische Begriff für eine 1 mit hundert Nullen. Passend, weil die Suchmaschine unvorstellbar große Datenmengen ordnen sollte.</p>
<p>Das Wort „googol“ hatte übrigens 1920 der damals <strong>neunjährige Neffe</strong> des Mathematikers Edward Kasner erfunden, als der ihn nach einem Namen für diese Zahl fragte.</p>
<h4>Der Tippfehler</h4>
<p>Beim Prüfen der Domainverfügbarkeit wurde – so die überlieferte Version – <strong>„google.com“</strong> statt „googol.com“ eingegeben. Die war frei. Sie wurde am 15. September 1997 registriert.</p>
<h4>Der Nachklapp</h4>
<p>Das Wort ist inzwischen so verbreitet, dass es in Wörterbüchern als Verb steht. Für Google ist das ein rechtliches Risiko: Wird ein Markenname zum Gattungsbegriff, kann der Schutz verloren gehen – wie bei Aspirin, Fön oder Rollschuh. Google bittet Medien deshalb ausdrücklich, „im Internet suchen“ statt „googeln“ zu schreiben.</p>
<p>Und der Hauptsitz heißt <strong>Googleplex</strong> – ein Wortspiel mit „Googolplex“, einer 1 mit einer Googol Nullen.</p>`,
cool:'Der Name des größten Informationsunternehmens der Welt ist ein Rechtschreibfehler bei einem Wort, das ein Neunjähriger erfunden hat.',
gold:'Google heißt so wegen eines Tippfehlers: Gemeint war „Googol“, die Zahl mit hundert Nullen – erfunden von einem neunjährigen Jungen im Jahr 1920.',
perfect:'Small Talk / Büro',
diff:'easy', mem:5, cert:'wahrscheinlich',

{
id:'maus', t:'Die Computermaus', emoji:'🖱️', cat:'tech',
teaser:'Sie wurde 1968 in einer Demo vorgestellt, die heute „die Mutter aller Demos“ heißt – und der Erfinder verdiente daran nichts.',
story:`<p><strong>Douglas Engelbart</strong> baute Mitte der 1960er am Stanford Research Institute einen Holzkasten mit zwei senkrecht zueinander stehenden Rädern und einem Knopf.</p>
<h4>Der Name</h4>
<p>Das Kabel kam anfangs <strong>hinten</strong> heraus. Jemand im Labor sagte, das sehe aus wie eine Maus mit Schwanz. Engelbart selbst sagte später, niemand könne sich mehr erinnern, wer es zuerst gesagt habe – der Name sei einfach hängen geblieben. Später drehte man den Stecker nach vorn.</p>
<h4>Die Demo</h4>
<p>Am 9. Dezember 1968 zeigte Engelbart in San Francisco in 90 Minuten: die Maus, Fenster, Hypertext-Links, Videokonferenz, Bildschirmfreigabe, gemeinsames Bearbeiten von Dokumenten in Echtzeit. 1968. Vor dem Internet, vor dem PC.</p>
<p>Die Veranstaltung ging als <strong>„The Mother of All Demos“</strong> in die Geschichte ein. Das Publikum war fassungslos.</p>
<h4>Das Patent</h4>
<p>Engelbart erhielt 1970 ein Patent auf die Maus. Es lief <strong>1987 aus</strong> – kurz bevor grafische Oberflächen und damit Mäuse zum Massenprodukt wurden. Sein Institut soll für die Lizenz eine einmalige Summe im niedrigen fünfstelligen Bereich erhalten haben.</p>
<p>Engelbart selbst verdiente an einem der meistverkauften Computerzubehörteile der Geschichte praktisch nichts.</p>`,
cool:'Ein Mann zeigte 1968 in 90 Minuten fast alles, was Computer heute ausmacht – und sein Patent lief genau dann aus, als die Welt es endlich brauchte.',
gold:'Die Maus heißt so, weil das Kabel anfangs hinten herauskam wie ein Schwanz. Ihr Patent lief 1987 aus – bevor Mäuse zum Massenprodukt wurden.',
perfect:'Büro / Small Talk',
diff:'interesting', mem:5, cert:'belegt',
src:'Doug Engelbart Institute; Aufzeichnung der Demo vom 9.12.1968',

{
id:'usb-stecker', t:'Warum USB-Stecker nerven', emoji:'🔌', cat:'tech',
teaser:'Das Problem war bekannt. Es wurde bewusst in Kauf genommen.',
story:`<p>Jeder kennt es: USB-A passt nicht, umdrehen, passt immer noch nicht, wieder umdrehen, passt. Das ist keine Einbildung – die Form ist symmetrisch genug, um im ersten Moment falsch zu wirken, und der Stecker gibt kein taktiles Feedback über die richtige Lage.</p>
<h4>Es war eine Entscheidung</h4>
<p><strong>Ajay Bhatt</strong>, einer der Entwickler bei Intel, hat das mehrfach öffentlich bestätigt. Ein runder oder beidseitig verwendbarer Stecker war technisch möglich – hätte aber <strong>doppelt so viele Leitungen und Chips</strong> erfordert.</p>
<p>Der Zweck von USB war, einen Standard zu schaffen, der so billig ist, dass alle Hersteller mitmachen. Jeder zusätzliche Cent hätte die Verbreitung gefährdet.</p>
<p>Bhatt sagte dazu sinngemäß: Das größte Ärgernis sei, dass man den Stecker nicht auf Anhieb einstecken kann – aber die Alternative wäre ein Standard gewesen, den niemand übernommen hätte.</p>
<h4>Die Lösung kam 20 Jahre später</h4>
<p><strong>USB-C</strong> löst genau das – mit einem symmetrischen Steckerbild und doppelt vorhandenen Kontakten. Der Preis dafür ist gesunken, das Argument von 1996 gilt nicht mehr.</p>
<h4>Und was er nicht bekam</h4>
<p>Bhatt hat an USB nie Lizenzgebühren verdient: Intel gab den Standard bewusst frei, damit er sich durchsetzt. Er arbeitete als angestellter Ingenieur.</p>
<p>Bekannt wurde er trotzdem – 2009 warb Intel mit einem Werbespot, in dem ein Schauspieler ihn als Rockstar darstellte.</p>`,

{
id:'at-zeichen', t:'Das @-Zeichen', emoji:'📧', cat:'tech',
teaser:'Ein Mann suchte 1971 ein Zeichen, das garantiert in keinem Namen vorkommt.',
story:`<p><strong>Ray Tomlinson</strong> arbeitete an einem Projekt für das ARPANET, den Vorläufer des Internets. Es gab bereits Nachrichten zwischen Nutzern <em>desselben</em> Computers. Tomlinson wollte Nachrichten zwischen <em>verschiedenen</em> Computern schicken.</p>
<h4>Das Problem</h4>
<p>Er brauchte ein Trennzeichen zwischen Benutzername und Rechnername. Es musste ein Zeichen sein, das in keinem Namen vorkommen konnte – sonst wäre die Adresse mehrdeutig.</p>
<p>Er schaute auf seine Tastatur, ein Fernschreiber-Modell. Das <strong>@</strong> war praktisch unbenutzt und hatte im Englischen die passende Bedeutung: „at“, also „bei“. <em>user at host.</em> Fertig.</p>
<p>An den Inhalt der ersten E-Mail konnte sich Tomlinson später nicht erinnern – es sei vermutlich etwas wie „QWERTYUIOP“ gewesen, also eine Tastaturzeile. Er sagte, er habe damals nicht gedacht, dass das wichtig würde.</p>
<h4>Das Zeichen ist viel älter</h4>
<p>Das @ ist mindestens seit dem 16. Jahrhundert als kaufmännisches Zeichen belegt – ein Brief eines florentinischen Kaufmanns von 1536 verwendet es als Maßeinheit für Amphoren. Später stand es für „zum Stückpreis von“.</p>
<h4>Die Namen</h4>
<p>Weil das Zeichen in vielen Sprachen keinen Namen hatte, entstanden Beschreibungen: Im Niederländischen und Deutschen „Klammeraffe“, in Dänemark „Elefantenrüssel“, in Italien <em>chiocciola</em> (Schnecke), in Israel „Strudel“, in Ungarn <em>kukac</em> (Würmchen), in Tschechien <em>zavináč</em> (Rollmops).</p>`,
cool:'Ein jahrhundertealtes Buchhaltungssymbol wurde ausgewählt, weil es niemand benutzte – und ist heute in jeder Adresse der Welt.',
gold:'Ray Tomlinson wählte 1971 das @ für E-Mail-Adressen, weil es das einzige Zeichen war, das garantiert in keinem Namen vorkam.',
perfect:'Büro / Small Talk',
diff:'easy', mem:5, cert:'belegt',
src:'Interviews mit Ray Tomlinson; Forschung von Giorgio Stabile zum Brief von 1536',
rh:['emojis','ok','bug']

{
id:'emojis', t:'Woher Emojis kommen', emoji:'😀', cat:'tech',
teaser:'Erfunden für Handys, die kaum etwas anzeigen konnten – und heute im Museum of Modern Art.',
story:`<p>1999 arbeitete <strong>Shigetaka Kurita</strong> beim japanischen Mobilfunkanbieter NTT DoCoMo am mobilen Internetdienst <em>i-mode</em>.</p>
<h4>Das Problem</h4>
<p>Nachrichten waren auf sehr wenige Zeichen begrenzt, und die Displays winzig. In dieser Kürze ging Tonfall verloren. Ein knappes „Verstanden“ konnte freundlich oder wütend gemeint sein – ein in der japanischen Kommunikationskultur besonders heikles Problem.</p>
<p>Kuritas Lösung: ein Satz von <strong>176 Symbolen</strong>, je <strong>12 × 12 Pixel</strong>. Wetter, Verkehr, Stimmungen, Essen, Herz. Er orientierte sich an Manga-Konventionen, Piktogrammen und Wetterkarten.</p>
<p>Das Wort <em>emoji</em> hat übrigens nichts mit „Emotion“ zu tun. Es kommt von <strong>絵 (e = Bild)</strong> und <strong>文字 (moji = Zeichen)</strong> – Bildzeichen. Die Ähnlichkeit zu „emoticon“ ist reiner Zufall.</p>
<h4>Der Sprung</h4>
<p>Japanische Emojis waren lange nicht kompatibel. Erst als sie 2010 in den <strong>Unicode-Standard</strong> aufgenommen wurden, funktionierten sie weltweit. Apple hatte die Tastatur schon 2008 für Japan eingebaut – US-Nutzer entdeckten sie über einen Trick und wollten sie behalten.</p>
<h4>Museum</h4>
<p>2016 nahm das <strong>Museum of Modern Art</strong> in New York Kuritas Original-Set in seine Sammlung auf. Kurita selbst hat daran nie verdient; er entwarf es als Angestellter, und ein Patent gab es nicht.</p>`,
cool:'Ein Set aus 176 winzigen Pixelbildern, entworfen wegen technischer Einschränkungen, ist heute eine der meistgenutzten Zeichensammlungen der Welt.',
gold:'Emojis wurden 1999 in Japan erfunden, weil kurze Handynachrichten den Tonfall verloren – die ersten waren 12 × 12 Pixel groß und hängen heute im MoMA.',
perfect:'Small Talk / Party',
diff:'easy', mem:5, cert:'belegt',
src:'MoMA Sammlung „Original Emoji“; Unicode Consortium; Interviews mit Shigetaka Kurita',
rh:['at-zeichen','ok','wilhelm-scream']
},
{
id:'bug', t:'Warum Fehler „Bug“ heißen', emoji:'🐛', cat:'tech',
teaser:'Es gab tatsächlich eine Motte. Aber sie war nicht der Ursprung – sie war der Witz.',
story:`<p>Die Geschichte, die jeder kennt: 1947 fanden Technikerinnen und Techniker um <strong>Grace Hopper</strong> an der Harvard University eine <strong>Motte</strong>, die in einem Relais des Rechners Mark II festklemmte. Sie klebten sie ins Logbuch und notierten: <em>„First actual case of bug being found.“</em></p>
<p>Das Logbuch existiert wirklich, samt Motte, und liegt im Smithsonian.</p>
<h4>Der entscheidende Punkt</h4>
<p>Lies die Notiz genau: <strong>„first actual case“</strong> – der erste <em>tatsächliche</em> Fall. Der Satz ist ein Wortspiel. Er funktioniert nur, weil der Begriff <em>bug</em> für technische Störungen <strong>längst bekannt war</strong>.</p>
<h4>Wie alt ist er wirklich?</h4>
<p>Mindestens 70 Jahre älter. <strong>Thomas Edison</strong> schrieb 1878 in einem Brief von „Bugs“ in seinen Erfindungen – kleinen Fehlern, die sich im Betrieb zeigen. Der Begriff war im 19. Jahrhundert unter Ingenieuren gängig, unter anderem in der Telegrafie.</p>
<p>Die Vorstellung dahinter: ein winziges Wesen, das sich irgendwo eingenistet hat und Ärger macht.</p>
<h4>Und Grace Hopper?</h4>
<p>Ihre eigentliche Bedeutung liegt woanders. Sie entwickelte den ersten Compiler und arbeitete maßgeblich an <strong>COBOL</strong> mit – Software, die die Idee durchsetzte, dass Programmiersprachen für Menschen lesbar sein sollten. COBOL läuft bis heute in Bankensystemen.</p>
<p>Sie erklärte auch die Nanosekunde anschaulich, indem sie Drahtstücke von etwa 30 Zentimetern verteilte: die Strecke, die Licht in einer Nanosekunde zurücklegt.</p>`,

id:'wifi', t:'WLAN und Wi-Fi', emoji:'📶', cat:'tech',
teaser:'„Wi-Fi“ bedeutet gar nichts. Und die Technik dahinter stammt aus der Suche nach explodierenden Schwarzen Löchern.',
story:`<p>Der technische Name des Standards ist <strong>IEEE 802.11b Direct Sequence</strong>. Damit lässt sich schlecht werben.</p>
<h4>Der Name</h4>
<p>1999 beauftragte die Industrievereinigung die Markenagentur Interbrand. Sie schlug <strong>„Wi-Fi“</strong> vor – ein Wortspiel, das an „Hi-Fi“ erinnert und gut klingt. Eine Bedeutung hat es nicht.</p>
<p>Weil manche Mitglieder etwas Erklärendes wollten, hängte man kurzzeitig den Slogan „The Standard for Wireless Fidelity“ darunter. Das war ein Fehler: Seither glauben viele, Wi-Fi stehe für „Wireless Fidelity“ – was schlicht keinen Sinn ergibt. Der Slogan wurde stillschweigend fallen gelassen.</p>
<p>Im Deutschen setzte sich stattdessen <strong>WLAN</strong> durch (Wireless Local Area Network) – deshalb versteht im englischsprachigen Ausland kaum jemand, was gemeint ist.</p>
<h4>Und die Technik?</h4>
<p>Ein zentrales Verfahren zur Entzerrung von Funksignalen in geschlossenen Räumen geht auf Arbeiten des australischen Radioastronomen <strong>John O'Sullivan</strong> und seines Teams zurück. Sie hatten in den 1970er/80er-Jahren nach schwachen Radiosignalen gesucht, die von verdampfenden Schwarzen Löchern stammen sollten.</p>
<p>Die Schwarzen Löcher fanden sie nie. Aber die mathematische Methode, ein schwaches Signal aus einem Wirrwarr von Echos herauszurechnen, war exakt das Problem, das WLAN in Wohnungen hat: Funkwellen, die von Wänden reflektiert werden.</p>
<p>Die australische Forschungsorganisation CSIRO erstritt daraus später Patenteinnahmen in Höhe von mehreren hundert Millionen Dollar.</p>`,
cool:'Eine gescheiterte Suche nach Schwarzen Löchern hat die Technik hervorgebracht, mit der du wahrscheinlich gerade diesen Text liest.',
gold:'„Wi-Fi“ ist ein bedeutungsloser Marketingname – und ein Kernverfahren dahinter stammt aus der erfolglosen Suche australischer Astronomen nach explodierenden Schwarzen Löchern.',
perfect:'Small Talk / Büro',

id:'diskette-icon', t:'Warum Speichern eine Diskette ist', emoji:'💾', cat:'tech',
teaser:'Ein Symbol für ein Objekt, das ganze Generationen noch nie gesehen haben.',
story:`<p>Das Speichern-Symbol zeigt eine <strong>3,5-Zoll-Diskette</strong>: Plastikgehäuse, Metallschieber, in den 1980ern und 90ern der Standard. Kapazität: 1,44 Megabyte. Ein einziges Handyfoto passt heute nicht darauf.</p>
<h4>Warum es bleibt</h4>
<p>Icons funktionieren nicht dadurch, dass sie etwas Reales abbilden, sondern dadurch, dass sie <strong>gelernt</strong> sind. Sobald ein Symbol universell verstanden wird, ist ein Wechsel teuer und riskant: Man müsste Milliarden Menschen umlernen lassen, um ein Detail zu verbessern, das niemanden stört.</p>
<p>Das ist derselbe Mechanismus wie bei der QWERTY-Tastatur.</p>
<h4>Die anderen Zombies</h4>
<p><strong>Der Telefonhörer</strong>: Die Form mit Mikrofon und Hörer an einem Bügel stammt aus den 1930ern. Kaum ein heute verkauftes Telefon sieht so aus.</p>
<p><strong>Die Aufnahme-Anzeige</strong>: Der rote Punkt kommt vom Aufnahmeknopf mechanischer Rekorder.</p>
<p><strong>Das Mülleimer-Symbol</strong>: eingeführt bei Apples Lisa 1983 und Macintosh 1984.</p>
<p><strong>Der „Vorspulen“-Doppelpfeil</strong>: Kassettenrekorder.</p>
<p><strong>Das Lesezeichen</strong>: ein Stück Stoff in einem gebundenen Buch.</p>
<p>Die Fachliteratur nennt solche Symbole <strong>Skeuomorphismen</strong> – Gestaltungselemente, die eine Funktion aus einer früheren Technologie zitieren, obwohl sie technisch nicht mehr nötig sind.</p>
<p>Fun Fact: Der Klang, den Handys beim Fotografieren machen, ist der Verschluss einer Spiegelreflexkamera – nachgebaut, weil ein lautloses Foto sich falsch anfühlt (und in einigen Ländern gesetzlich vorgeschrieben ist).</p>`,

id:'passwort-regeln', t:'Warum Passwörter Sonderzeichen brauchen', emoji:'🔑', cat:'tech',
teaser:'Der Mann, der diese Regel geschrieben hat, hat sich später öffentlich dafür entschuldigt.',
story:`<p>2003 verfasste <strong>Bill Burr</strong>, damals beim US-Institut NIST, ein achtseitiges Dokument mit Empfehlungen für Passwörter: Groß- und Kleinbuchstaben, Zahlen, Sonderzeichen – und regelmäßiger Wechsel.</p>
<p>Dieses Papier wurde weltweit zur Grundlage von IT-Richtlinien. Praktisch jede Passwortmaske, die dich zu einem Sonderzeichen zwingt, geht darauf zurück.</p>
<h4>Das Problem</h4>
<p>Burr sagte 2017 in einem Interview mit dem <em>Wall Street Journal</em> sinngemäß: Vieles, was er damals empfohlen habe, bereue er. Er habe unter Zeitdruck gearbeitet und sich auf ältere Literatur gestützt, weil belastbare Daten fehlten.</p>
<p>Denn was Menschen tatsächlich tun, wenn man ihnen diese Regeln gibt, ist vorhersagbar: Aus „passwort“ wird <strong>„Passwort1!“</strong>. Beim erzwungenen Wechsel wird daraus „Passwort2!“. Angreifer wissen das – Passwortknack-Software probiert genau diese Muster zuerst.</p>
<p>Das Ergebnis: Passwörter, die für Menschen schwer zu merken und für Computer leicht zu raten sind. Genau falsch herum.</p>
<h4>Was heute empfohlen wird</h4>
<p>Die überarbeiteten NIST-Richtlinien empfehlen: <strong>Länge statt Komplexität</strong>, keine erzwungenen regelmäßigen Wechsel (nur bei Verdacht auf Kompromittierung), und Abgleich mit Listen bekannter geleakter Passwörter.</p>
<p>Vier zufällige Wörter sind rechnerisch deutlich stärker als „Tr0ub4dor&amp;3“ – und man kann sie sich merken. Der Webcomic <em>xkcd</em> hat das 2011 in einem Bild erklärt, das seither in Sicherheitsschulungen hängt.</p>`,
cool:'Eine Regel, die Milliarden Menschen täglich nervt, war von Anfang an ein Notbehelf – und der Autor hat sie öffentlich zurückgenommen.',
gold:'Die Sonderzeichen-Regel für Passwörter geht auf ein NIST-Papier von 2003 zurück – dessen Autor sich später entschuldigte. Empfohlen wird heute Länge statt Komplexität.',
perfect:'Büro / Small Talk',

src:'NIST Special Publication 800-63B; Interview Bill Burr, Wall Street Journal (2017)',

id:'papierkorb-name', t:'Der Papierkorb auf dem Bildschirm', emoji:'🗑️', cat:'tech',
teaser:'Warum es einen Ordner für Dinge gibt, die man doch eigentlich loswerden wollte.',
story:`<p>Der Papierkorb erschien 1983 auf <strong>Apples Lisa</strong> und wurde mit dem Macintosh 1984 berühmt. Die Idee dahinter war Teil eines größeren Konzepts: die <strong>Schreibtisch-Metapher</strong>.</p>
<p>Menschen sollten einen Computer bedienen können, ohne Befehle zu lernen. Also bekam der Bildschirm Dinge, die man aus einem Büro kennt: Dokumente, Ordner, einen Schreibtisch – und einen Papierkorb.</p>
<h4>Der eigentlich clevere Teil</h4>
<p>Ein Papierkorb ist im echten Büro genau deshalb praktisch, weil man <strong>hineingreifen kann</strong>. Etwas wegwerfen ist reversibel, bis geleert wird. Genau diese Eigenschaft wurde übernommen – und löste ein zentrales Problem früher Computer: Löschen war endgültig und passierte oft aus Versehen.</p>
<h4>Warum er woanders anders heißt</h4>
<p>Microsoft konnte den Papierkorb wegen Apples Designrechten nicht einfach übernehmen. Windows 95 bekam deshalb den <strong>„Recycle Bin“</strong> – ein Wertstoffbehälter, kein Mülleimer.</p>
<p>Apple hatte zudem ein bekanntes Bedienproblem: Bei frühen Macs zog man eine <strong>Diskette in den Papierkorb</strong>, um sie auszuwerfen. Neue Nutzer waren regelmäßig überzeugt, damit alle Daten zu löschen. Das Symbol änderte sich später beim Ziehen in ein Auswurfzeichen.</p>
<p>Übrigens: „In den Papierkorb legen“ löscht die Datei physisch gar nicht. Erst das Leeren gibt den Speicherplatz frei – und selbst dann werden die Daten meist nur als überschreibbar markiert. Deshalb ist Datenwiederherstellung überhaupt möglich.</p>`,
cool:'Der Papierkorb ist eine der wenigen Metaphern, bei der nicht das Aussehen übernommen wurde, sondern eine unscheinbare Eigenschaft: dass man wieder hineingreifen kann.',
gold:'Der Papierkorb kam 1983 mit Apples Lisa – kopiert wurde nicht die Optik, sondern dass man aus einem echten Papierkorb noch etwas herausholen kann.',
perfect:'Büro / Small Talk',

src:'Apple Lisa / Macintosh Designdokumentation; Xerox PARC Forschung zur Desktop-Metapher',

id:'ikea', t:'IKEA', emoji:'🪑', cat:'marken',
teaser:'Der Name ist ein Akronym – und zwei der Buchstaben sind ein Bauernhof.',
story:`<p><strong>I</strong>ngvar <strong>K</strong>amprad, <strong>E</strong>lmtaryd, <strong>A</strong>gunnaryd.</p>
<p>Die ersten beiden Buchstaben sind der Gründer. <strong>Elmtaryd</strong> ist der Bauernhof, auf dem er aufwuchs. <strong>Agunnaryd</strong> ist das Dorf in Småland, zu dem der Hof gehört.</p>
<p>Kamprad gründete die Firma <strong>1943 im Alter von 17 Jahren</strong> – zunächst als Versandhandel für Streichhölzer, Kugelschreiber, Bilderrahmen und Nylonstrümpfe. Möbel kamen erst 1948 dazu.</p>
<h4>Die Idee mit dem Bein</h4>
<p>1956 versuchte ein Mitarbeiter, einen Tisch in ein Auto zu bekommen, und schraubte die Beine ab. Daraus wurde das Prinzip <strong>Flachpaket</strong>. Der Grund war nicht Design, sondern Transportkosten – Luft zu transportieren ist teuer. Der Kunde übernimmt Transport und Montage und zahlt dafür weniger.</p>
<h4>Warum die Produkte Namen haben</h4>
<p>Kamprad war Legastheniker und tat sich mit Artikelnummern schwer. Also bekamen Produkte <strong>Namen</strong> statt Codes – nach einem festen System: Betten und Schränke tragen norwegische Ortsnamen, Teppiche dänische, Stoffe und Gardinen Frauennamen, Stühle Männernamen, Badezimmerartikel skandinavische Gewässer.</p>
<p>Das führte gelegentlich zu Problemen. Einige Namen bedeuten in anderen Sprachen Dinge, die IKEA so nicht geplant hatte.</p>
<h4>Und die Farben?</h4>
<p>Blau-Gelb sind die Farben der schwedischen Flagge. Bis 1983 war das Logo allerdings rot-weiß.</p>`,

id:'nike-swoosh', t:'Der Nike-Swoosh', emoji:'✔️', cat:'marken',
teaser:'Das berühmteste Logo der Welt kostete 35 Dollar. Aber die Geschichte hat ein zweites Kapitel.',
story:`<p>1971 suchte <strong>Phil Knight</strong>, damals Buchhaltungsdozent und Nebenerwerbs-Schuhhändler, ein Logo für seine neue Marke. Er fragte <strong>Carolyn Davidson</strong>, eine Grafikdesign-Studentin an der Portland State University, die er von der Uni kannte.</p>
<p>Sie entwarf mehrere Varianten. Knight wählte eine aus – nicht begeistert. Sein überliefertes Urteil: <em>„Ich mag es nicht, aber vielleicht wächst es mir noch ans Herz.“</em></p>
<p>Rechnung: <strong>35 Dollar</strong>, bei 2 Dollar Stundensatz, also 17,5 Stunden Arbeit. Nach heutiger Kaufkraft ungefähr 250 bis 280 Dollar.</p>
<h4>Der Name</h4>
<p>Die Firma hieß bis dahin <em>Blue Ribbon Sports</em>. Mitarbeiter Jeff Johnson schlug „Nike“ vor – nach der griechischen Siegesgöttin. Er habe den Namen, so die Erzählung, in einem Traum gehabt. Knight fand ihn zunächst mittelmäßig, aber die Zeit drängte.</p>
<h4>Das zweite Kapitel</h4>
<p>Die 35 Dollar sind der Teil, den alle kennen. Weniger bekannt: <strong>1983</strong> lud Nike Davidson zu einem Essen ein und überreichte ihr einen goldenen Swoosh-Ring mit Diamant – und ein Aktienpaket des Unternehmens.</p>
<p>Die genaue Höhe wurde nie offiziell bestätigt; berichtet wird von 500 Aktien, die durch Splits und Kursentwicklung über die Jahrzehnte einen Wert im deutlich siebenstelligen Bereich erreicht haben dürften. Davidson hat sie nach eigenen Aussagen nie verkauft.</p>`,

teaser:'Zwei Weltmarken, ein Ort, zwei Brüder – die bis zum Tod nicht mehr miteinander sprachen.',
story:`<p>In <strong>Herzogenaurach</strong> in Franken bauten die Brüder <strong>Adolf („Adi“) und Rudolf Dassler</strong> ab den 1920ern gemeinsam Sportschuhe. Sie waren erfolgreich: Bei den Olympischen Spielen 1936 lief Jesse Owens in Dassler-Schuhen zu vier Goldmedaillen.</p>
<h4>Der Bruch</h4>
<p>Was genau passierte, ist bis heute nicht restlos geklärt. Überliefert sind ein Zerwürfnis während eines Luftangriffs im Krieg – Rudolf soll eine Bemerkung Adis auf sich bezogen haben – sowie Streit über die Rolle beider in der NS-Zeit und über die Firmenführung.</p>
<p><strong>1948</strong> teilten sie das Unternehmen. Adi gründete <strong>Adidas</strong> (Adi Dassler), Rudolf zuerst „Ruda“, dann <strong>Puma</strong>. Die beiden Firmen lagen an gegenüberliegenden Ufern der Aurach.</p>
<h4>Die geteilte Stadt</h4>
<p>Herzogenaurach war jahrzehntelang gespalten. Es gab Bäckereien, Kneipen und Vereine, die zu der einen oder anderen Seite gehörten. Die Stadt bekam den Spitznamen <em>„Stadt der gebückten Nacken“</em> – weil man Fremden zuerst auf die Schuhe schaute, um zu wissen, mit wem man es zu tun hat.</p>
<p>Die Brüder sprachen bis zu ihrem Tod nicht mehr miteinander. Beide sind auf demselben Friedhof begraben – so weit voneinander entfernt wie möglich.</p>
<h4>Das Ende der Fehde</h4>
<p>Erst <strong>2009</strong> spielten Mitarbeitende beider Unternehmen ein gemeinsames Freundschaftsfußballspiel – über 60 Jahre nach der Trennung.</p>`,

id:'apple-logo', t:'Der Apfel mit dem Biss', emoji:'🍎', cat:'marken',
teaser:'Die schöne Turing-Theorie ist leider falsch. Der echte Grund ist erstaunlich banal.',
story:`<p>Eine beliebte Erzählung: Der angebissene Apfel sei eine Hommage an <strong>Alan Turing</strong>, den Pionier der Informatik, der 1954 durch einen mit Zyanid versetzten Apfel starb.</p>
<h4>Der Designer widerspricht</h4>
<p><strong>Rob Janoff</strong>, der das Logo 1977 entwarf, hat das mehrfach klar verneint. Seine Begründung ist rein praktisch: Ohne Biss sieht ein Apfel in kleiner Darstellung <strong>aus wie eine Kirsche oder eine Tomate</strong>. Der Biss macht die Silhouette eindeutig.</p>
<p>Dass <em>bite</em> und <em>byte</em> gleich klingen, fiel ihm nach eigener Aussage erst hinterher auf – ein hübscher Zufall.</p>
<p>Steve Jobs habe ihm bei der Beauftragung nur eine Vorgabe gemacht: <em>„Mach es nicht niedlich.“</em></p>
<h4>Und die Regenbogenfarben?</h4>
<p>Kein Symbol für Vielfalt, sondern Technik-Werbung. Der Apple II war einer der ersten Heimcomputer mit <strong>Farbgrafik</strong>. Die Streifen zeigten das. Dass sie nicht in der Reihenfolge des Spektrums stehen, war eine Designentscheidung – Grün nach oben, wegen des Blatts.</p>
<p>Die Farbversion war in der Produktion teuer und wurde 1998 aufgegeben.</p>
<h4>Und der Firmenname?</h4>
<p>Jobs hatte laut Steve Wozniak zuvor auf einer Obstfarm gearbeitet und ernährte sich zeitweise sehr fruchtlastig. „Apple“ klang für ihn freundlich und unbedrohlich – das Gegenteil der damaligen Computerbranche mit Namen wie IBM oder Digital Equipment. Außerdem stand es im Telefonbuch vor „Atari“.</p>`,

story:`<p>1994 wollte <strong>Jeff Bezos</strong> seine Firma <strong>Cadabra</strong> nennen – wie „Abrakadabra“, also Magie.</p>
<p>Sein Anwalt hörte am Telefon <em>„Cadaver“</em> – Leiche. Der Name wurde verworfen.</p>
<h4>Der Buchstabe A</h4>
<p>Bezos ging das Wörterbuch durch und blieb bei <strong>Amazon</strong> hängen. Zwei Gründe:</p>
<p><strong>1.</strong> Der Amazonas ist der größte Fluss der Welt, gemessen an der Wassermenge – ein Bild für „größter Buchladen der Welt“.</p>
<p><strong>2.</strong> Ganz pragmatisch: Websiteverzeichnisse listeten in den frühen Neunzigern <strong>alphabetisch</strong>. Ein A am Anfang war ein realer Wettbewerbsvorteil.</p>
<p>Registriert wurden auch relentless.com – „unerbittlich“. Diese Domain gehört Amazon bis heute und leitet auf amazon.com weiter.</p>
<h4>Der Pfeil</h4>
<p>Das Logo zeigt einen Pfeil <strong>von A nach Z</strong>: alles, was es gibt. Gleichzeitig formt er ein Lächeln.</p>
<h4>Die Regel</h4>
<p>Aus derselben Frühzeit stammt eine Führungsregel, die Bezos bekannt gemacht hat: die <strong>„Two Pizza Rule“</strong>. Ein Team soll nie größer sein, als dass zwei Pizzen alle satt machen. Größere Teams verbringen laut Bezos mehr Zeit mit Koordination als mit Arbeit.</p>`,

id:'lego', t:'LEGO', emoji:'🧱', cat:'marken',
teaser:'Der Name ist dänisch – und bedeutet auf Latein zufällig genau das Richtige.',
story:`<p><strong>Ole Kirk Christiansen</strong> war Tischler in Billund, Dänemark. In der Wirtschaftskrise der 1930er brach sein Geschäft mit Häusern und Möbeln weg. Er stellte um auf das, was Menschen auch in schlechten Zeiten kaufen: <strong>Holzspielzeug</strong>.</p>
<h4>Der Name</h4>
<p>1934 suchte er einen Firmennamen und schrieb einen Wettbewerb unter seinen Angestellten aus. Gewonnen hat er selbst, mit <strong>LEG GODT</strong> – dänisch für „spiel gut“, zusammengezogen zu <em>LEGO</em>.</p>
<p>Der oft erzählte Zusatz: Auf <strong>Latein</strong> bedeutet <em>lego</em> „ich lese“ oder „ich füge zusammen“. Die Firma betont selbst, dass sie diesen Zufall erst Jahre später bemerkt habe.</p>
<h4>Der Stein</h4>
<p>1947 kaufte Christiansen als einer der ersten in Dänemark eine <strong>Kunststoffspritzgussmaschine</strong> – gegen erhebliche Bedenken. Plastik galt als billiger Ersatzstoff. Die frühen Steine hielten schlecht zusammen.</p>
<p>Erst <strong>1958</strong> meldete sein Sohn Godtfred das entscheidende Patent an: die <strong>Röhren an der Unterseite</strong>. Sie erzeugen Klemmkraft und machen den Stein stabil in jeder Position.</p>
<p>Diese Geometrie ist so präzise, dass ein Stein von 1958 auf einen von heute passt. Die Fertigungstoleranz liegt im Bereich weniger tausendstel Millimeter.</p>
<h4>Und die Zahlen</h4>
<p>Rechnerisch lassen sich sechs klassische 2×4-Steine derselben Farbe auf über <strong>915 Millionen</strong> Arten kombinieren – eine Zahl, die LEGO selbst nachrechnen ließ.</p>`,

teaser:'Die Firma ist älter als das Auto – und hat vor Videospielen ziemlich alles ausprobiert.',
story:`<p>Nintendo wurde <strong>1889</strong> in Kyoto gegründet. Nicht 1989. 1889.</p>
<p>Das Geschäft: handgemalte <strong>Hanafuda</strong>-Spielkarten. Diese wurden auch in Spielhallen genutzt, die teilweise der Yakuza nahestanden – ein Umstand, der in der Firmengeschichte gerne kurz gehalten wird.</p>
<h4>Die Suchphase</h4>
<p>In den 1960ern versuchte Enkel <strong>Hiroshi Yamauchi</strong>, das Unternehmen zu diversifizieren. Die Liste ist beeindruckend:</p>
<p>Ein <strong>Taxiunternehmen</strong>. Eine Kette von <strong>Stundenhotels</strong>. <strong>Instantnudeln</strong>. Ein <strong>Staubsauger</strong>. Ein <strong>Kopiergerät</strong>. Fast alles scheiterte.</p>
<h4>Der Wendepunkt</h4>
<p>Ein Wartungsingenieur namens <strong>Gunpei Yokoi</strong> bastelte in seiner Freizeit einen ausfahrbaren Greifarm. Yamauchi sah ihn, ließ ihn als Spielzeug produzieren – die <em>Ultra Hand</em> verkaufte sich über eine Million Mal.</p>
<p>Yokoi wurde daraufhin in die Produktentwicklung versetzt und prägte Nintendo über Jahrzehnte: <strong>Game &amp; Watch</strong>, das <strong>Steuerkreuz</strong> und der <strong>Game Boy</strong> gehen auf ihn zurück.</p>
<p>Seine Entwicklungsphilosophie hat einen Namen: <em>„verdorrte Technologie in horizontaler Anwendung“</em> – nimm billige, ausgereifte, langweilige Technik und finde eine neue Verwendung dafür. Der Game Boy war technisch seinen Konkurrenten unterlegen, hatte kein Farbdisplay – und schlug sie alle, weil die Batterie ewig hielt.</p>
<p>Und der Name? <em>Nintendo</em> wird meist übersetzt als „überlasse das Glück dem Himmel“. Auch das ist nicht eindeutig belegt; die Firma selbst hat die Bedeutung nie offiziell festgelegt.</p>`,

teaser:'Die Kette wäre beinahe nach einem Walfangschiff benannt worden.',
story:`<p>1971 eröffneten drei Freunde in Seattle einen Laden, der <strong>Kaffeebohnen und Geräte</strong> verkaufte – keine Getränke. Einer von ihnen war Englischlehrer, alle drei mochten <em>Moby Dick</em>.</p>
<h4>Der Beinahe-Name</h4>
<p>Ihr Favorit war <strong>„Pequod“</strong> – das Schiff aus dem Roman. Ihr Werbepartner Terry Heckler soll eingewandt haben, dass niemand ein Getränk mit dem Namensbestandteil „pee“ bestellen wolle.</p>
<p>Man suchte weiter und kam auf Ortsnamen aus der Region – darunter <em>Starbo</em>, ein alter Bergarbeiterort. Von dort war es nicht weit zu <strong>Starbuck</strong>, dem ersten Steuermann der Pequod. Das Plural-S kam dazu, weil es besser klang.</p>
<p>Anders als oft erzählt trinkt Starbuck im Roman keinen Kaffee. Der Bezug ist die Seefahrt, nicht die Figur.</p>
<h4>Die Sirene</h4>
<p>Das Logo zeigt eine zweischwänzige Sirene aus einem alten nordischen Holzschnitt – passend zum Hafenthema. Die Originalversion war deutlich freizügiger und wurde über die Jahrzehnte mehrfach entschärft und näher herangezoomt.</p>
<h4>Der eigentliche Gründer</h4>
<p><strong>Howard Schultz</strong> kam 1982 als Marketingchef dazu. Auf einer Italienreise 1983 sah er in Mailand die Espressobar-Kultur und wollte das übertragen. Die Gründer lehnten ab – sie waren Bohnenhändler.</p>
<p>Schultz ging, gründete eine eigene Kette und <strong>kaufte Starbucks 1987 auf</strong>. Zu diesem Zeitpunkt gab es sechs Filialen.</p>`,

teaser:'Ein Name, der in jeder Sprache funktioniert – und ein Marketingstunt im Ärmelkanal.',
story:`<p><strong>Hans Wilsdorf</strong>, ein Deutscher, gründete sein Uhrenunternehmen 1905 in London. Er brauchte einen Markennamen mit klaren Anforderungen: <strong>kurz, in jeder Sprache aussprechbar, auf jedem Zifferblatt lesbar</strong>.</p>
<p>Wilsdorfs eigene Erklärung: Der Name sei ihm auf einer Kutschfahrt durch London eingefallen – so, als hätte ihn jemand ins Ohr geflüstert. Eine belegte Wortherleitung gibt es nicht.</p>
<h4>Das eigentliche Problem</h4>
<p>Armbanduhren galten damals als Frauenschmuck. Männer trugen Taschenuhren. Und vor allem: Armbanduhren waren <strong>unzuverlässig</strong> – Staub, Feuchtigkeit, Erschütterung.</p>
<p>1926 stellte Rolex die <strong>Oyster</strong> vor, ein wasserdichtes, verschraubtes Gehäuse. Nur: Wie überzeugt man Menschen davon?</p>
<h4>Der Stunt</h4>
<p>1927 wollte die junge Britin <strong>Mercedes Gleitze</strong> als erste Engländerin den Ärmelkanal durchschwimmen. Ihr erster erfolgreicher Versuch wurde angezweifelt, sie startete einen öffentlichen Wiederholungsversuch.</p>
<p>Wilsdorf gab ihr eine Oyster an einer Kette um den Hals mit. Das Wasser war so kalt, dass Gleitze nach über zehn Stunden bewusstlos aus dem Wasser geholt werden musste – sie schaffte die Strecke nicht.</p>
<p>Die Uhr lief. Wilsdorf schaltete eine <strong>ganzseitige Anzeige auf der Titelseite der Daily Mail</strong>. Es gilt als eines der ersten modernen Sport-Sponsorings der Geschichte.</p>
<p>Und wem gehört Rolex? Wilsdorf hatte keine Kinder und übertrug das Unternehmen 1944 einer <strong>Stiftung</strong>. Rolex ist bis heute in Stiftungsbesitz, nicht börsennotiert und veröffentlicht keine Zahlen.</p>`,

teaser:'Das Wappentier stammt von einem abgestürzten Kampfpiloten – und die Mutter schenkte es weiter.',
story:`<p><strong>Francesco Baracca</strong> war der erfolgreichste italienische Jagdflieger des Ersten Weltkriegs, mit 34 bestätigten Luftsiegen. Auf seinem Flugzeug trug er ein <strong>schwarzes, sich aufbäumendes Pferd</strong> – vermutlich abgeleitet vom Wappen seines Kavallerieregiments.</p>
<p>1918 wurde Baracca über dem Montello abgeschossen und starb.</p>
<h4>Die Begegnung</h4>
<p>1923 gewann der junge Rennfahrer <strong>Enzo Ferrari</strong> ein Rennen in Ravenna. Dort lernte er nach eigener Schilderung Baraccas Eltern kennen. Die Mutter, Gräfin Paolina, soll ihm gesagt haben, er solle das Pferd seines Sohnes auf seine Wagen malen – es bringe Glück.</p>
<p>Ferrari übernahm es. Den <strong>gelben Hintergrund</strong> fügte er selbst hinzu: Gelb ist die Farbe seiner Heimatstadt <strong>Modena</strong>. Baraccas Original-Pferd hatte zudem den Schweif nach unten; Ferrari richtete ihn auf.</p>
<h4>Und Porsche?</h4>
<p>Im Porsche-Wappen steckt ebenfalls ein Pferd – dort stammt es aus dem Stadtwappen von <strong>Stuttgart</strong>, das auf einem Gestüt („Stuotgarten“) gegründet wurde. Das Geweih und die Streifen kommen vom Wappen Württembergs.</p>
<p>Zwei Pferde, zwei völlig unabhängige Geschichten – eine militärisch, eine kommunalheraldisch.</p>
<h4>Und die Farbe Rot?</h4>
<p>Rennrot war keine Markenentscheidung, sondern eine <strong>Nationalfarbe</strong>: Im internationalen Motorsport bekam jedes Land eine Farbe zugewiesen – Italien Rot, Deutschland Weiß und später Silber, Frankreich Blau, Großbritannien Grün.</p>`,

id:'mcdonalds', t:'McDonald\'s', emoji:'🍟', cat:'marken',
teaser:'Die Brüder McDonald wollten gar nicht expandieren. Ein Milchshake-Vertreter schon.',
story:`<p><strong>Richard und Maurice McDonald</strong> betrieben in San Bernardino, Kalifornien, ein Drive-in-Restaurant. 1948 schlossen sie es und eröffneten neu – mit einem radikal reduzierten Konzept.</p>
<h4>Das Speedee-System</h4>
<p>Sie strichen die Speisekarte auf wenige Positionen zusammen, schafften Kellner, Teller und Besteck ab und organisierten die Küche wie ein <strong>Fließband</strong>: Jeder Handgriff hatte eine feste Station. Sie zeichneten den Ablauf angeblich in Kreide auf einen Tennisplatz und übten die Bewegungen durch.</p>
<p>Ergebnis: Ein Burger in Sekunden statt Minuten, zu einem Preis, den sich Familien leisten konnten.</p>
<h4>Der Vertreter</h4>
<p><strong>Ray Kroc</strong> verkaufte Multimixer für Milchshakes. Ihm fiel auf, dass ein einziges Restaurant in der Wüste Kaliforniens <strong>acht</strong> davon bestellt hatte – genug für 40 Shakes gleichzeitig. Er fuhr hin, sah die Schlange und erkannte das Potenzial.</p>
<p>1955 wurde er Franchise-Agent, 1961 kaufte er den Brüdern die Rechte für 2,7 Millionen Dollar ab.</p>
<h4>Der Streit</h4>
<p>Über eine mündlich zugesagte Umsatzbeteiligung von 0,5 % gibt es bis heute Streit; sie tauchte im finalen Vertrag nicht auf. Die Brüder verloren zudem das Recht an ihrem eigenen Namen – ihr ursprüngliches Restaurant musste in „The Big M“ umbenannt werden. Kroc eröffnete in der Nähe eine McDonald's-Filiale, die es verdrängte.</p>
<p>Kroc bezeichnete sich später öffentlich als Gründer und datierte die Firmengeschichte auf 1955, nicht 1940 oder 1948.</p>
<h4>Und das Logo?</h4>
<p>Die goldenen Bögen waren ursprünglich <strong>Architektur</strong>: zwei beleuchtete Bögen an den Seiten des Gebäudes, entworfen 1952, damit man den Laden von der Straße erkennt. Erst später wurden sie aus dem Blickwinkel zum M.</p>`,

teaser:'Nein, Coca-Cola hat ihn nicht erfunden. Aber die Wahrheit ist trotzdem interessant.',
story:`<p>Die Behauptung ist zäh: Coca-Cola habe den Weihnachtsmann rot-weiß gemacht, um die Firmenfarben zu bewerben.</p>
<h4>Warum das nicht stimmt</h4>
<p>Der rot gekleidete, dickliche, bärtige Weihnachtsmann existierte <strong>Jahrzehnte vor</strong> der Coca-Cola-Kampagne. Der Karikaturist <strong>Thomas Nast</strong> zeichnete ihn ab 1863 für die Zeitschrift <em>Harper's Weekly</em> – zunehmend in Rot, rund und mit weißem Bart. Auch das Gedicht „A Visit from St. Nicholas“ von 1823 beschreibt ihn bereits pelzgekleidet und rundlich.</p>
<p>Weitere rote Darstellungen finden sich in Werbung anderer Firmen, unter anderem bei White Rock Beverages in den 1920ern – vor Coca-Cola.</p>
<h4>Was Coca-Cola tatsächlich getan hat</h4>
<p>Ab <strong>1931</strong> zeichnete <strong>Haddon Sundblom</strong> für Coca-Cola über drei Jahrzehnte hinweg Weihnachtsmann-Anzeigen. Seine Version war warm, menschlich, mit Lachfalten – kein Elf, kein Bischof, sondern ein gemütlicher Großvatertyp.</p>
<p>Diese Bilder liefen jedes Jahr, weltweit, in enormer Auflage. Sie haben das <strong>visuelle Standardbild vereinheitlicht und global verbreitet</strong>. Das ist ein realer und großer Einfluss – nur eben kein Erfinden.</p>
<p>Und die Farbe hat einen älteren Grund: Der historische Nikolaus von Myra war <strong>Bischof</strong> – und rot ist eine Bischofsfarbe.</p>`,

id:'hollywood', t:'Warum Hollywood Hollywood ist', emoji:'🎬', cat:'pop',
teaser:'Die Filmindustrie zog nach Westen – auch, um vor Anwälten davonzulaufen.',
story:`<p>Die amerikanische Filmindustrie begann an der <strong>Ostküste</strong>, in New York und New Jersey. Warum sind dann alle nach Kalifornien gezogen?</p>
<h4>Grund 1: Das Wetter</h4>
<p>Frühe Filme brauchten <strong>Tageslicht</strong> – Studiobeleuchtung war schwach und teuer. Südkalifornien bietet über 300 Sonnentage im Jahr und in kurzer Entfernung Wüste, Berge, Meer und Wald. Man konnte praktisch jede Kulisse in einer Tagesfahrt erreichen.</p>
<h4>Grund 2: Thomas Edison</h4>
<p>Edison und andere hielten zentrale Patente auf Kameras und Projektoren und gründeten 1908 die <strong>Motion Picture Patents Company</strong> – ein Kartell, das Lizenzgebühren verlangte und unabhängige Produzenten mit Klagen und teils handfesteren Mitteln verfolgte.</p>
<p>Kalifornien lag weit entfernt, hatte eigene Gerichte – und im Notfall war die mexikanische Grenze nah. Die These, dass dies ein wesentlicher Antrieb war, ist unter Filmhistorikern <strong>umstritten</strong>: Manche halten das Wetter und billiges Land für die entscheidenden Faktoren. Beide Motive lassen sich in zeitgenössischen Quellen finden.</p>
<h4>Und der Name?</h4>
<p>Hollywood war ein <strong>Immobilienprojekt</strong>. Das Ehepaar Wilcox parzellierte ab 1887 ein Grundstück; der Name geht auf <strong>Daeida Wilcox</strong> zurück, die ihn nach eigener Darstellung von einer Zugbekanntschaft übernahm, die ihr Sommerhaus so genannt hatte. Mit Stechpalmen (<em>holly</em>) hat der Ort nichts zu tun – die wachsen dort nicht.</p>
<h4>Das Schild</h4>
<p>Das berühmte Schild war Werbung: Es stand 1923 dort und las sich <strong>„HOLLYWOODLAND“</strong> – für eine Wohnsiedlung. Es sollte nach eineinhalb Jahren abgebaut werden. Die letzten vier Buchstaben verschwanden 1949.</p>`,

teaser:'Derselbe Schrei ist seit 1951 in hunderten Filmen zu hören. Er ist ein Insider-Witz von Tontechnikern.',
story:`<p>1951 wurde für den Western <em>Distant Drums</em> eine Serie von Schreien aufgenommen – für eine Szene, in der ein Soldat von einem Alligator gepackt wird. Wer die Aufnahme sprach, ist nicht sicher belegt; häufig genannt wird der Schauspieler und Sänger <strong>Sheb Wooley</strong>.</p>
<p>Die Aufnahme landete im <strong>Soundeffekt-Archiv</strong> von Warner Bros. – und wurde von da an in beliebigen Filmen wiederverwendet, wie das bei Effektbibliotheken üblich war.</p>
<h4>Der Name</h4>
<p>1953 kam der Schrei im Film <em>The Charge at Feather River</em> vor, wo ihn eine Nebenfigur namens <strong>Private Wilhelm</strong> ausstößt, als sie einen Pfeil ins Bein bekommt. Diese Szene gab ihm später seinen Namen.</p>
<h4>Wie er zum Kult wurde</h4>
<p>Der Sounddesigner <strong>Ben Burtt</strong> stieß bei Recherchen in alten Archivbändern darauf, identifizierte die Herkunft und baute ihn bewusst in <em>Star Wars</em> ein – ein Sturmtruppler, der in einen Schacht stürzt.</p>
<p>Burtt gab dem Effekt den Namen „Wilhelm Scream“ und setzte ihn danach in Indiana Jones und weiteren Filmen ein. Andere Sounddesigner machten mit. Es wurde zum <strong>Erkennungszeichen einer Zunft</strong>: Wer ihn hört, weiß Bescheid.</p>
<p>Er ist in weit über 400 Filmen und Serien belegt – von Disney-Zeichentrick bis Tarantino.</p>
<h4>Der Nachklapp</h4>
<p>Inzwischen ist der Schrei so bekannt, dass manche Sounddesigner ihn bewusst meiden – er reißt Zuschauer aus dem Film heraus.</p>`,

{
id:'trailer', t:'Warum Trailer „Trailer“ heißen', emoji:'🎞️', cat:'pop',
teaser:'Sie liefen ursprünglich nach dem Film. Deshalb der Name.',
story:`<p><em>To trail</em> heißt „hinterherziehen“. Und genau da liefen sie: <strong>nach</strong> dem Hauptfilm.</p>
<h4>Wie es dazu kam</h4>
<p>Die verbreitete Darstellung führt den Ursprung auf einen Kinobetreiber in New York um 1913 zurück, der ans Ende einer Filmserie eine Ankündigung der nächsten Folge hängte – vergleichbar mit dem heutigen „nächste Woche bei…“.</p>
<p>Für das Kino war das praktisch: Der Film war zu Ende, die Werbung lief mit.</p>
<h4>Das Problem</h4>
<p>Nach dem Film gingen die Leute nach Hause. Die Werbung lief vor leeren Sälen.</p>
<p>Also wanderten Trailer nach vorn, wo sie ein gefangenes Publikum haben. Der <strong>Name blieb</strong> – obwohl er seit rund hundert Jahren das Gegenteil beschreibt.</p>
<h4>Warum Trailer so klingen, wie sie klingen</h4>
<p>Die tiefe Erzählerstimme („In einer Welt…“) ist stark mit einem Sprecher verbunden: <strong>Don LaFontaine</strong>, der nach eigener Angabe über <strong>5.000</strong> Filmtrailer sprach. Er erklärte den Standardsatz einmal so: Man müsse in wenigen Sekunden eine völlig fremde Welt etablieren – und dafür sei „In a world where…“ schlicht das effizienteste Werkzeug.</p>
<p>Und das dumpfe „BRAAAM“, das jahrelang in jedem zweiten Trailer steckte, stammt aus der Musik zu <em>Inception</em> (2010) von Hans Zimmer und wurde danach millionenfach nachgeahmt.</p>`,

{
id:'popcorn-kino', t:'Popcorn im Kino', emoji:'🍿', cat:'pop',
teaser:'Kinos haben Popcorn jahrzehntelang verboten – bis die Weltwirtschaftskrise kam.',
story:`<p>Frühe Kinos wollten sich als seriöse Kulturorte etablieren, in Konkurrenz zum Theater. Dazu passte kein knisterndes, krümelndes Essen. Viele Häuser hatten <strong>Teppiche</strong> und beschäftigten Personal in Uniform. Popcorn war Jahrmarktessen – und war ausdrücklich <strong>unerwünscht</strong>.</p>
<h4>Zwei Dinge änderten alles</h4>
<p><strong>1. Der Tonfilm (ab 1927).</strong> Vorher brauchte man Lesefähigkeit für Zwischentitel. Mit Ton wurde Kino für alle zugänglich – das Publikum wurde breiter und volkstümlicher.</p>
<p><strong>2. Die Weltwirtschaftskrise (ab 1929).</strong> Popcorn war extrem billig herzustellen. Eine Tüte kostete 5 bis 10 Cent – für viele Menschen der bezahlbarste Luxus überhaupt.</p>
<h4>Der Umweg</h4>
<p>Zuerst verkauften <strong>Straßenhändler</strong> vor den Kinos. Die Betreiber ärgerten sich – und begannen, den Händlern Standgebühren abzunehmen. Dann rechneten sie nach.</p>
<p>Wer in den 1930ern eine Popcornmaschine in die Lobby stellte, überlebte die Krise. Wer es nicht tat, häufig nicht.</p>
<h4>Warum es bis heute so teuer ist</h4>
<p>Kinos müssen einen erheblichen Anteil der Ticketeinnahmen an die Filmverleiher abführen – in den ersten Wochen eines Blockbusters oft den größten Teil. Am <strong>Popcorn</strong> verdienen sie dagegen fast alles selbst, bei sehr hoher Marge.</p>
<p>Salopp gesagt: Das Kino verkauft dir Popcorn und legt den Film gratis dazu.</p>`,
cool:'Der Geruch, den heute jeder mit Kino verbindet, war ursprünglich genau das, was Kinos unbedingt vermeiden wollten.',
gold:'Kinos verboten Popcorn anfangs – erst in der Weltwirtschaftskrise wurde es ihre Rettung. Heute verdienen sie daran mehr als am Ticket.',

id:'netflix-tadum', t:'Das Netflix-„Ta-dum“', emoji:'📺', cat:'pop',
teaser:'Zwei Töne, drei Sekunden – und eine sehr bewusste Entscheidung gegen etwas Längeres.',
story:`<p>Netflix hatte lange kein Erkennungszeichen. Als das Unternehmen zum Studio wurde, brauchte es eines – analog zum MGM-Löwen oder der Universal-Erdkugel.</p>
<h4>Die Vorgabe</h4>
<p>Der Chief Product Officer <strong>Todd Yellin</strong> gab dem Sounddesign-Team eine ungewöhnliche Richtung: Es sollte <strong>extrem kurz</strong> sein. Klassische Studio-Logos dauern 10 bis 25 Sekunden – etwas, das im Kino funktioniert, wo man nicht weglaufen kann.</p>
<p>Beim Streamen ist das anders: Jede Sekunde vor dem Inhalt ist eine Sekunde, in der jemand abbrechen kann. Bei Serien sieht man dasselbe Logo <strong>zehnmal an einem Abend</strong>. Was beim ersten Mal beeindruckt, nervt beim achten Mal.</p>
<h4>Die Suche</h4>
<p>Der Toningenieur <strong>Lon Bender</strong> arbeitete mit dem Komponisten Charlie Campagna an Dutzenden Varianten. In Interviews erwähnt Bender ungewöhnliche Klangquellen aus dem Prozess – unter anderem sei sogar ein zugeschlagener Ehering eines Kollegen und ein Schlag auf einen Schreibtisch getestet worden.</p>
<p>Auch Yellins eigenes Räuspern war laut Berichten kurzzeitig im Rennen. Es setzte sich nicht durch.</p>
<p>Das Ergebnis war das <strong>„Ta-dum“</strong>: zwei Schläge, tiefer Ton, unter drei Sekunden. Eingeführt 2015.</p>
<h4>Warum es funktioniert</h4>
<p>Ein <strong>Sonic Logo</strong> muss drei Dinge leisten: sofort erkennbar sein, keine Sprache brauchen und Wiederholung aushalten. Die bekanntesten Beispiele sind alle sehr kurz: der Intel-Vierklang, der Windows-Startton (komponiert von Brian Eno), die Telekom-Tonfolge.</p>`,
cool:'Ein Studio-Logo wurde bewusst so kurz gemacht, weil es im Streaming nicht beeindrucken, sondern das Achtmal-hintereinander-Sehen überleben muss.',

id:'oscar-name', t:'Warum der Oscar Oscar heißt', emoji:'🏆', cat:'pop',
teaser:'Angeblich, weil eine Bibliothekarin fand, die Figur sehe aus wie ihr Onkel.',
story:`<p>Offiziell heißt die Trophäe <strong>„Academy Award of Merit“</strong>. Niemand nennt sie so.</p>
<h4>Die bekannteste Erklärung</h4>
<p><strong>Margaret Herrick</strong>, damals Bibliothekarin und später Geschäftsführerin der Academy, soll die Statuette 1931 gesehen und gesagt haben, sie erinnere sie an ihren <strong>Onkel Oscar</strong>. Ein anwesender Journalist habe das aufgeschnappt und gedruckt.</p>
<p>Es gibt konkurrierende Versionen: Auch die Schauspielerin <strong>Bette Davis</strong> beanspruchte den Namen für sich – sie habe die Figur nach ihrem damaligen Ehemann Harmon Oscar Nelson benannt. Und der Kolumnist Sidney Skolsky nahm es ebenfalls für sich in Anspruch.</p>
<p>Die Academy selbst nennt die Herrick-Version als die verbreitetste, ohne sie definitiv zu bestätigen. Offiziell übernommen wurde der Spitzname erst <strong>1939</strong>.</p>
<h4>Was sicher ist</h4>
<p>Die Statuette wiegt rund 3,9 Kilogramm und zeigt einen Ritter, der ein Schwert auf eine Filmrolle stützt. Die fünf Speichen der Rolle stehen für die ursprünglichen fünf Zweige der Academy.</p>
<p>Während des Zweiten Weltkriegs wurden Oscars wegen Metallknappheit aus <strong>bemaltem Gips</strong> hergestellt. Nach dem Krieg konnten die Preisträger sie gegen Metallversionen eintauschen.</p>
<h4>Der Haken beim Verkauf</h4>
<p>Seit 1950 müssen Gewinner eine Vereinbarung unterschreiben: Wer den Oscar verkaufen will, muss ihn zuerst der Academy anbieten – <strong>für einen US-Dollar</strong>. Deshalb tauchen fast nur ältere Statuetten in Auktionen auf.</p>`,

id:'happy-birthday', t:'„Happy Birthday“', emoji:'🎂', cat:'pop',
teaser:'Das bekannteste Lied der Welt war bis 2016 rechtlich umstritten – und brachte Millionen ein.',
story:`<p>Die Melodie stammt von <strong>„Good Morning to All“</strong>, geschrieben 1893 von den Schwestern Patty und Mildred Hill – Patty war Kindergärtnerin, das Lied war ein Begrüßungslied für den Unterricht.</p>
<p>Wer den Geburtstagstext dazu erfand, ist unbekannt. Er taucht ab 1912 in Druckerzeugnissen auf.</p>
<h4>Der Rechtsstreit</h4>
<p>Der Musikverlag <strong>Warner/Chappell</strong> beanspruchte Urheberrechte an dem Lied und kassierte für jede kommerzielle Nutzung – in Filmen, Serien und Werbung. Berichtet wurden Einnahmen von rund <strong>zwei Millionen Dollar pro Jahr</strong>.</p>
<p>Deshalb singen Figuren in älteren Filmen und Serien beim Geburtstag oft irgendein <em>anderes</em> Lied. Für Produktionen war die Lizenz schlicht zu teuer – Beträge im fünfstelligen Bereich pro Verwendung waren nicht ungewöhnlich.</p>
<h4>Die Wende</h4>
<p>Eine Dokumentarfilmerin, die 1.500 Dollar für die Nutzung zahlen sollte, klagte. Im Verfahren tauchte ein <strong>Liederbuch von 1922</strong> auf, in dem der Text ohne Urheberrechtsvermerk abgedruckt war.</p>
<p>2015 entschied ein US-Gericht, dass Warner/Chappell die Rechte am <strong>Text</strong> nie wirksam erworben hatte. 2016 folgte ein Vergleich über 14 Millionen Dollar Rückzahlung. Seither gilt das Lied in den USA als gemeinfrei.</p>
<p>Ein ähnlicher Fall betraf „We Shall Overcome“, das 2018 ebenfalls für gemeinfrei erklärt wurde.</p>`,

id:'game-over', t:'Warum Videospiele Ostereier haben', emoji:'🥚', cat:'pop',
teaser:'Der erste Easter Egg war ein Protest gegen einen Arbeitgeber, der Namen verbot.',
story:`<p>Bei <strong>Atari</strong> wurden Ende der 1970er die Namen der Programmierer nicht genannt. Die Firma fürchtete, Konkurrenten könnten sie sonst abwerben – ein einzelner Entwickler schrieb damals ein komplettes Spiel allein.</p>
<h4>Die Reaktion</h4>
<p><strong>Warren Robinett</strong> entwickelte das Spiel <em>Adventure</em> (1979). Ohne die Firma zu informieren, versteckte er einen Raum, den man nur erreicht, wenn man einen praktisch unsichtbaren, ein Pixel großen Punkt findet, ihn an eine bestimmte Stelle bringt und durch eine Wand geht.</p>
<p>In diesem Raum steht in leuchtenden Buchstaben: <strong>„Created by Warren Robinett“</strong>.</p>
<p>Robinett verließ Atari, bevor es jemand bemerkte. Ein Spieler fand den Raum und schrieb an die Firma.</p>
<h4>Die Reaktion der Firma</h4>
<p>Atari erwog zunächst, den Code zu entfernen – das hätte aber bedeutet, das Spiel neu produzieren zu müssen. Ein Manager schlug stattdessen vor, solche versteckten Überraschungen künftig als <strong>Feature</strong> zu behandeln und nannte sie <em>Easter Eggs</em>.</p>
<p>Aus einem Akt der Auflehnung wurde eine Branchentradition.</p>
<h4>Und die Namensfrage?</h4>
<p>Die fehlende Anerkennung hatte noch eine andere Folge: Vier Atari-Entwickler gründeten aus Frust über mangelnde Beteiligung 1979 ein eigenes Unternehmen – <strong>Activision</strong>, den ersten unabhängigen Spielepublisher der Geschichte.</p>`,

id:'blockbuster', t:'Blockbuster', emoji:'💥', cat:'pop',
teaser:'Das Wort für den größten Kinoerfolg kommt aus dem Bombenkrieg.',
story:`<p>Im Zweiten Weltkrieg bezeichneten britische Zeitungen besonders schwere Luftminen als <strong>„blockbusters“</strong> – Bomben, deren Druckwelle einen kompletten Häuserblock zerstören konnte.</p>
<h4>Der Wechsel</h4>
<p>Nach dem Krieg wanderte das Wort in die Werbesprache: etwas mit enormer Wucht und Wirkung. Ab den 1950ern wurde es auf Filme, Bücher und Theaterstücke angewandt.</p>
<p>Eine zweite Erklärung wird oft genannt: Ein Film sei ein Blockbuster, wenn die Warteschlange <strong>um den ganzen Häuserblock</strong> reicht. Das ist eine nachträgliche Umdeutung – belegt ist der militärische Ursprung.</p>
<h4>Der Film, der die Bedeutung festzurrte</h4>
<p><em>Der weiße Hai</em> (1975) veränderte, wie Filme veröffentlicht werden. Bis dahin startete ein Film in wenigen Städten und breitete sich langsam aus, getragen von Mundpropaganda.</p>
<p>Universal machte es anders: gleichzeitiger Start in hunderten Kinos, massive <strong>landesweite Fernsehwerbung</strong>. Der Film spielte seine Kosten in Rekordzeit ein.</p>
<p>Zwei Jahre später bestätigte <em>Star Wars</em> das Modell – und die Branche stellte sich dauerhaft darauf um: Sommer-Starttermine, gewaltige Marketingbudgets, Merchandising.</p>
<h4>Die Ironie</h4>
<p><em>Der weiße Hai</em> funktioniert vor allem deshalb, weil der Hai kaum zu sehen ist – die mechanischen Haie funktionierten am Set ständig nicht. Spielberg musste die Bedrohung mit Musik und Kameraperspektive andeuten. Der größte Erfolg des Films entstand aus seinem größten technischen Problem.</p>`,

id:'cartoon-handschuhe', t:'Warum Cartoonfiguren Handschuhe tragen', emoji:'🧤', cat:'pop',
teaser:'Mickey Mouse, Bugs Bunny, Mario – alle tragen weiße Handschuhe. Der Grund ist Arbeitsökonomie.',
story:`<p>Es fällt erst auf, wenn man es einmal gesehen hat: Mickey Mouse, Donald Duck, Goofy, Bugs Bunny, Mario, Sonic – weiße Handschuhe, meist vierfingrig.</p>
<h4>Grund 1: Sichtbarkeit</h4>
<p>Frühe Zeichentrickfiguren waren <strong>schwarz</strong>, mit schwarzem Körper und schwarzen Armen. Wenn eine schwarze Hand vor einem schwarzen Körper agiert, sieht man nichts. Weiße Handschuhe trennen die Hände optisch vom Rest – wichtig, weil Zeichentrickfiguren extrem viel mit den Händen erzählen.</p>
<h4>Grund 2: Zeichenaufwand</h4>
<p>Jedes Bild wurde von Hand gezeichnet – bei 24 Bildern pro Sekunde. Eine anatomisch korrekte Hand mit Knöcheln, Fingernägeln und Gelenken ist enorm aufwendig und schwer konsistent zu halten.</p>
<p>Ein weicher Handschuh ohne Details ist schnell gezeichnet. <strong>Vier Finger</strong> statt fünf sparen zusätzlich Zeit – und wirken in der Cartoon-Proportion weniger überladen. Walt Disney soll gesagt haben, fünf Finger an einer Mausfigur sähen aus wie ein Bündel Bananen.</p>
<h4>Grund 3: Menschlichkeit</h4>
<p>Handschuhe machen aus Tierpfoten <strong>Hände</strong>. Eine Maus mit Pfoten ist ein Tier; eine Maus mit Handschuhen ist eine Figur mit Persönlichkeit.</p>
<h4>Der unangenehme Teil</h4>
<p>Es gibt einen weiteren, in der Forschung diskutierten Bezug: Die frühe amerikanische Animation war stilistisch stark von der <strong>Minstrel-Show</strong> geprägt – einer rassistischen Unterhaltungsform, zu deren Kostüm weiße Handschuhe gehörten. Filmhistorikerinnen und -historiker sehen darin einen realen Einfluss auf die frühe Cartoon-Ästhetik. Das ist bei Disney lange kein Thema gewesen und wird heute offener diskutiert.</p>`,

gold:'Cartoonfiguren tragen weiße Handschuhe, weil schwarze Hände vor schwarzen Körpern unsichtbar waren – und weil detaillierte Hände zu aufwendig zu zeichnen sind.',

id:'linksverkehr', t:'Warum manche Länder links fahren', emoji:'🛣️', cat:'kultur',
teaser:'Es hat mit Schwertern zu tun. Und mit Napoleon. Und mit einem einzigen Tag in Schweden.',
story:`<p>Rund ein Drittel der Weltbevölkerung fährt links – vor allem Großbritannien, Irland, Japan, Indien, Australien und das südliche Afrika.</p>
<h4>Die alte Erklärung</h4>
<p>Die meisten Menschen sind Rechtshänder. Wer im Mittelalter beritten unterwegs war, trug das Schwert links und zog es mit rechts. Auf der linken Straßenseite zu reiten hatte zwei Vorteile: Die rechte Schwerthand zeigt zum Entgegenkommenden, und beim Aufsteigen von links steht man am Straßenrand, nicht mitten im Verkehr.</p>
<p>England schrieb Linksverkehr 1835 gesetzlich fest und exportierte ihn ins gesamte Empire.</p>
<h4>Warum der Rest rechts fährt</h4>
<p>Zwei Faktoren. Erstens die großen amerikanischen <strong>Fuhrwerke</strong> mit mehreren Pferdepaaren: Der Fahrer saß auf dem hintersten linken Pferd, um mit der rechten Hand die Peitsche zu führen. Von dort sieht man den Gegenverkehr besser, wenn man rechts fährt.</p>
<p>Zweitens <strong>Napoleon</strong>. In den von Frankreich beherrschten Gebieten wurde Rechtsverkehr eingeführt – und blieb dort meist auch nach dem Rückzug. Die Landkarte des europäischen Verkehrs folgt bis heute grob den napoleonischen Grenzen.</p>
<h4>Der Tag H</h4>
<p>Schweden fuhr bis 1967 links, obwohl alle Nachbarn rechts fuhren und die meisten Autos Linkslenker waren. Am <strong>3. September 1967</strong>, dem <em>Dagen H</em>, wurde um 5 Uhr morgens landesweit umgestellt. Alle Fahrzeuge hielten an, wechselten die Seite und fuhren weiter.</p>
<p>Bemerkenswert: In den Monaten danach sank die Unfallzahl – vermutlich, weil alle extrem vorsichtig fuhren. Nach etwa zwei Jahren war sie wieder auf dem alten Niveau.</p>`,
